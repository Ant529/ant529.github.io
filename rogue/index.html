,  speed: 2 },\\n    { id: 'skull',  name: '骸骨守卫', spr: S.skull,  hp: 34, atk: 12, def: 5, xp: 30, f: [8, 10], ai: 'chase',  sense: 7,  speed: 1, elite: true }\\n  ];\\n  /* 武器：每把带 id（存档用）/ 攻击 / 描述；剧情武器额外带 skill（专属技能） */\\n  var WEAPONS = [\\n    { id: 'dagger',    name: '匕首',   spr: S.dagger,    atk: 2,  desc: '轻巧但没什么威慑力' },\\n    { id: 'knife',     name: '短剑',   spr: S.knife,     atk: 3,  desc: '还算趁手' },\\n    { id: 'sword',     name: '长剑',   spr: S.sword,     atk: 5,  desc: '标准冒险者配置' },\\n    { id: 'longsword', name: '重刃',   spr: S.longsword, atk: 7,  desc: '挥起来有点沉' },\\n    { id: 'hammer',    name: '战锤',   spr: S.hammer,    atk: 9,  desc: '砸碎骨头很在行' },\\n    { id: 'axe',       name: '双刃斧', spr: S.axe,       atk: 11, desc: '深渊铁匠的手艺' },\\n    /* ---- 剧情武器：属性远超同级，且带专属技能 ---- */\\n    { id: 'echo', name: '回响·终焉之刃', spr: S.staff, atk: 22, story: true,\\n      desc: '深渊的回响凝成的刃。它记得每一个倒在它面前的灵魂。',\\n      skill: { name: '终焉回响', cost: 50, cd: 4,\\n               desc: '时停一回合，并对视野内所有敌人造成 2.2 倍伤害' } },\\n    /* ---- 隐藏武器：调试面板可给 ---- */\\n    { id: 'bloodmoon', name: '血月弯刀', spr: S.spear, atk: 30, story: true,\\n      desc: '一把来路不明的刀，刀身在月光下会滴血。',\\n      skill: { name: '血月斩', cost: 40, cd: 3, desc: '对所有敌人造成 3 倍伤害并吸取生命' } }\\n  ];\\n  var STORY_WEAPON_ID = 'echo';\\n  /* 主动技能：能量条 = 击杀 + 回合累积，满了才能放 */\\n  var SKILLS = [\\n    { id: 'pierce', name: '穿刺斩', spr: S.spear, cost: 40, cd: 3, desc: '对相邻格一次造成 1.6 倍伤害，并击退到墙边' },\\n    { id: 'bolt',   name: '奥术弹', spr: S.wand,  cost: 40, cd: 3, desc: '朝面向方向射出一道奥术光，命中最近的两个敌人' },\\n    { id: 'mend',   name: '治愈术', spr: S.potionG, cost: 60, cd: 5, desc: '立刻回复 40% 体力上限' },\\n    { id: 'quake',  name: '震地',   spr: S.hammer, cost: 70, cd: 6, desc: '全屏震荡，对视野内所有敌人造成伤害并眩晕一回合' },\\n    /* ---- 剧情武器专属技能（学会剧情武器时一并解锁） ---- */\\n    { id: 'echo',      name: '终焉回响', spr: S.staff, cost: 50, cd: 4, story: true,\\n      desc: '时停一回合，对视野内所有敌人造成 2.2 倍伤害' },\\n    { id: 'bloodmoon', name: '血月斩',   spr: S.spear, cost: 40, cd: 3, story: true,\\n      desc: '对所有敌人造成 3 倍伤害并吸取一半为生命' }\\n  ];\\n  /* ================= v9.9 食物表（背包用） =================\\n     用户口径：1 点体力 = 1 滴血。所以 heal:5 = 回 5 滴。\\n     图标 32x32 PNG，从用户手绘图裁切（见 tools/food_icon.py）。 */\\n  var FOODS = [\\n    { id: 'pumpkin_pie', name: '南瓜派', heal: 5, color: '#E8B315',\\n      desc: '烤得焦香的南瓜派，外皮酥、馅料甜。' },\\n    { id: 'apple_pie',   name: '苹果派', heal: 5, color: '#F08A1E',\\n      desc: '苹果切片铺满一盘，烤到边缘微微焦糖化。' },\\n    { id: 'cookie',      name: '饼干',   heal: 3, color: '#C98B3C',\\n      desc: '两块厚实的巧克力碎饼干，压饿但不太顶。' },\\n    /* full:true = 一口回满。heal 不参与计算，写成 0 免得两套口径打架 */\\n    { id: 'pork_cake',   name: '肉松蛋糕', heal: 0, full: true, color: '#B8781F',\\n      desc: '厚厚一层肉松盖在蛋糕上，咸香顶饿，一口下去体力全满。' },\\n    { id: 'apple',       name: '苹果',   heal: 2, color: '#E8702A',\\n      desc: '一只带梗的苹果，脆是脆，顶不了多少。' },\\n    { id: 'radish',      name: '弟弟萝卜', heal: 10, color: '#E2662A',\\n      desc: '一整根萝卜，啃完顶半天。' },\\n    /* energy:true = 顺手把能量灌满。跟 full/heal 是三套独立口径 */\\n    { id: 'energy_potion', name: '能量药水', heal: 10, energy: true, color: '#22BEF6',\\n      desc: '一瓶冒着冷气的青蓝药水，回一口体力，能量直接灌满。' },\\n    { id: 'life_potion',   name: '生命药水', heal: 0, full: true, color: '#D8231C',\\n      desc: '猩红的药水，一口下去伤口全合，体力直接见顶。' },\\n    /* cleanse = 清掉所有负面状态（目前只有中毒） */\\n    { id: 'green_potion',  name: '小绿水', heal: 0, cleanse: true, color: '#35D42A',\\n      desc: '绿得发亮的一小瓶，喝下去身上的邪门玩意儿全没了。' },\\n    /* buff = 限时攻击加成，秒表走的是真实时间 */\\n    { id: 'power_spring',  name: '力量泉水', heal: 0, buff: { mul: 1.70, sec: 60 }, color: '#B420F0',\\n      desc: '紫莹莹的泉水，喝完整个人都在抖，攻击暴涨一分钟。' }   /* BAG_v99 */\\n  ];\\n  function foodById(id) {\\n    for (var i = 0; i < FOODS.length; i++) if (FOODS[i].id === id) return FOODS[i];\\n    return null;\\n  }\\n\\n  var MAX_FLOOR = 18;   /* THREECH_v1：3 章 x 6 段 */\\n  var BOSS_FLOOR = 6;\\n  var FLOORS_PER_CH = 6;\\n/* ================================================================\\n   深渊回响 v5.0 —— 章节扩展数据（第二 / 第三章）\\n   ----------------------------------------------------------------\\n   这个文件只放「数据」，不含逻辑改动。由 patch_v5.py 拼进游戏逻辑块。\\n   设计原则：\\n     ① 三章共用同一套引擎与战斗框架，只在「主题图集 / 关卡表 / 怪物表」上分叉；\\n     ② 每章的小机制也在这里声明（CH2 水域 / CH3 光源），逻辑在 patch_v5 里接线；\\n     ③ 关卡表结构与第一章的 LEVELS 完全一致（rooms/links/monsterPts/itemPts），\\n        这样 buildFixedLevel() 不用改就能吃第二三章的数据。\\n   ================================================================ */\\n\\n/* ================= 主题（图集）定义 =================\\n   每个主题一张图集 + 自己的格宽 + 索引表。\\n   索引表 T/S 里的数字全部是「用 tools/sheet_atlas.py 逐格放大核对过」的，\\n   不许凭感觉填。 */\\nvar THEMES = {   /* THREECH_v1 */\\n  ch1: {\\n    name: '石砌地牢',\\n    cols: 12, ts: 16,          /* Kenney Tiny Dungeon 12x11 */\\n    accent: '#c9a0ff',\\n    tint: null\\n  },\\n  ch2: {\\n    /* 潮湿洞穴 + 沉没之城合并：前半是洞穴与水域，后半走进沉没的城。\\n       图集改用高清 32px（原第三章那套），画质和水感都能撑住。 */\\n    name: '沉没之城',\\n    cols: 40, ts: 32,\\n    accent: '#6fe3c4',\\n    tint: 'rgba(40,96,132,0.18)'   /* 一层很轻的冷水色，不洗白高清图 */\\n  },\\n  ch3: {\\n    name: '无光深渊',\\n    cols: 40, ts: 32,\\n    accent: '#b06cff',\\n    tint: '#9a6cf0',               /* 紫黑重压：走 multiply 混合，压暗而不是洗白 */\\n    tintBlend: 'multiply'\\n  }\\n};\\n\\n/* ================= 第二章索引表（核对自 caves 图集） =================\\n   洞穴图集分区（列 28、行 17）：\\n     0-55     岩石边缘/门框/骨饰\\n     56-139   墙体/石地/蘑菇/藤蔓/木栅/裂纹\\n     140-251  门/拱/墙结构\\n     252-307  木地板/石砖地/水池/碎石\\n     308-475  水池边/矿点/石板/拱柱\\n   下面这些索引都用 sheet_atlas.py 放大看过，一格格配的。 */\\nvar T2 = {\\n  /* 地面：木色沙地为主，混少量碎石与石板做变化 */\\n  floor: [266, 267, 268, 269, 262, 263],\\n  /* 深色墙体（青苔石壁）—— 地图外框与内墙 */\\n  wall: [77, 78, 79, 80, 81, 82, 83],\\n  /* 楼梯：用木门当下一层入口 */\\n  stairs: 51,\\n  /* 铁栅门（Boss 层）*/\\n  gate: 190,\\n  /* 墙火把：用发光矿点代替 */\\n  torch: [318, 319, 320],\\n  chest: 90, chestOpen: 90,\\n  /* 木桶 → 蘑菇（可打碎） */\\n  barrel: 84, barrel2: 112,\\n  crate: 85, crate2: 86, ring: 87,\\n  altar: 136, tomb: 51, statue: 231, pillar: 303, brazier: 189, table: 174,\\n  /* 神龛拱门 */\\n  shrine: 136,\\n  /* 传送门：水晶簇 */\\n  portal: 292,\\n  /* 石井 → 石堆 */\\n  well: 87,\\n    /* ---- 第二章专属：水域 ---- */\\n  water: [280, 281, 282, 283, 284],      /* 深水（会掉血） */\\n  waterShallow: [285, 286, 287, 288, 289],/* 浅水（只减速） */\\n  moss: [88, 89, 116, 117],              /* 苔藓藤蔓装饰 */\\n  crystal: [322, 323, 318, 319]          /* 发光水晶（光源） */\\n};\\n\\n/* ---- 角色/怪物/道具：第二三章复用第一章图集 ----\\n   为什么不换？caves-dungeons 与 rpg-pack 都是「纯场景包」，不含完整角色；\\n   roguelike-characters 是零件图（头身分离）需要拼装，直接用会很难看。\\n   所以角色层统一用第一章的 Tiny Dungeon 图集，靠「章节色调滤镜」做视觉区分\\n   —— 见 THEMES.ch2.tint / ch3.tint。这样逻辑零改动、风险最低，\\n   而场景本身（占画面 90%）已经是三套完全不同的图集了。\\n   注意：下面这些索引指向的是 ch1 图集，不是 ch2 图集。 */\\nvar S_SHARED = {\\n  hero: 85, knight: 96, wizard: 84, heroAlt: 88,\\n  bat: 120, slime: 108, goblin: 112, spider: 122, wraith: 111,\\n  crab: 110, ghost: 121, rogue: 100, skull: 124,\\n  snake: 123, slimeO: 109, boss: 82,\\n  merchant: 101, merchantF: 100, villager: 101,\\n  potionR: 115, potionG: 114, potionB: 116, potionGray: 113,\\n  dagger: 103, sword: 104, knife: 105, longsword: 106, hammer: 117, axe: 118,\\n  spear: 107, staff: 126, wand: 125,\\n  gem: 32, coin: 101\\n};\\n\\nvar S2 = S_SHARED;   /* 第二章角色/怪物/道具 —— 复用第一章图集（见上方说明） */\\n\\n/* ================= 第三章索引表（核对自 rpg-pack 重排图集） =================\\n   ch3_town.png 是 57 列重排成 28 列，索引与原图**不同**，\\n   下面每个数字都用 tools/sheet_atlas.py 放大核对过（逐段贴图确认）。\\n   已核对分区（重排后索引）：\\n     0-4     水（浅蓝）     5-6   草地/沙地      7-9   蓝灰石地/沙地/浅灰石砖\\n     10-11   条纹墙       12-14  熔炉/火焰炉/火盆（光源）\\n     16-18   木箱/开箱     22-25  木桶/铁箍桶\\n     28-31   柜台/柜子     32-39  木门/暗门\\n     40-43   窗格门（深木/白窗） 44-48  圆木桩/桶盖  49-53  橙门/盾牌/盔甲\\n     54-55   绿拱门       56-61  水/水岸      62-66  草地/沙地\\n     69-74   橙墙/地砖/木地板  75-83  木地板/木墙板\\n     700-703 沙岩土墙     704-717 灰石墙（带高光边）\\n     718-724 暖色木墙板   725-734 壁炉/书柜墙   735-736 木门框\\n     737-740 木桌/灯/木桩  741-745 草地花丛\\n     746-750 灰石砖地/拱地砖 751-755 橙木地板墙/沙岩土墙 */\\nvar T3 = {\\n  /* ===== 第三章「沉没之城」= Kenney rpg-base 原生 32px 高清图集（40 列）=====\\n     所有索引都用 tools/_peek/v5_rpgbase_atlas.png 逐格放大核对过，不许凭感觉填。\\n     图集分区（40 列）：\\n       0-3 行   绿色草地 / 泥地 / 水面（圆角地形）\\n       6-    /* 4 */ ['rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost','rogue','wraith','ghost'],\\n    /* 5 */ ['ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith','ghost','skull','wraith'],\\n    /* 6 */ ['wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost','wraith','rogue','ghost']\\n  ];\\n\\nvar BOSS_CH4 = {\\n  id: 'mother_void', name: '无光之母', spr: 'boss',\\n  hp: 255, atk: 48, def: 22,   /* v9.0：按即时战斗 ~14 击标定 */\\n  phases: [\\n    { name: '睁眼', dlg: '你终于走到这里了。往下就没有「下面」了。',\\n      pool: ['b1_aim', 'b2_spiral', 'b2_rain', 'b1_wall'], waves: 5 },\\n    { name: '吞噬', dlg: '这里的光，都是我一口一口吃掉的。',\\n      pool: ['b2_split', 'b2_wallH', 'b3_laserV', 'b3_storm', 'b2_rain'], waves: 6 },\\n    { name: '封闭', dlg: '别走了。留在这里，你就不必再害怕黑。',\\n      pool: ['b3_laserH', 'b3_homing', 'b3_storm', 'b3_tight', 'b3_laserV', 'b2_spiral'], waves: 8 }\\n  ]\\n};\\n\\nvar STORY_CH4 = {\\n  19: { title: '第 19 层 · 无光之门',\\n        text: '最后一扇门在你身后合上了。\\\\n\\\\n没有声音，也没有回音。\\\\n你伸手到眼前，看不见自己的手指。\\\\n\\\\n「从这里开始，我不认识路。」刃说。\\\\n「你是第一个走到这儿的。恭喜。」' },\\n  21: { title: '第 21 层 · 无声市集',\\n        text: '一片开阔的空地被摊位围住，摊上还摆着货。\\\\n\\\\n没有人。没有人骨，没有血迹，什么都没有。\\\\n像是所有人同时站起来，安静地走了。\\\\n\\\\n其中一个摊位上，还放着一把没卖出去的刀。' },\\n  23: { title: '第 23 层 · 坍塌穹顶',\\n        text: '头顶的石顶塌了一半，露出更上面的黑。\\\\n\\\\n不是天空。是更深的东西，正贴着裂缝往里看。\\\\n\\\\n「那不是上面。」刃的声音低了下去。\\\\n「那是它翻过来的肚子。」' },\\n  24: { title: '第 24 层 · 无光之底',\\n        text: '这里什么都没有。\\\\n\\\\n没有地面，没有墙，你只是「站着」，\\\\n因为除了站着，没有别的事可做。\\\\n\\\\n然后黑暗中间，睁开了一只眼睛。' }\\n};\\n\\n/* ================= 三章 Boss 定义 =================\\n   第一章 Boss 是「深渊主宰」（现有），第二三章各有一个专属 Boss。\\n   招式池在 patch_v5 里接进 BOSS_PHASES 结构。 */\\nvar BOSS_CH2 = {\\n  id: 'tide_heart', name: '潮汐之心', spr: 'boss',\\n  hp: 205, atk: 30, def: 12,   /* v9.0：按即时战斗 ~14 击标定 */\\n  /* 三阶段台词（沿用第一章的三阶段结构：>0.66 / >0.33 / else） */\\n  phases: [\\n    { name: '涨潮', dlg: '水……漫上来了。你听，那是十七层深处的呼吸。',\\n      pool: ['b2_spiral', 'b2_rain', 'b1_ring'], waves: 4 },\\n    { name: '漩涡', dlg: '每一个沉下去的人，都以为自己是最后一个。',\\n      pool: ['b2_wallH', 'b2_split', 'b2_spiral', 'b2_rain'], waves: 5 },\\n    { name: '灭顶', dlg: '别挣扎了。深渊从来不挑食。',\\n      pool: ['b3_laserV', 'b3_laserH', 'b3_homing', 'b3_storm', 'b3_tight'], waves: 6 }\\n  ]\\n};\\n\\nvar BOSS_CH3 = {\\n  id: 'sunken_king', name: '沉没之王', spr: 'boss',\\n  hp: 223, atk: 40, def: 18,   /* v9.0：按即时战斗 ~14 击标定 */\\n  phases: [\\n    { name: '王座', dlg: '朕的城市沉了一千年。你，是第几个来敲门的？',\\n      pool: ['b1_aim', 'b1_wall', 'b2_spiral'], waves: 4 },\\n    { name: '崩落', dlg: '柱子断了，墙塌了，朕的臣民都睡着了。',\\n      pool: ['b2_split', 'b2_wallH', 'b3_laserV', 'b2_rain'], waves: 5 },\\n    { name: '寂灭', dlg: '那就陪朕一起，永远待在这下面吧。',\\n      pool: ['b3_laserH', 'b3_homing', 'b3_storm', 'b3_tight', 'b3_laserV'], waves: 7 }\\n  ]\\n};\\n\\n/* ================= 第二 / 三章剧情文本 =================\\n   storyOnEnter(floorNo) 是通用函数，只要把对应层号的文本并进 STORY 即可。 */\\nvar STORY_CH2 = {\\n  7: { title: '第 7 层 · 湿气入口',\\n        text: '石阶到了尽头，脚下开始渗水。\\\\n\\\\n你举起刃，蓝白的光照出一小片潮湿的岩壁——\\\\n墙上有爪子刮过的痕迹，很深，一路向下。\\\\n\\\\n「它比你想的更大。」刃里的声音说。「也更饿。」' },\\n  9: { title: '第 9 层 · 沉船坞',\\n        text: '一大片水域横在面前，水里横着半截船。\\\\n\\\\n那是艘很旧的船，桅杆断成两截，\\\\n船身上刻着一行字——和你在第 1 层石板上看到的，是同一种字。\\\\n\\\\n「他们到过这里。」声音说。「十七个人。都没能上去。」' },\\n  12: { title: '第 12 层 · 潮汐之心',\\n        text: '水停止了流动。\\\\n\\\\n所有的水都悬在半空，像被谁按下了暂停。\\\\n中间那团东西缓慢地搏动着，一次，又一次——\\\\n\\\\n「那是它的心脏。」\\\\n「它一直在等有人下来，好把它带走。」' }\\n};\\n\\nvar STORY_CH3 = {\\n  13: { title: '第 13 层 · 城墙根',\\n        text: '水退光了。\\\\n\\\\n你站在一座城市的墙根下——不是洞穴，是真正的城。\\\\n石砖整齐，窗户还在，甚至有几盏灯亮着。\\\\n\\\\n「这座城早在你出生前就沉了。」\\\\n「灯还亮着，是因为有人在下面点着。」' },\\n  15: { title: '第 15 层 · 议政厅',\\n        text: '巨大的石厅中央摆着一张长桌。\\\\n\\\\n桌边坐着十几个人形，全都被石头包住了，\\\\n姿势还保持着争论的样子，手里还握着杯盏。\\\\n\\\\n「他们开会开到一半，城就沉了。」\\\\n「所以到现在，会还没开完。」' },\\n  18: { title: '第 18 层 · 深渊之核',\\n        text: '你走到了最底下。\\\\n\\\\n这里没有水，没有石，只有一座巨大的王座，\\\\n座上坐着一个人——不，是一具穿着王袍的骸骨，\\\\n它戴着冠，冠上刻着和刃身上一样的纹。\\\\n\\\\n「你没让我失望。」刃说。\\\\n「现在，把门打开吧。」' }\\n};\\n\\n\\n\\n  /* ---- v3.0 Boss / 剧情常量 ---- */\\n  var BOSS_CH1 = {\\n    id: 'abyss_eye', name: '深渊之眼', spr: 'boss',\\n    hp: 194, atk: 20, def: 8,   /* v9.0：按即时战斗 ~10 击标定 */\\n    phases: [\\n      { name: '凝视', dlg: '它一直在看你。从第一层开始。' },\\n      { name: '裂瞳', dlg: '那只眼睛里没有瞳孔，只有更深的一层黑。' },\\n      { name: '坍缩', dlg: '光被它一口一口吃干净了。' }\\n    ]\\n  };\\n  var BOSS_HP = 194, BOSS_ATK = 20, BOSS_DEF = 8;   /* v9.0：按即时战斗 ~10 击标定 */\\n  var BOSS_NAME = ['', '', '', '', '', '', '深渊之眼', '', '', '', '', '', '沉没之王', '', '', '', '', '', '无光之母'];   /* THREECH_v1：6/12/18 */\\n  var STORY_FLOOR = 5;      /* 剧情武器出现的层 */\\n  var STORY = {   /* THREECH_v1 */\\n    /* ---------- 第 1 章 · 石砌地牢 ---------- */\\n    1: { title: '石砌地牢 · 入口厅',\\n         text: '你睁开眼，发现自己躺在冰冷的石板上。\\\\n头顶的裂隙漏下最后一线天光——然后彻底黑了。\\\\n\\\\n「又来了一个。」黑暗里有个声音说。\\\\n「往下去吧，下面有你要的答案。」' },\\n    3: { title: '石砌地牢 · 骨堂',\\n         text: '中央的沙地上插满了断剑。\\\\n你数了数，一共十七把。\\\\n\\\\n「十七个和你一样的人。」\\\\n那个声音又响起来，这次近了一些。\\\\n「他们都想拿走那把刃。它还在下面等着。」' },\\n    5: { title: '石砌地牢 · 深渊回廊',\\n         text: '你看见它了。\\\\n\\\\n一把刃插在祭坛中央，刃身像凝固的深海水流，\\\\n在黑暗里缓缓地、自顾自地搏动着。\\\\n\\\\n「拿起它，」那个声音说，「你就会听见他们的声音。」\\\\n「十七个人。他们都在刃里。」' },\\n    6: { title: '石砌地牢 · 深渊之眼',\\n         text: '巨大的眼球占据了整面墙。\\\\n它看着你，瞳孔缓缓收缩。\\\\n\\\\n「你终于来了。」\\\\n这一次，声音不是从黑暗里传来的——\\\\n是从你握着的刃里传来的。' },\\n\\n    /* ---------- 第 2 章 · 沉没之城（洞穴 + 沉城的合并线） ---------- */\\n    7: { title: '沉没之城 · 湿气入口',\\n         text: '石阶到了尽头，脚下开始渗水。\\\\n\\\\n你举起刃，蓝白的光照出一小片潮湿的岩壁——\\\\n墙上有爪子刮过的痕迹，很深，一路向下。\\\\n\\\\n「它比你想的更大。」刃里的声音说。「也更饿。」' },\\n    9: { title: '沉没之城 · 沉船坞',\\n         text: '一大片水域横在面前，水里横着半截船。\\\\n\\\\n桅杆断成两截，船身上刻着一行字——\\\\n和你在入口厅石板上看到的，是同一种字。\\\\n\\\\n「他们到过这里。」声音说。「十七个人。都没能上去。」' },\\n    11: { title: '沉没之城 · 议政厅',\\n         text: '水在这层退干净了，你踩上真正的石砖。\\\\n\\\\n巨大的石厅中央摆着一张长桌，\\\\n桌边坐着十几个人形，全都被石头包住了，\\\\n姿势还保持着争论的样子，手里还握着杯盏。\\\\n\\\\n「他们开会开到一半，城就沉了。」\\\\n「所以到现在，会还没开完。」' },\\n    12: { title: '沉没之城 · 深渊之核',\\n         text: '最底下没有水，没有石，只有一座巨大的王座。\\\\n\\\\n座上坐着一个人——不，是一具穿着王袍的骸骨，\\\\n它戴着冠，冠上刻着和刃身上一样的纹。\\\\n\\\\n「你没让我失望。」刃说。\\\\n「现在，把门打开吧。」' },\\n\\n    /* ---------- 第 3 章 · 无光之底 ---------- */\\n    13: { title: '无光之底 · 无光之门',\\n         text: '最后一扇门在你身后合上了。\\\\n\\\\n没有声音，也没有回音。\\\\n你伸手到眼前，看不见自己的手指。\\\\n\\\\n「从这里开始，我不认识路。」刃说。\\\\n「你是第一个走到这儿的。恭喜。」' },\\n    15: { title: '无光之底 · 无声市集',\\n         text: '一片开阔的空地被摊位围住，摊上还摆着货。\\\\n\\\\n没有人。没有人骨，没有血迹，什么都没有。\\\\n像是所有人同时站起来，安静地走了。\\\\n\\\\n其中一个摊位上，还放着一把没卖出去的刀。' },\\n    17: { title: '无光之底 · 坍塌穹顶',\\n         text: '头顶的石顶塌了一半，露出更上面的黑。\\\\n\\\\n不是天空。是更深的东西，正贴着裂缝往里看。\\\\n\\\\n「那不是上面。」刃的声音低了下去。\\\\n「那是它翻过来的肚子。」' },\\n    18: { title: '无光之底 · 无光之母',\\n         text: '这里什么都没有。\\\\n\\\\n没有地面，没有墙，你只是「站着」，\\\\n因为除了站着，没有别的事可做。\\\\n\\\\n然后黑暗中间，睁开了一只眼睛。' }\\n  };\\n\\n  /* ================= 固定关卡表（v3.0 · 不再随机） =================\\n     rooms = [[x,y,w,h]...] 房间矩形；links = [[a,b]...] 走廊；\\n     spawn/stairs = 出生点/楼梯；monsterPts/itemPts = 写死的刷点；\\n     elite/boss/shrine/merchant = 特殊点。改关卡就是改这张表。 */\\n  /* sector 内部坐标系：每个 sector 画布 46×36，外面套 56×44（见 BIGMAP_v1）*/\\n  var LEV_W = 46, LEV_H = 36;\\n  var LEVELS = [\\n    /* 入口厅 */\\n    { name: '入口厅', spawn: [8,28], stairs: [59,28],\\n    rooms: [[5,26,58,4],\\n    [8,7,16,13],\\n    [37,7,16,14],\\n    [8,34,16,13],\\n    [37,34,16,13],\\n    [27,9,8,6],\\n    [27,39,8,6],\\n    [14,20,3,7],\\n    [43,21,3 und(m.atk * 1.25);\\n        m._bloodB = 1;\\n        n++;\\n      }\\n      return n;\\n    }\\n\\n/*__SECTORBUFF_BEGIN__*/\\n    /* ============ SECTORBUFF_v1：进段补发 spawn-only 机制 ============\\n       rich / nest / echo / swift 的效果写在 spawnMonsterAt 里，\\n       而整章的怪是开局一次性刷完的（那时 mod 还是常态），段里换机制对它们无效。\\n       所以进段时补一次，每只怪每个机制只补一次（`_m_<id>` 打标）。 */\\n    var MOD_ONCE = { rich: 1, nest: 1, echo: 1, swift: 1, blood: 1 };\\n\\n    function applySectorMod(md) {\\n      if (!md || !MOD_ONCE[md.id]) return 0;\\n      var o = secOff(chap.idx - 1), n = 0, key = '_m_' + md.id;\\n      for (var i = 0; i < mons.length; i++) {\\n        var m = mons[i];\\n        if (!m || m.hp <= 0 || m[key]) continue;\\n        if (m.gx < o.x || m.gx >= o.x + SEC_W) continue;\\n        if (m.gy < o.y || m.gy >= o.y + SEC_H) continue;\\n        m[key] = 1; n++;\\n        if (md.id === 'blood') { m.atk = Math.round(m.atk * 1.25); }\\n        else if (md.id === 'rich') { if (!m.boss) m.atk = Math.round(m.atk * 1.20); }\\n        else if (md.id === 'nest') {\\n          m.maxHp = Math.max(3, Math.round(m.maxHp * 0.65));\\n          if (m.hp > m.maxHp) m.hp = m.maxHp;\\n        }\\n        else if (md.id === 'echo') { m.sense = (m.sense || 6) + 4; }\\n        else if (md.id === 'swift') { m.speed = Math.min(3, (m.speed || 1) + 1); }\\n      }\\n      /* 富矿：本段补撒宝石（原 nGem×2.5 是 spawn 时算的，已经错过了） */\\n      if (md.id === 'rich') {\\n        var added = 0;\\n        for (var g = 0; g < 24 && added < 6; g++) {\\n          var gx = o.x + SEC_OX + Math.floor(Math.random() * (SEC_W - SEC_OX * 2));\\n          var gy = o.y + SEC_OY + Math.floor(Math.random() * (SEC_H - SEC_OY * 2));\\n          if (!walkable(gx, gy)) continue;\\n          if (monsterAt(gx, gy)) continue;\\n          try { mkItem('gem', gx, gy); added++; } catch (e) { }\\n        }\\n        n += added;\\n      }\\n      return n;\\n    }\\n\\n    function syncSectorMod() {\\n      if (!chap || !chap.id) return FLOORG.mod;\\n      var row = S         var c = A.ctx;\\n        BGM.ctx = c;\\n        BGM.master = c.createGain();\\n        BGM.master.gain.setValueAtTime(0.0001, c.currentTime);\\n        BGM.master.connect(c.destination);\\n        /* 简易空间感：反馈延迟 */\\n        BGM.delay = c.createDelay(1.2);\\n        BGM.delay.delayTime.setValueAtTime(0.31, c.currentTime);\\n        BGM.fb = c.createGain(); BGM.fb.gain.setValueAtTime(0.30, c.currentTime);\\n        BGM.wet = c.createGain(); BGM.wet.gain.setValueAtTime(0.30, c.currentTime);\\n        BGM.delay.connect(BGM.fb); BGM.fb.connect(BGM.delay);\\n        BGM.delay.connect(BGM.wet); BGM.wet.connect(BGM.master);\\n        BGM.running = true;\\n        BGM.applyVol();\\n        return true;\\n      },\\n      applyVol: function () {\\n        if (!BGM.master || !BGM.ctx) return;\\n        var target = (CFG.bgm && CFG.sfx) ? (0.26 * Math.max(0.05, CFG.vol)) : 0.0001;\\n        try {\\n          var t = BGM.ctx.currentTime;\\n          BGM.master.gain.cancelScheduledValues(t);\\n          BGM.master.gain.setValueAtTime(Math.max(0.0001, BGM.master.gain.value), t);\\n          BGM.master.gain.linearRampToValueAtTime(target, t + 0.35);\\n        } catch (e) { }\\n      },\\n      sync: function () { BGM.applyVol(); },\\n      note: function (freq, dur, wave, vol, detune) {\\n        var c = BGM.ctx; if (!c) return;\\n        try {\\n          var t = c.currentTime;\\n          var o = c.createOscillator(), g = c.createGain();\\n          o.type = wave || 'sine';\\n          o.frequency.setValueAtTime(freq, t);\\n          if (detune) o.detune.setValueAtTime(detune, t);\\n          g.gain.setValueAtTime(0.0001, t);\\n          g.gain.exponentialRampToValueAtTime(Math.max(0.0002, vol), t + 0.02);\\n          g.gain.exponentialRampToValueAtTime(0.0001, t + dur);\\n          o.connect(g); g.connect(BGM.master); g.connect(BGM.delay);\\n          o.start(t); o.stop(t + dur + 0.06);\\n        } catch (e) { }\\n      },\\n      setChapter: function (n) { BGM.chapter = n chapIndexOf(fl) { return ((fl - 1) % FLOORS_PER_CH) + 1; }\\nfunction chapterOf(fl) { return Math.min(3, Math.floor((fl - 1) / FLOORS_PER_CH) + 1); }   /* THREECH_v1 */\\n\\n/* ================= 应用某一章 =================\\n   把 T / S / MONSTERS / 图集 / 列数全部切到目标章。\\n   注意：T2/T3 里的角色索引并不存在，所以 S 永远复用 S_SHARED（第一章图集）。 */\\nfunction applyChapter() {\\n  var d = chapterDef(chapterOf(floorNo));\\n  chap.id = d.id; chap.name = d.name; chap.idx = chapIndexOf(floorNo);\\n  chap.levelList = d.levelList; chap.pools = d.pools; chap.monsters = d.monsters;\\n  chap.boss = d.boss; chap.theme = d.theme;\\n  chap.accent = d.theme.accent;\\n  try { BGM.setChapter(d.id); } catch (e) { }\\n  /* THREECH_v1：第 2、3 章都用高清 ch3 图集（32px / 40 列），\\n     第 1 章仍是 16px 的 Tiny Dungeon —— 越往下画面越清晰，符合\\\"深入\\\"的直觉。 */\\n  chap.sheet = (d.id >= 2)\\n    ? ((sheets && sheets.ch3) || (sheets && sheets.ch1) || sheet)\\n    : ((sheets && sheets.ch1) || sheet);\\n  /* 场景层用本章图集，角色层永远用 ch1 图集（见文档头说明） */\\n  sheet = chap.sheet;\\n  SHEET_COLS = d.theme.cols || 12;\\n  TS = d.theme.ts || 16;\\n  T = (d.id === 1) ? T_ORIG : T3;   /* THREECH_v1 */\\n  S = S_SHARED;                       /* 角色/道具始终来自第一章图集 */\\n  MONSTERS = d.monsters;\\n  fontAccent = d.theme.accent;\\n}\\n\\n/* ================= 切章 =================\\n   直接跳到第 n 章的第 1 层。 */\\nfunction enterChapter(n) {\\n  n = Math.max(1, Math.min(3, n | 0));   /* THREECH_v1 */\\n  floorNo = (n - 1) * FLOORS_PER_CH + 1;\\n  chapPending = 0;\\n  over = false; won = false;\\n  if (overlayText) { overlayText.visible = false; overlaySub.visible = false; overlayBg.visible = false; }\\n  var d = chapterDef(n);\\n  msg('▷ 进入第 ' + n + ' 章「' + d.name + '」。', d.theme.accent);\\n  genLevel(); layout(); snapToPlayer();\\n  storyOnEnter(floorNo);\\n}\\n\\n/* ================= 章内小机制 =================\\n   第二章：水域 —— 深水每回合掉血，浅水移动减速\\n   第三章：光源 —— 离光源越远画面越暗（视野压暗，不是遮罩） */\\nfunction buildChapterMechanics(L) {\\n  water = []; lights = []; mechT = 0;\\n  if (chap.id === 2 && L.waterPts) {\\n    for (var i = 0; i < L.waterPts.length; i++) {\\n      var w = L.waterPts[i];\\n      water.push({ gx: w[0], gy: w[1], w: w[2], h: w[3], deep: true });\\n    }\\n    if (water.length) msg('≈ 脚下的水又冷又深，别在里面久留。', '#6fe3c4');\\n  }\\n  if (chap.id === 3 && L.lightPts) {\\n    for (var j = 0; j < L.lightPts.length; j++) {\\n      lights.push({ gx: L.lightPts[j][0], gy: L.lightPts[j][1], ph: Math.random() * 6.28 });\\n    }\\n    if (lights.length) msg('✦ 只有火光能照亮这座城，走远一点就看不见了。', '#ffb066');\\n  }\\n}\\n\\n/* 玩家所在格是不是水 / 光 */\\nfunction waterAt(x, y) {\\n  for (var i = 0; i < water.length; i++) {\\n    var w = water[i];\\n    if (x >= w.gx && x < w.gx + w.w && y >= w.gy && y < w.gy + w.h) return w;\\n  }\\n  return null;\\n}\\nfunction lightDist(x, y) {\\n  if (!lights.length) return 0;\\n  var best = 999;\\n  for (var i = 0; i < lights.length; i++) {\\n    var dx = x - lights[i].gx, dy = y - lights[i].gy;\\n    var d = Math.sqrt(dx * dx + dy * dy);\\n    if (d < best) best = d;\\n  }\\n  return best;\\n}\\n\\n/* ================= HUD 文案 ================= */\\nfunction chapOrigin() {\\n  return '第 ' + chap.id + ' 章·' + chap.name;\\n}\\n\\n/* ================= 章节色调滤镜 + 小机制画面 =================\\n   由 patch_v5.py 挂进 scene 的最上层实体 customDraw 里调用。 */\\nfunction drawChapterTint(ctx, cam, camY) {\\n  /* 1) 章节色调滤镜（整屏叠一层半透明色） */\\n  var th = chap.theme || {};\\n  var t = th.tint;\\n  if (!t) return;\\n  if (th.tintBlend === 'multiply') {\\n    /* multiply：保留底图明暗层次，只把色相压过去（第四章用） */\\n    ctx.save();\\n    ctx.globalCompositeOperation = 'multiply';\\n    ctx.fillStyle = t;\\n    ctx.fillRect(0, 0, CW, CH);\\n    ctx.restore();\\n    return;\\n  }\\n  ctx.fillStyle = t; ctx.fillRect(0, 0, CW, CH);\\n}\\n\\nfunction drawChapterOverlay(ctx, cam, camY) {\\n  /* 2) 水域 —— 逐格画在「地面」上，不盖墙；深浅用两种蓝\\n     v7.3：第 2 章的深水与其余章节「积水」地形共用这套绘制 */\\n  if (water.length) {\\n    var x0 = Math.max(0, Math.floor(cam / TILE)), x1 = Math.min(MW - 1, Math.ceil((cam + CW) / TILE));\\n    var y0 = Math. var tot = 0, seen = 0;\\n        for (y = 1; y < MH - 1; y++) for (x = 1; x < MW - 1; x++) if (map[y][x] === FLOOR) tot++;\\n        if (sx < 0) return { tot: tot, seen: 0 };\\n        var vis = {}, q2 = [[sx, sy]], h = 0;\\n        vis[sy * MW + sx] = 1;\\n        var DX2 = [0, 0, -1, 1], DY2 = [-1, 1, 0, 0];\\n        while (h < q2.length) {\\n          var c = q2[h++]; seen++;\\n          for (var d = 0; d < 4; d++) {\\n            var nx = c[0] + DX2[d], ny = c[1] + DY2[d];\\n            if (nx < 1 || ny < 1 || nx >= MW - 1 || ny >= MH - 1) continue;\\n            var k = ny * MW + nx;\\n            if (vis[k] || map[ny][nx] !== FLOOR) continue;\\n            vis[k] = 1; q2.push([nx, ny]);\\n          }\\n        }\\n        return { tot: tot, seen: seen };\\n      }\\n\\n      if (feat === 'pillars') {\\n        /* 柱厅：规则柱阵，把大厅切成一格一格的走位题。\\n           每根柱子落地后验一次连通，堵死通道就撤回。 */\\n        for (var pi = 0; pi < rooms.length; pi++) {\\n          var pr = rooms[pi], yy6, xx6;\\n          for (yy6 = pr.y + 2; yy6 < pr.y + pr.h - 1; yy6 += 3) {\\n            for (xx6 = pr.x + 2; xx6 < pr.x + pr.w - 1; xx6 += 3) {\\n              if (R() >= 0.78) continue;\\n              var prev6 = map[yy6][xx6];\\n              if (prev6 === ROCK) continue;\\n              map[yy6][xx6] = ROCK;\\n              var pst = floorStats();\\n              if (pst.seen < pst.tot) map[yy6][xx6] = prev6;\\n            }\\n          }\\n        }\\n      } else if (feat === 'collapse') {\\n        /* 塌方：满地碎石堆。每堆落地后立刻验一遍连通，\\n           把一格宽的走廊堵死就当场撤回——宁可少几堆，也不能出死图。 */\\n        var cN = 16 + Math.floor(R() * 14);\\n        for (var ci = 0; ci < cN; ci++) {\\n          var cr = rooms[Math.floor(R() * rooms.length)];\\n          if (!cr) continue;\\n          var cw2 = 1 + Math.floor(R() * 2), ch2 = 1 + Math.floor(R() * 2);\\n          var cx3 = cr.x + 1 + Math.floor(R() * Math.max(1, cr.w - cw2 - 1));\\n          var cy3 = cr.y + 1 + Math.floor(R() * Math.max(1, cr.h - ch2 - 1));\\n          var cbak = [];\\n          for (var yy4 = cy3; yy4 < cy3 + ch2; yy4++) {\\n            for (var xx4 = cx3; xx4 < cx3 + cw2; xx4++) {\\n              if (yy4 <= 0 || yy4 >= MH - 1 || xx4 <= 0 || xx4 >= MW - 1) continue;\\n              cbak.push([xx4, yy4, map[yy4][xx4]]);\\n              map[yy4][xx4] = ROCK;\\n            }\\n          }\\n          if (!cbak.length) continue;\\n          var cst = floorStats();\\n          if (cst.seen < cst.tot) {\\n            for (var ck2 = 0; ck2 < cbak.length; ck2++) map[cbak[ck2][1]][cbak[ck2][0]] = cbak[ck2][2];\\n          }\\n        }\\n      } else if (feat === 'chasm') {\\n        /* 深渊裂谷：竖着劈开一道，只留几座独木桥 */\\n        var ccx = 10 + Math.floor(R() * (MW - 22));\\n        var saved = [], yy7, w7;\\n        for (yy7 = 1; yy7 < MH - 1; yy7++) {\\n          var rowSaved = [];\\n          for (w7 = 0; w7 < 3; w7++) { rowSaved.push(map[yy7][ccx + w7]); map[yy7][ccx + w7] = ROCK; }\\n          saved.push(rowSaved);\\n        }\\n        var btries = 0;\\n        while (btries++ < 3) {\\n          var by7 = 2 + Math.floor(R() * (MH - 4));\\n          map[by7][ccx] = FLOOR; map[by7][ccx + 1] = FLOOR; map[by7][ccx + 2] = FLOOR;\\n        }\\n        var fs1 = floorStats(), guard7 = 0;\\n        while (fs1.seen < fs1.tot && guard7++ < 14) {\\n          var by8 = 2 + Math.floor(R() * (MH - 4));\\n          map[by8][ccx] = FLOOR; map[by8][ccx + 1] = FLOOR; map[by8][ccx + 2] = FLOOR;\\n          fs1 = floorStats();\\n        }\\n        if (fs1.seen < fs1.tot) {\\n          /* 还是不通就把裂谷填回去，绝不交出不能走的层 */\\n          for (yy7 = 1; yy7 < MH - 1; yy7++)\\n            for (w7 = 0; w7 < 3; w7++) map[yy7][ccx + w7] = saved[yy7 - 1][w7];\\n        }\\n      } else if (feat === 'flood') {\\n        /* 积水：几片水域 —— 踩上去这一步敌人趁机多动一次；\\n           第 2 章是深水（还掉血），其余章节是浅水。\\n           以前是「随机抽房间，抽到太小的就 continue」，导致约 6.5% 的积水层\\n           一滴水都没有（名不虚传）。改成先洗牌、逐间试，最后再兜一块。 */\\n        var fN = 2 + Math.floor(R() * 3);\\n        var fOrd = [];\\n        for (var f0 = 0; f0 < rooms.length; f0++) fOrd.push(f0);\\n        for (var f1 = fOrd.length - 1; f1 > 0; f1--) {\\n          var f2 = Math.floor(R() * (f1 + 1));\\n          var f3 = fOrd[f1]; fOrd[f1] = fOrd[f2]; fOrd[f2] = f3;\\n        }\\n        var fMade = 0;\\n        for (var f4 = 0; f4 < fOrd.length && fMade < fN; f4++) {\\n          var fr = rooms[fOrd[f4]];\\n          if (!fr || fr.w < 4 || fr.h < 4) continue;\\n          var fw = Math.min(fr.w - 2, 3 + Math.floor(R() * 4));\\n          var fh = Math.min(fr.h - 2, 2 + Math.floor(R() * 3));\\n          if (fw < 2 || fh < 2) continue;\\n          var fx = fr.x + 1 + Math.floor(R() * Math.max(1, fr.w - fw - 1));\\n          var fy = fr.y + 1 + Math.floor(R() * Math.max(1, fr.h - fh - 1));\\n          fwater.push({ gx: fx, gy: fy, w: fw, h: fh });\\n          fMade++;\\n        }\\n        /* 兜底：所有房间都太小的话，往最大那间硬塞一小块，绝不交白卷 */\\n        if (!fMade && rooms.length) {\\n          var fBig = rooms[0];\\n          for (var f5 = 1; f5 < rooms.length; f5++) {\\n            if (rooms[f5].w * rooms[f5].h > fBig.w * fBig.h) fBig = rooms[f5];\\n          }\\n          var fbw = Math.min(3, Math.max(2, fBig.w - 2));\\n          var fbh = Math.min(2, Math.max(2, fBig.h - 2));\\n          fwater.push({ gx: fBig.x + 1, gy: fBig.y + 1, w: fbw, h: fbh });\\n        }\\n      }\\n\\n      /* 房间中心必须是地板：楼梯和出生点都取中心，柱子/碎石/裂谷可能正好压在上面。\\n         压住了就把中心挪到房间里任意一格地板上；整间都被岩层吞掉的房间直接作废，\\n         不能硬挖——硬挖会在岩层里留个走不到的孤岛。 */\\n      var deadRooms = [];\\n      for (var ck = 0; ck < rooms.length; ck++) {\\n        var rk = rooms[ck];\\n        if (map[rk.cy][rk.cx] === FLOOR) continue;\\n        var found9 = false;\\n        for (var yy9 = rk.y; yy9 < rk.y + rk.h && !found9; yy9++) {\\n          for (var xx9 = rk.x; xx9 < rk.x + rk.w; xx9++) {\\n            if (map[yy9][xx9] === FLOOR) { rk.cx = xx9; rk.cy = yy9; found9 = true; break; }\\n          }\\n        }\\n        if (!found9) deadRooms.push(rk.id);\\n      }\\n      if (deadRooms.length) {\\n        rooms = rooms.filter(function (r) { return deadRooms.indexOf(r.id) < 0; });\\n        for (var ri9 = 0; ri9 < rooms.length; ri9++) rooms[ri9].id = ri9;\\n      }\\n\\n      /* ---------- 出生点 / 楼梯：一个在这头，一个在最远那头 ---------- */\\n      var dist = [], q = [], qi = 0;\\n      for (j = 0; j < MH; j++) { var dr = []; for (i = 0; i < MW; i++) dr.push(-1); dist.push(dr); }\\n\\n      var sRoom = rooms[ri(0, rooms.length - 1)];\\n      var sx = sRoom.cx, sy = sRoom.cy;\\n      map[sy][sx] = FLOOR;\\n      dist[sy][sx] = 0; q.push([sx, sy]);\\n      var DX = [0, 0, -1, 1], DY = [-1, 1, 0, 0];\\n      while (qi < q.length) {\\n        var c = q[qi++], cx2 = c[0], cy2 = c[1];\\n        for (var d4 = 0; d4 < 4; d4++) {\\n          var nx = cx2 + DX[d4], ny = cy2 + DY[d4];\\n          if (nx < 0 || ny < 0 || nx >= MW || ny >= MH) continue;\\n          if (map[ny][nx] !== FLOOR || dist[ny][nx] >= 0) continue;\\n          dist[ny][nx] = dist[cy2][cx2] + 1;\\n          q.push([nx, ny]);\\n        }\\n      }\\n\\n      var far = null, fd = -1;\\n      for (i = 0; i < rooms.length; i++) {\\n        var r2 = rooms[i], dd = dist[r2.cy][r2.cx];\\n        if (dd > fd) { fd = dd; far = r2; }\\n      }\\n      if (!far) far = sRoom;\\n\\n      return {\\n        map: map,\\n        rooms: rooms,\\n        spawn: [sx, sy],\\n        stairs: [far.cx, far.cy],\\n        water: fwater,\\n        meta: { kind: kind, feature: feat, roomCount: rooms.length, span: fd }\\n      };\\n    }\\n/*__FLOORGEN_END__*/\\n\\n    /* ---------------- 层机制：只改规则，不改目标 ---------------- */\\n    var FLOORMODS = [\\n      { id: 'none',  name: '常态', color: '#9aa8bd', hint: '这层没有异常。' },\\n      { id: 'fog',   name: '瘴气', color: '#8ee6a0', hint: '每回合 -1 体力，不会致死' },\\n      { id: 'rich',  name: '富矿', color: '#ffe08a', hint: '矿脉遍地，守卫更凶' },\\n      { id: 'blood', name: '血月', color: '#ff6b6b', hint: '敌人 +25% 攻，击杀回 6 体力' },\\n      { id: 'nest',  name: '巢穴', color: '#e05a8a', hint: '敌人成群，但都很虚弱' },\\n      { id: 'heavy', name: '重压', color: '#b9c6d8', hint: '每走一步 30% 概率挪不动' },\\n      { id: 'thorn', name: '反噬', color: '#c9a0ff', hint: '出手会吃 12% 反伤' },\\n      { id: 'echo',  name: '回响', color: '#7ad8ff', hint: '敌人感知 +4，跑不掉' },\\n      { id: 'swift', name: '疾行', color: '#ffb066', hint: '敌人移动速度 +1' }\\n    ];\\n\\n    /* ---------------- 玩法目标：这层要干什么 ---------------- */\\n    var OBJS = [\\n      { id: 'descend', name: '下潜', color: '#9fd8ff', hint: '找到楼梯' },\\n      { id: 'clear',   name: '肃清', color: '#ffd93d', hint: '清光这层的活物' },\\n      { id: 'hunt',    name: '讨伐', color: '#ff9d7a', hint: '杀掉这层的精英' },\\n      { id: 'survive', name: '坚守', color: '#c9a0ff', hint: '撑到楼梯开启' },\\n      { id: 'collect', name: '寻魂', color: '#7ad8ff', hint: '集齐 3 颗魂石' },\\n      /* BIGUI_v1：BIGMAP 没有楼梯也没有层目标，用这个占位，免得 HUD 上还挂着「下潜」 */\\n      { id: 'free',    name: '探索', color: '#9fd8ff', hint: '往深处走，路会自己长出来' }\\n    ];\\n\\n    /* ---------------- 族群：每层一种怪当主角 ----------------\\n       顺序跟每章的怪物池一致：蝠 / 史莱姆 / 哥布林 / 蛛 / 蛇 / 灵体 / 甲壳 / 幽魂 / 贼 / 骸骨 */\\n    var FAC_TITLES = ['蝠巢', '黏液池', '营地', '蛛网廊', '蛇窟', '魂灯道', '甲壳地', '怨灵厅', '贼窝', '骸骨殿'];\\n    var FAC_TRAITS = ['swift', 'split', 'call', 'spiky', 'venom', 'swift', 'spiky', 'venom', 'call', 'split'];\\n    var FAC_DESC = {\\n      swift: '跑得快，追上了会咬住不放',\\n      split: '打碎会分成两只小的',\\n      call: '一只发现你，整族都会扑过来',\\n      spiky: '打它会被扎',\\n      venom: '命中会让你中毒'\\n    };\\n\\n    /* ---------------- 布局 / 地形 的中文名（HUD 上给玩家看） ---------------- */\\n    var KIND_LABEL = {\\n      grid: '格栅地牢', street: '街区', bsp: '洞窟', void: '深渊回廊',\\n      boss: '竞技场', fixed: '古迹'\\n    };\\n    var FEAT_LABEL = {\\n      none: '', pillars: '柱厅', collapse: '塌方', chasm: '深渊裂谷', flood: '积水'\\n    };\\n    var FEAT_TIP = {\\n      none: '', pillars: '柱阵把大厅切成一格一格的走位题',\\n      collapse: '碎石堆挡住路，绕不开就得硬吃',\\n      chasm: '一道深不见底的裂口，只有几座独木桥',\\n      flood: '积水的格子走一步敌人多动一次'\\n    };\\n\\n    var FLOORG = {\\n      on: true,\\n      runSeed: ((Date.now() & 0x7fffffff) ^ ((Math.random() * 1e9) | 0)) | 0,\\n      mod: FLOORMODS[0],\\n      obj: OBJS[0],\\n      fac: null,\\n      lastMod: '',\\n      lastFeat: '',\\n      eliteRef: null,\\n      souls: [], soulN: 0, soulNeed: 3,\\n      needTurns: 0, objT0: 0,\\n      spawnX: 3, spawnY: 3,\\n      kindName: '', featName: '', roomCount: 0,\\n      floorTitle: '',\\n\\n      seedFor: function (f) { return (Math.imul(this.runSeed, 2654435761) + f * 40503) | 0; },\\n\\n      kindFor: function (id) {\\n        /* MOOD_v1：原来是「一章一种布局」，同一章六层走进去长得一模一样。\\n           现在章内三种布局轮着来 —— 相邻两层的房间形状不会撞。 */\\n        var kinds;\\n        if (id === 2) kinds = ['bsp', 'void', 'grid'];\\n        else if (id === 3) kinds = ['street', 'grid', 'bsp'];\\n        else if (id === 4) kinds = ['void', 'bsp', 'street'];\\n        else kinds = ['grid', 'bsp', 'street'];\\n        return kinds[(floorNo - 1) % kinds.length];\\n      },\\n\\n      /* 族群 / 机制 / 目标 / 地形 都按模板轮转，不纯随机：\\n         纯随机会出现「某种连出 12 层、某几种一次没有」的偏斜，\\n         轮转能保证 24 层里每种都轮到，且相邻两层不会撞。 */\\n      pickMod: function () {\\n        var tpl = ['none', 'fog', 'blood', 'rich', 'nest', 'heavy', 'echo', 'swift', 'thorn'];\\n        var k = (floorNo * 5 + (this.runSeed & 7)) % tpl.length;\\n        var id = tpl[k];\\n        if (id === this.lastMod) { k = (k + 1) % tpl.length; id = tpl[k]; }\\n        this.lastMod = id;\\n        for (var i = 0; i < FLOORMODS.length; i++) if (FLOORMODS[i].id === id) return FLOORMODS[i];\\n        return FLOORMODS[0];\\n      },\\n\\n      pickFeature: function () {\\n        var tpl = ['pillars', 'chasm', 'collapse', 'flood', 'none'];\\n        var k = (floorNo * 3 + (this.runSeed & 3)) % tpl.length;\\n        var f = tpl[k];\\n        if (f === this.lastFeat) { k = (k + 1) % tpl.length; f = tpl[k]; }\\n        this.lastFeat = f;\\n        return f;\\n      },\\n\\n      pickObj: function () {\\n        var tpl = ['descend', 'clear', 'descend', 'hunt', 'survive', 'descend',\\n                   'collect', 'clear', 'descend', 'hunt', 'descend \n          return n > 0 ? ('剩 ' + n + ' 个') : '已肃清';\\n        }\\n        if (o && o.id === 'hunt') return (this.eliteRef && this.eliteRef.hp > 0) ? '精英未死' : '已讨伐';\\n        if (o && o.id === 'survive') {\\n          var left = this.needTurns - (turnCount - this.objT0);\\n          return left > 0 ? ('再撑 ' + left) : '楼梯已开';\\n        }\\n        if (o && o.id === 'collect') return '魂石 ' + this.soulN + '/' + this.soulNeed;\\n        return (this.mod ? this.mod.hint : '');\\n      },\\n\\n      /* 踩到魂石 */\\n      soulAt: function (x, y) {\\n        for (var i = 0; i < this.souls.length; i++) {\\n          var s = this.souls[i];\\n          if (s.taken || s.x !== x || s.y !== y) continue;\\n          s.taken = true;\\n          this.soulN++;\\n          SFX.loot();\\n          msg('◆ 魂石 ' + this.soulN + '/' + this.soulNeed + '（' + (this.soulNeed - this.soulN) + ' 颗还没找到）', '#7ad8ff');\\n          VFX.ring((x + 0.5) * TILE, (y + 0.5) * TILE, '#7ad8ff', 6, 30, 0.35);\\n          return true;\\n        }\\n        return false;\\n      },\\n\\n      spot: function (minD, tries) {\\n        for (var t = 0; t < (tries || 80); t++) {\\n          var r = rooms[rint(0, rooms.length - 1)];\\n          if (!r) continue;\\n          var x = r.x + rint(0, r.w - 1), y = r.y + rint(0, r.h - 1);\\n          if (map[y][x] !== FLOOR) continue;\\n          if (Math.abs(x - this.spawnX) + Math.abs(y - this.spawnY) < minD) continue;\\n          if (monsterAt(x, y) || itemAt(x, y) || npcAt(x, y)) continue;\\n          return [x, y];\\n        }\\n        return null;\\n      },\\n\\n      build: function (L0) {\\n        var kind = this.kindFor(chap.id);\\n        var feat = this.pickFeature();\\n        var mod = this.pickMod();\\n        var obj = this.pickObj();\\n        var fac = this.pickFaction();\\n        if (mod.id === 'maze') kind = 'bsp';\\n\\n        var R = mulberry32(this.seedFor(floorNo));\\n        var spec = null;\\n        for (var t = 0; t < 6; t++) {\\n          var ini) { _mini.mini = 1; _mini.facT = 'none'; _made++; }\\n          }\\n          if (_made) log('  ' + m.name + ' 碎成了 ' + _made + ' 只幼体。', '#8ee6a0');\\n        }\\n      } else {\\n        log((crit ? '会心一击！' : '你击中 ') + m.name + '，造成 ' + dmg + ' 点伤害（剩 ' + m.hp + '）。', crit ? '#ffe08a' : '#ffe08a');\\n        if (_af && _af.id === 'leech') {\\n          var _lv2 = Math.max(1, Math.round(dmg * 0.15));\\n          p.hp = Math.min(p.maxHp, p.hp + _lv2);\\n        }\\n        SFX.hit();\\n      }\\n      /* 溅射护腕：25% 概率波及相邻敌人（波及伤害不再引发二次溅射） */\\n      if (hasRelic('splash') && !noSplash && Math.random() < 0.25) {\\n        for (var si = 0; si < mons.length; si++) {\\n          var sm = mons[si];\\n          if (sm === m || sm.hp <= 0) continue;\\n          if (Math.abs(sm.gx - m.gx) + Math.abs(sm.gy - m.gy) > 1) continue;\\n          var sd = Math.max(1, Math.round(dmg * 0.5));\\n          sm.hp -= sd; sm.hitT = 0.2; sm.alerted = true;\\n          fx.burst((sm.gx + 0.5) * TILE, (sm.gy + 0.5) * TILE, { color: '#9fd8ff', count: 7 });\\n          log('  溅射波及 ' + sm.name + '，造成 ' + sd + ' 点伤害。', '#9fd8ff');\\n          if (sm.hp <= 0) {\\n            killCount++; gainXp(sm.xp);\\n            if (!sm._cashed) { sm._cashed = true; dropLoot(sm); }\\n            if (hasRelic('bloodsigil')) p.hp = Math.min(p.maxHp, p.hp + 4);\\n            if (hasRelic('abyssheart')) st.abyssheart = Math.min(20, (st.abyssheart || 0) + 1);\\n          }\\n        }\\n      }\\n      return dmg;\\n    }\\n    /* OUTFITDROP_v1：按当前段数挑一件还没收集的服饰丢在地上 */\\n    function dropCloth(x, y) {\\n      var pool = [], i;\\n      for (i = 0; i < OUTFIT_DEFS.length; i++) {\\n        if (!hasCloth(OUTFIT_DEFS[i].id)) pool.push(OUTFIT_DEFS[i]);\\n      }\\n      if (!pool.length) return null;\\n      /* 档位跟着段数走：第 1-6 段只出粗布，7-12 赤纹，13-18 翠鳞，最深才见星辉 */\\n      var cap = Math.max(1, Math.min(CLOTH_TIERS.length, 1 + Math.floor((floorNo - 1) / FLOORS_PER_CH)));\\n      var pick = [];\\n      for (i = 0; i < pool.length; i++) if (pool[i].tier <= cap) pick.push(pool[i]);\\n      if (!pick.length) pick = pool;\\n      var c = pick[Math.floor(Math.random() * pick.length)];\\n      mkItem('cloth', x, y, { cid: c.id });\\n      return c;\\n    }\\n    /* 地上还有哪些衣服（验收脚本要看「实体掉在地上」而不是日志） */\\n    function clothGroundList() {\\n      var out = [], i;\\n      for (i = 0; i < items.length; i++) {\\n        if (items[i].kind !== 'cloth') continue;\\n        var d = outfitById(items[i].cid);\\n        out.push({ cid: items[i].cid, name: d ? d.name : '', x: items[i].gx, y: items[i].gy });\\n      }\\n      return out;\\n    }\\n    /* 场上物品按 kind 计数（验收/排查用：木桶到底有没有生成） */\\n    function itemKindCount() {\\n      var o = {}, i, k;\\n      for (i = 0; i < items.length; i++) { k = items[i].kind; o[k] = (o[k] || 0) + 1; }\\n      return o;\\n    }\\n\\n    function dropLoot(m) {\\n      var t = m.lootTier || 1;\\n      if (Math.random() < 0.5 * t && !itemAt(m.gx, m.gy)) mkItem('gem', m.gx, m.gy);\\n      if (Math.random() < 0.06 * t) dropCloth(m.gx, m.gy);   /* OUTFITDROP_v1 */\\n      if (m.boss) {\\n        mkItem('chest', m.gx, m.gy, { rich: true });\\n        msg('★ 深渊主宰倒下了，留下一个金光闪闪的宝箱！', '#ffe08a');\\n      } else if (m.elite && Math.random() < 0.7) {\\n        mkItem('chest', m.gx, m.gy, { rich: true });\\n      }\\n    }\\n    function gainXp(n) {\\n      p.xp += n;\\n      while (p.xp >= p.next) {\\n        p.xp -= p.next; p.lv++; p.maxHp += DIFF.lvHp; p.hp = Math.min(p.maxHp, p.hp + DIFF.lvHp + Math.round(p.maxHp * 0.30)); p.atk += 1;\\n        p.next = Math.round(p.next * 1.5);\\n        /* BALANCE_v97：防御是唯一能对冲怪攻成长的属性，原来从头到尾都是 1 */\\n        if (p.lv % 2 === 0) p.def += 1;\\n        log('★ 升级！你是 Lv.' + p.lv + '，体力上限 +9、攻击 +1' + (p.lv % 2 === 0 ? '、防御 +1' : '') + '。', '#a0f0ff');\\n        fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#a0f0ff', count: 20, speed: 190 });\\n        /* 升级回一点能量 */\\n        p.energy = Math.min(p.maxEnergy, p.energy + 25);\\n      }\\n    }\\n    /* ================= v9.9 背包 · 食物 ================= */\\n    /* 往背包里塞食物；同 id 叠成一格（跟塞尔达一样按数量堆） */\\n    function addFood(id, n) {\\n      if (!foodById(id)) return false;\\n      n = n || 1;\\n      for (var i = 0; i < p.food.length; i++) {\\n        if (p.food[i].id === id) { p.food[i].n += n; return true; }\\n      }\\n      p.food.push({ id: id, n: n });\\n      return true;\\n    }\\n\\n    /* 吃第 i 格食物：回血 + 数量 -1 + 一点点特效。\\n       血量满了就不让吃（免得白浪费），跟大多数游戏一个规矩。 */\\n    function eatFood(i) {\\n      var slot = p.food[i];\\n      if (!slot || slot.n <= 0) return { ok: false, why: '空' };\\n      var def = foodById(slot.id);\\n      if (!def) return { ok: false, why: '未知道具' };\\n      /* 能不能用，按道具类型分别判 —— 别用「血满就不让吃」一刀切，\\n         否则满血时解毒/增益道具全都点不动。 */\\n      if (def.cleanse && !(p.poison > 0)) return { ok: false, why: '没有异常状态' };\\n      if (!def.cleanse && !def.buff && p.hp >= p.maxHp && (!def.energy || p.energy >= p.maxEnergy))\\n        return { ok: false, why: '体力已满' };\\n      if (def.buff && p.atkBuff && p.atkBuff.until > Date.now()) return { ok: false, why: '药效还在' };\\n\\n      var heal = def.full ? (p.maxHp - p.hp) : Math.min(def.heal || 0, p.maxHp - p.hp);\\n      p.hp += heal;\\n      var eUp = 0;\\n      if (def.energy) { eUp = p.maxEnergy - p.energy; p.energy = p.maxEnergy; }\\n      var cured = 0;\\n      if (def.cleanse) { cured = p.poison || 0; p.poison = 0; }\\n      if (def.buff) p.atkBuff = { mul: def.buff.mul, until: Date.now() + def.buff.sec * 1000 };\\n      slot.n--;\\n      if (slot.n <= 0) p.food.splice(i, 1);\\n\\n      fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: def.color || '#8ee6a0', count: 16 });\\n      if (heal > 0) VFX.text((p.gx + 0.5) * TILE, (p.gy + 0.1) * TILE, '+' + heal, '#8ee6a0', 15);\\n      VFX.heal((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE);\\n      try { SFX.loot(); } catch (x) { }\\n\\n      var msg = def.full ? '体力全满。' : (def.heal > 0 ? '回复 ' + heal + ' 点体力。' : '');\\n      if (eUp > 0) msg += '能量灌满。';\\n      if ( .burst((tm.gx + 0.5) * TILE, (tm.gy + 0.5) * TILE, { color: '#8ee6a0', count: 6 });\\n          log('  荆棘甲扎向 ' + tm.name + '（5 点）。', '#8ee6a0');\\n        }\\n      }\\n      combo = 0;\\n    }\\n    function die() {\\n      over = true; SFX.dead();\\n      log('你倒在了第 ' + floorNo + ' 层……', '#ff8080');\\n      showOverlay('你倒下了', '第 ' + floorNo + ' 层 · Lv.' + p.lv + ' · 宝石 ' + p.gems +\\n        ' · 击杀 ' + killCount + '\\\\n最高单次伤害 ' + bestDamage, '#ff8080');\\n    }\\n    function victory() {\\n      /* v5.0：只有打完第三章才算真通关；打完第一/二章弹「进入下一章」 */\\n      /* 无论从哪条路径进来（实战打死 Boss / 测试钩子直接调用），\\n         都先把战斗界面与剧情弹窗收掉 —— 否则通关弹窗会被压住看不见。 */\\n      storyOpen = false; storyTimer = 0;\\n      if (chap.id < 3) {\\n        var nx = chap.id + 1;   /* THREECH_v1 */\\n        chapPending = nx;\\n        over = true; won = false;\\n        log('★ 你击退了「' + (chap.boss ? chap.boss.name : (BOSS_NAME[floorNo] || '守护者')) + '」，通往下一章的门开了。', '#ffe08a');\\n        showOverlay('★ ' + chap.name + ' 通关！',\\n          '即将进入 · 第 ' + nx + ' 章「' + THEMES['ch' + nx].name + '」' +\\n          '\\\\n\\\\nLv.' + p.lv + ' · 宝石 ' + p.gems + ' · 击杀 ' + killCount + ' · 回合 ' + turnCount +\\n          '\\\\n\\\\n按 ↺ / R / 空格 继续下一章', THEMES['ch' + nx].accent, '进入下一章');\\n        return;\\n      }\\n      over = true; won = true;\\n      chapPending = 0;   /* 终章通关必须清掉待进章标记，否则上一章残留的 chapPending\\n                            会让 R 键把玩家带进不存在的第 4 章 */\\n      log('你带着深渊的回响走出了地牢！', '#ffe08a');\\n      showOverlay('★ 三章通关！', 'Lv.' + p.lv + ' · 宝石 ' + p.gems + ' · 击杀 ' + killCount +\\n        ' · 回合 ' + turnCount + '\\\\n最高单次伤害 ' + bestDamage, '#ffe08a');\\n    }\\n\\n    /* ================= 玩家行动 ================= */\\n    function playerAct(dx, dy) {\\n      if (over) return;\\n      /* v7.0：这一步的动静多大 —— 怪物的听觉靠它 */\\n      AI.noise = (dx || dy) ? 8 : 3;\\n      turnCount++;\\n      relicTurnTick();              /* v6.0：遗物每回合效果 */\\n      if (over) return;\\n      tickChapterMechanics();       /* v5.0：章内小机制（水域掉血等） */\\n      if (over) return;\\n      /* v7.0 层机制「瘴气」：每回合 -1 体力，吊不住命但拖得下去 */\\n      if (FLOORG.mod && FLOORG.mod.id === 'fog' && !CHEAT.god && p.hp > 1) {\\n        p.hp -= 1;\\n        if (turnCount % 4 === 0) log('瘴气在啃你的肺（-1 体力）。', '#8ee6a0');\\n      }\\n      if (dx || dy) { p.fx = dx || p.fx; p.fy = dy; }\\n      /* 中毒扣血 */\\n      if (p.poison > 0) {\\n        p.poison--;\\n        if (!CHEAT.god) p.hp -= 2;\\n        if (p.hp <= 0) { p.hp = 0; die(); return; }\\n        log('毒素侵蚀，失去 2 点体力。', '#a0e0a0');\\n      }\\n      if (!dx && !dy) { log('你静静站定，回了一口气。', '#9aa8bd'); monsterTurn(); endTurn(); return; }\\n      var nx = p.gx + dx, ny = p.gy + dy;\\n      if (CHEAT.ghosts && nx > 0 && ny > 0 && nx < MW - 1 && ny < MH - 1) { p.gx = nx; p.gy = ny; if (!over) { monsterTurn(); endTurn(); } return; }\\n\\n      /* 撞 NPC：打开商店 */\\n      var npc = npcAt(nx, ny);\\n      if (npc) { openShop(npc); return; }\\n      /* 撞怪物：攻击 */\\n      var m = monsterAt(nx, ny);\\n      if (m) {\\n        AI.noise = 12;                 /* 打起来动静最大 */\\n        attackMonster(m);\\n        if (over) return;\\n        var _sw = weaponAffix();\\n        if (_sw && _sw.id === 'swift' && Math.random() < 0.15) {\\n          msg('» 迅捷 —— 它还没反应过来。', '#7ad8ff');\\n          return;\\n        }\\n        monsterTurn(); endTurn(); return;\\n      }\\n      /* 撞木桶/木箱：打碎 */\\n      var bar = barrelAt(nx, ny);\\n      if (bar) {\\n        smashBarrel(bar);\\n        monsterTurn(); endTurn();\\n        return;\\n      }\\n      if (!walkable(nx, ny)) { log('前面是石墙。', '#8a97ae'); return; }\\n      /* v7.0 层机制「重压」：有概率挪不动 */\\n      if (FLOORG.mod && FLOORG.mod.id === 'heavy' && !CHEAT.god && Math.random() < 0.30) {\\n        log('地面吸住你的脚，这一步没能挪动。', '#b9c6d8');\\n        monsterTurn(); endTurn(); return;\\n      }\\n\\n      p.gx = nx; p.gy = ny;\\n      SFX.step();\\n      VFX.dust((nx + 0.5) * TILE, (ny + 0.5) * TILE);\\n      /* v7.3：水里每一步都更沉 —— 它们趁机多走一次（深水另扣血，见 tickChapterMechanics） */\\n      if (waterSlows()) {\\n        var _ws = waterAt(p.gx, p.gy);\\n        FLOORG.slowN = (FLOORG.slowN || 0) + 1;\\n        log(_ws && _ws.deep ? '水没到腰，一步顶两步 —— 它们跟上来了。'\\n                            : '趟过积水，脚步被拖住 —— 它们跟上来了。', '#6fe3c4');\\n        monsterTurn();\\n        if (over) return;\\n      }\\n      /* 踩陷阱 */\\n      var tr = trapAt(nx, ny);\\n      if (tr) { tr.armed = false; hurtPlayer(tr.dmg, '地刺陷阱', '#ffb3b3'); SFX.trap(); if (over) return; }\\n      pickupAt(nx, ny);\\n      /* v7.2 「寻魂」目标：踩到魂石计数 */\\n      if (FLOORG.obj && FLOORG.obj.id === 'collect') FLOORG.soulAt(nx, ny);\\n      if (over) return;\\n      if (map[ny][nx] === STAIRS) {\\n        /* v7.2：目标没完成时楼梯是锁着的 */\\n        var _bk = FLOORG.blocked();\\n        if (_bk) { msg(_bk, '#ff9d7a'); SFX.trap(); return; }\\n        descend(); return;\\n      }\\n      /* 时间沙漏：20% 概率这一步不惊动敌人 */\\n      if (hasRelic('hourglass') && Math.random() < 0.20) {\\n        msg('⧗ 时间被拉长了一瞬 —— 这一步没有惊动它们。', '#ffca5c');\\n        return;\\n      }\\n      monsterTurn();\\n      endTurn();\\n    }\\n    /* v6.0 遗物：每个行动回合触发一次 */\\n    function relicTurnTick() {\\n      if (over) return;\\n      var st = relicSt();\\n      st.turns = (st.turns || 0) + 1;\\n      if (hasRelic('bandage') && st.turns % 6 === 0) {\\n        p.hp = Math.min(p.maxHp, p.hp + 3);\\n        log('旧绷带止住了血（+3 体力）。', '#8ee6a0');\\n      }\\n      if (hasRelic('bloodpact') && !CHEAT.god) {   /* GODFIX_v1：原来漏了无敌守卫 */\\n        p.hp -= 1;\\n        /* 原来这条扣血完全静默 —— 玩家只觉得「莫名其妙掉血」 */\\n        if (st.turns % 4 === 0) log('血契在索取代价（-1 体力）。', '#c98a8a');\\n        if (p.hp <= 0) { p.hp = 0; die(); return; }\\n      }\\n      if (hasRelic('finaleye')) {\\n        if (!st.finaleyeReady) {\\n          st.finaleyeTick = (st.finaleyeTick || 0) + 1;\\n          if (st.finaleyeTick >= 8) { st.finaleyeReady = true; st.finaleyeTick = 8; }\\n        }\\n      }\\n    }\\n\\n    function endTurn() {\\n      if (over) return;\\n      comboTimer = Math.max(0, comboTimer - 0.8);\\n      if (comboTimer <= 0) combo = 0;\\n      p.energy = Math.min(p.maxEnergy, p.energy + 4);\\n      try { syncSector(); } catch (e) { }   /* BIGSECTOR_v1：走过去就推进进度 */\\n    }\\n\\n    function smashBarrel(bar) {\\n      var idx = items.indexOf(bar);\\n      if (idx >= 0) items.splice(idx, 1);\\n      killItemEntity(bar.id);\\n      fx.burst((bar.gx + 0.5) * TILE, (bar.gy + 0.5) * TILE, { color: ['#c98a4b', '#8a5a2b'], count: 12 });\\n      SFX.hit();\\n      /* OUTFITDROP_v1：不再直接塞进兜里 —— 全部改成地面实体，走过去自己捡 */\\n      if (bar.loot === 'hp') {\\n        mkItem('potion', bar.gx, bar.gy, { sub: 'heal' });\\n        log('打碎木桶，里面滚出一瓶红药水。', '#ff9db0');\\n      } else {\\n        var g = rint(1, 3);\\n        if (hasRelic('scavenger')) g *= 2;\\n        for (var _gi = 0; _gi < Math.min(3, g); _gi++) mkItem('gem', bar.gx, bar.gy);\\n        if (g > 3) p.gems += g - 3;                 /* 拾荒者翻倍时多出来的那几颗兜底 */\\n        if (Math.random() < 0.18) dropCloth(bar.gx, bar.gy);\\n        log('打碎木桶，滚出东西落在脚边。', '#ffe08a');\\n      }\\n      SFX.loot();\\n      turnCount++;\\n    }\\n\\n    function pickupAt(x, y) {\\n      for (var i = items.length - 1; i >= 0; i--) {\\n        var it = items[i];\\n        if (it.gx !== x || it.gy !== y) continue;\\n        if (it.kind === 'rune') {\\n          /* PUZZLE_v1：符文不消耗，踩上去切换，走开还能再踩 */\\n          puzTap(it.sec || 1, it.idx);\\n          return;\\n        }\\n        if (it.kind === 'gem') {\\n          var gg = hasRelic('luckycoin') ? 2 : 1;\\n          p.gems += gg; SFX.loot();\\n          VFX.sparkle((x + 0.5) * TILE, (y + 0.5) * TILE, '#ffe08a');\\n          log('拾得' + (gg > 1 ? '两' : '一') + '颗深渊宝石（共 ' + p.gems + '）。', '#ffe08a');\\n        }\\n        else if (it.kind === 'potion') {\\n          if (it.sub === 'heal') {\\n            var hv = hasRelic('bread') ? 32 : 22;   /* BALANCE_v97：固定 14 在后期只回 17% */\\n            p.hp = Math.min(p.maxHp, p.hp + hv);\\n            log('喝下红色药水，恢复 ' + hv + ' 点体力。', '#ff9db0');\\n            VFX.heal((x + 0.5) * TILE, (y + 0.5) * TILE);\\n          }\\n          else if (it.sub === 'max') {\\n            var mv = hasRelic('bread') ? 7 : 5;\\n            p.maxHp += mv; p.hp += mv;\\n            log('喝下绿色药水，体力上限 +' + mv + '。', '#8ee6a0');\\n          }\\n          else if (it.sub === 'power') { p.atk += 1; log('喝下蓝色药水，攻击 +1。', '#9fd8ff'); }\\n          else if (it.sub === 'energy') { p.energy = p.maxEnergy; log('喝下灰色药水，能量全满。', '#c9d4e3'); }\\n          SFX.loot();\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'weapon') {\\n          pickWeapon(WEAPONS[it.wi], !!it.story);\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'cloth') {\\n          /* OUTFITDROP_v1：踩上去才算捡到 */\\n          var _cd = outfitById(it.cid);\\n          if (giveCloth(it.cid)) {\\n            log('捡到「' + (_cd ? _cd.name : '服饰') + '」' +\\n                (_cd && _cd.line ? '（' + _cd.line + '）' : '') + ' —— 按 B 打开背包穿上。', '#b7d4ff');\\n            VFX.sparkle((x + 0.5) * TILE, (y + 0.5) * TILE, '#b7d4ff');\\n          } else {\\n            log('这件服饰你已经有了。', '#9aa7bb');\\n          }\\n          SFX.loot();\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'chest') {\\n          openChest(it, x, y);\\n          items.splice(i, 1); killItemEntity(it.id);\\n        } else if (it.kind === 'shrine') {\\n          openShrine(it, x, y);\\n          return;   /* 神龛不销毁，可反复看（但只给一次） */\\n        } else if (it.kind === 'event') {\\n          openEvent(it, x, y);\\n          return;   /* 事件点不销毁，已用过的会变成灰烬 */\\n        }\\n      }\\n    }\\n    function openChest(it, x, y) {\\n      var rich = !!it.rich;\\n      /* OUTFITDROP_v1：宝箱里也开得出衣服，落地后自己去捡（rich 40% / 普通 25%） */\\n      if (Math.random() < (rich ? 0.40 : 0.25)) {\\n        var _cc = dropCloth(x, y);\\n        if (_cc) { log('宝箱里是一件「' + _cc.name + '」，掉在你脚边。', '#b7d4ff'); return; }\\n      }\\n      var roll = Math.random();\\n      if (roll < (rich ? 0.25 : 0.4)) {\\n        var g = rich ? rint(6, 12) : rint(2, 4);\\n        if (hasRelic('scavenger')) g *= 2;\\n        p.gems += g;\\n        log('撬开宝箱，摸到 ' + g + ' 颗宝石。', '#ffe08a');\\n      } else if (roll < (rich ? 0.5 : 0.75)) {\\n        p.hp = Math.min(p.maxHp, p.hp + (rich ? 20 : 10));\\n        log('宝箱里是一瓶红色药水，恢复 ' + (rich ? 20 : 10) + ' 点体力。', '#ff9db0');\\n      } else {\\n        var tier = rich ? 2 : 0;\\n        var w2 = WEAPONS[Math.min(6, Math.floor(floorNo / 2) + rint(tier, tier + 1))];\\n        pickWeapon(w2, false);\\n      }\\n      fx.burst((x + 0.5) * TILE, (y + 0.5) * TILE, { color: '#ffe08a', count: 16 });\\n      SFX.loot();\\n    }\\n    /* 神龛：三选一升级，每座只给一次 */\\n    function openShrine(it, x, y) {\\n      if (it.used) {\\n        log('这座神龛的祝福已被取走。', '#9aa8bd');\\n        return;\\n      }\\n      shrineOpen = true;\\n      shrineChoices = [\\n        { id: 'hp', name: '体魄', desc: '体力上限 +8，立刻回满', apply: function () { p.maxHp += 8; p.hp = p.maxHp; } },\\n        { id: 'atk', name: '锐锋', desc: '攻击 +2', apply: function () { p.atk += 2; } },\\n        { id: 'def', name: '铁壁', desc: '防御 +1，并获得 8 点护盾', apply: function () { p.def += 1; p.shield = (p.shield || 0) + 8; } }\\n      ];\\n      shrineRef = it;\\n      SFX.shop();\\n      log('你触摸了古老神龛，三道祝福在眼前浮现……（按 1 / 2 / 3 选择）', '#c9a0ff');\\n    }\\n    function chooseShrine(n) {\\n      if (!shrineOpen || !shrineChoices[n]) return;\\n      var c = shrineChoices[n];\\n      c.apply();\\n      if (shrineRef) { shrineRef.used = true; }\\n      shrineOpen = false; shrineChoices = null; shrineRef = null;\\n      shrinesUsed++;\\n      fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: '#c9a0ff', count: 22, speed: 200 });\\n      log('★ 你选择了「' + c.name + '」：' + c.desc + '。', '#c9a0ff');\\n      SFX.loot();\\n      monsterTurn(); endTurn();\\n    }\\n\\n    var shrineOpen = false, shrineChoices = null, shrineRef = null;\\n    var shopOpen = false, shopRef = null, shopStock = [];\\n\\n    /* 商店：花宝石买补给 */\\n    function openShop(npc) {\\n      shopOpen = true; shopRef = npc;\\n      if (!shopStock.length) shopStock = [\\n        { name: '红药水（回 18）', cost: 3, kind: 'potion', sub: 'heal' },\\n        { name: '蓝药水（攻击 +1）', cost: 6, kind: 'potion', sub: 'power' },\\n        { name: '绿色药水（上限 +5）', cost: 5, kind: 'potion', sub: 'max' },\\n        { name: '满能量（能量补满）', cost: 4, kind: 'energy' },\\n        { name: '强化武器（随机更高档）', cost: 8, kind: 'weapon' }\\n      ];\\n      SFX.shop();\\n      log('💠 商人：' + ('' + '欢迎，旅人。按 1-' + shopStock.length + ' 购买，0 离开。宝石：' + p.gems), '#ffe08a');\\n    }\\n    function buyFromShop(n) {\\n      if (!shopOpen) return;\\n      if (n < 0 || n >= shopStock.length) { shopOpen = false; log('你离开了商店。', '#9aa8bd'); return; }\\n      var s = shopStock[n];\\n      if (p.gems < s.cost) { log('宝石不够（需要 ' + s.cost + '，你有 ' + p.gems + '）。', '#ff8080'); return; }\\n      p.gems -= s.cost;\\n      if (s.kind === 'potion') {\\n        if (s.sub === 'heal') { p.hp = Math.min(p.maxHp, p.hp + 18); log('商人递来红药水，恢复 18 点体力。', '#ff9db0'); }\\n        else if (s.sub === 'power') { p.atk += 1; log('喝下蓝药水，攻击 +1。', '#9fd8ff'); }\\n        else if (s.sub === 'max') { p.maxHp += 5; p.hp += 5; log('喝下绿药水，体力上限 +5。', '#8ee6a0'); }\\n      } else if (s.kind === 'energy') { p.energy = p.maxEnergy; log('一股暖流涌遍全身，能量补满。', '#c9d4e3'); }\\n      else if (s.kind === 'weapon') {\\n        var lo = Math.min(6, (p.cur < 0 ? 0 : WEAPONS.length - 1) + 1);\\n        var w = WEAPONS[Math.min(6, lo + rint(0, 1))];\\n        pickWeapon(w, false);\\n      }\\n      SFX.loot();\\n    }\\n\\n    /* ---- 技能 ---- */\\n/*__SKILLAIM_BEGIN__*/\\n    /* ================= AIMANGLE_v1：技能朝向 =================\\n       电脑（精确指针、无触摸）→ 按住数字键 + 移动鼠标 = 任意角度瞄准\\n       手机（有触摸点）        → 长按技能键拖拽 = 任意角度瞄准\\n       两者松手都调 AIM.cast()，方向统一是**单位向量**。 */\\n    var AIM = {\\n      desktop: true,\\n      press: null,      /* { i, src:'kb'|'touch', x0, y0, el } */\\n      dir: null,        /* 归一化浮点 [ux, uy]，null = 没在瞄准 */\\n      vec: null,        /* 只在 useSkill 执行期间有值，供结算与演出读 */\\n      dragPx: 0,\\n      casts: 0,         /* 累计施法次数：验收要判断「真的放出去了」，\\n                           worldSk 会被回收/封顶，长度不可靠 */\\n      lock: null,       /* { gx, gy, t } 刚锁到的目标，画个框再淡出 */\\n      TH: 16,           /* 拖过 16px 才算「我要选方向」 */\\n      SNAP: 0.1392,     /* sin(8°)：贴轴死区 */\\n      STEP: 0.20,       /* 射线采样步长（格）。0.2 < 1 格，不会跳格 */\\n      MAXR: { pierce: 8, bolt: 10 },\\n      DIRECTIONAL: { pierce: 1, bolt: 1 },   /* 只有这两个技能吃朝向 */\\n\\n      detect: function () {\\n        try {\\n          var fine = window.matchMedia && window.matchMedia('(pointer: fine)').matches;\\n          var touch = ('ontouchstart' in window) ||\\n                      ((navigator && navigator.maxTouchPoints || 0) > 0);\\n          AIM.desktop = !!fine && !touch;\\n        } catch (e) { AIM.desktop = true; }\\n        return AIM.desktop;\\n      },\\n\\n      /* 拖拽/指向向量 -> 单位向量。贴轴 8° 内吸附，保证「正上正右」点得准 */\\n      dirFrom: function (dx, dy) {\\n        var L = Math.sqrt(dx * dx + dy * dy);\\n        if (!L) return [1, 0];\\n        var ux = dx / L, uy = dy / L;\\n        var ax = Math.abs(ux), ay = Math.abs(uy);\\n        if (ay < AIM.SNAP) return [ux >= 0 ? 1 : -1, 0];\\n        if (ax < AIM.SNAP) return [0, uy >= 0 ? 1 : -1];\\n        return [ux, uy];\\n      },\\n\\n      /* ---- 射线：沿单位向量按 0.2 格采样，去重后按顺序返回经过的格子 ----\\n         不用 DDA 是有意的：0.2 格步长不可能整格跳过，且斜穿格角时两格都算 ——\\n         对玩家更宽容，也不会出现「明明画了走廊却打空」。 */\\n      rayCells: function (gx, gy, ux, uy, maxN) {\\n        var out = [], seen = {}, cx = gx + 0.5, cy = gy + 0.5;\\n        for (var d = AIM.STEP; d <= maxN + 1; d += AIM.STEP) {\\n          var ii = Math.floor(cx + ux * d), jj = Math.floor(cy + uy * d);\\n          if (ii === gx && jj === gy) continue;\\n          var key = ii + ',' + jj;\\n          if (seen[key]) continue;\\n          seen[key] = 1;\\n          out.push([ii, jj]);\\n          if (out.length >= maxN) break;\\n        }\\n        return out;\\n
