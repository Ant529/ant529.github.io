;\\n    var TCOVER_W = 280, TCOVER_H = 201;\\n    /* TITLEART_v2：封面换成横图（280×201）。竖屏画布上「按宽铺满」只占到 280 高，\\n       以前剩下的黑底全堆在下面，空一大块 —— 现在封面在上半区**垂直居中**，\\n       标题文字挪到按键正上方（textY），黑底分成上下两段，看着是有意留白而不是漏画。 */\\n    function titleLayout() {\\n      var n = TITLE_ITEMS.length, bh = 46, gap = 10;\\n      var blocks = n * bh + (n - 1) * gap;\\n      var iw, ih, ix, iy, textY, bx, by, bw, tx;\\n      if (CW > CH) {\\n        /* ★ 横屏（电脑版 640×360）：左边封面 + 标题，右边一列按键。\\n           竖着摞在 360 高的画布上会把标题挤出屏幕（踩过）。 */\\n        var lw = Math.round(CW * 0.5);\\n        iw = Math.min(lw - 32, 300);\\n        ih = Math.round(iw * TCOVER_H / TCOVER_W);\\n        var maxH = CH - 64;                       /* 封面下方还要放标题 */\\n        if (ih > maxH) { ih = maxH; iw = Math.round(ih * TCOVER_W / TCOVER_H); }\\n        ix = Math.round((lw - iw) / 2);\\n        iy = Math.max(6, Math.round((CH - ih - 40) / 2));\\n        textY = iy + ih + 26;\\n        bw = Math.min(260, CW - lw - 48);\\n        bx = lw + Math.round((CW - lw - bw) / 2);\\n        by = Math.round((CH - blocks) / 2);\\n        tx = ix + iw / 2;\\n      } else {\\n        /* 竖屏（手机 360×640）：封面 + 标题 + 按键整摞垂直居中 */\\n        iw = CW; ih = Math.round(iw * TCOVER_H / TCOVER_W);\\n        var chrome = 52 + 92 + blocks;            /* 标题区 + 空隙 + 按键 */\\n        var ihMax = CH - chrome - 10;\\n        if (ih > ihMax) { ih = ihMax; iw = Math.round(ih * TCOVER_W / TCOVER_H); }\\n        var stackH = ih + chrome;\\n        iy = Math.max(0, Math.round((CH - stackH) / 2));\\n        textY = iy + ih + 52;\\n        by = Math.min(CH - 14 - blocks, textY + 92);\\n        bw = Math.min(CW - 56, 272);\\n        bx = Math.round((CW - bw) / 2);\\n        tx = CW / 2;\\n      }\\n      return { iw: iw, ih: ih, ix: ix, iy: iy,\\n               bx: bx, bw: bw, bh: bh, gap: gap, by: by, n: n,\\n               textY: textY, tx: tx };\\n    }\\n    /* 四向描边白字：封面底色亮，单靠右下 2px 硬阴影压不住 */\\n    function uiTextEdge(ctx, str, x, y, font, color) {\\n      ctx.font = font;\\n      ctx.fillStyle = '#000';\\n      ctx.fillText(str, x - 2, y); ctx.fillText(str, x + 2, y);\\n      ctx.fillText(str, x, y - 2); ctx.fillText(str, x, y + 2);\\n      ctx.fillText(str, x - 1, y - 1); ctx.fillText(str, x + 1, y + 1);\\n      ctx.fillText(str, x - 1, y + 1); ctx.fillText(str, x + 1, y - 1);\\n      ctx.fillStyle = color;\\n      ctx.fillText(str, x, y);\\n    }\\n    /* ★ 标题页的按键不能用 uiBar：它选中态是「整根反黑」，而标题页下半屏本来就是黑底，\\n       反黑等于隐形（第一版就是这个坑，截图里只剩一行白字悬在黑里）。\\n       这里改成「未选：近黑底 + 紫细边」/「选中：亮紫底 + 淡紫细边」，黑底上都看得见。 */\\n    function titleBar(ctx, x, y, w, h, sel) {\\n      ctx.fillStyle = sel ? '#F0E6FF' : UI_SKIN.fill;\\n      ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = sel ? UI_SKIN.fill : '#0B0714';\\n      ctx.fillRect(x + 3, y + 3, w - 6, h - 6);\\n    }\\n\\n    var titleOpen = false, titleIdx = 0;\\n    var TITLE_ITEMS = ['继续游戏', '新的深渊'];\\n    function titleInit() {\\n      titleOpen = true;\\n      /* v9.4：无存档时不再摆一行「继续游戏（无存档）」的死项 ——\\n         那是点得动但只会开新局的假菜单。有存档才给两项。 */\\n      TITLE_ITEMS = hasSave() ? ['继续游戏', '新的深渊'] : ['新的深渊'];\\n      titleIdx = 0;\\n    }\\n    /* TITLEART_v1：按键是真按键了 —— 点它选中，再点一下才进。\\n       原来「点屏幕任意处直接开局」，配上看得见的按钮就成了天天误触。 */\\n    function titleActivate() {\\n      SFX.shop();\\n      if (titleIdx === 0 && hasSave()) { titleOpen = false; loadGame(); }\\n      else { titleOpen = false; restart(); storyOnEnter(1); }\\n    }\\n    /* ================= TITLEFIX_v1：返回标题页 =================\\n       用户：「我返回标题，我莫名其妙地就跑到第二章了。」\\n       原因：菜单二次确认那条路只调了 titleInit()，over / chapPending /\\n       通关遮罩全留着，标题页上就压着「即将进入 第 2 章」。\\n       这里把所有「本局状态」一次性清干净 —— 和 restart() / loadGame() 一个标准。 */\\n    function backToTitle() {\\n      CFG.open = false; CFG.confirm = null; CFG.help = false;\\n      Choice.on = false; shopOpen = false; shrineOpen = false; storyOpen = false;\\n      over = false; won = false;\\n      chapPending = 0;         /* 残留的待进章标记：不清就会在下次 over 时直接跳过去 */\\n      hitStop = 0;             /* 顿帧残留会吞掉标题页的头几次输入 */\\n      if (overlayText) {       /* ★「即将进入 第 2 章」那行字就挂在这三个实体上 */\\n        overlayText.visible = false; overlaySub.visible = false; overlayBg.visible = false;\\n      }\\n      titleInit();\\n      return { over: over, won: won, pending: chapPending, floor: floorNo, chap: chap.id };\\n    }\\n\\n    function updateTitle(dt) {\\n      var inp = game.input;\\n      if (inp.justPressed('up') || inp.justPressed('KeyW')) { titleIdx = Math.max(0, titleIdx - 1); SFX.step(); }\\n      if (inp.justPressed('down') || inp.justPressed('KeyS')) { titleIdx = Math.min(TITLE_ITEMS.length - 1, titleIdx + 1); SFX.step(); }\\n      if (inp.pointer.justDown) {\\n        var _L = titleLayout(), _hit = -1;\\n        for (var _i = 0; _i < TITLE_ITEMS.length; _i++) {\\n          var _y = _L.by + _i * (_L.bh + _L.gap);\\n          if (inp.pointer.y >= _y && inp.pointer.y <= _y + _L.bh &&\\n              inp.pointer.x >= _L.bx && inp.pointer.x <= _L.bx + _L.bw) { _hit = _i; break; }\\n        }\\n        if (_hit < 0) { titleActivate(); return; }        /* 点空白 = 确认当前项 */\\n        if (_hit === titleIdx) { titleActivate(); return; }\\n        titleIdx = _hit; SFX.step(); return;\\n      }\\n      if (inp.justPressed('space') || inp.justPressed('Enter')) titleActivate();\\n    }\\n    /* ================= 面板皮肤（UI_SKIN） =================\\n       用户手绘样图：纯紫平涂 + 粗黑描边 + 方角。整个 UI 只认这两个颜色。\\n       U = 4：外框 2U=8px、条框 1U=4px（360 宽画布上的取值，见 inject_uiskin.py 注释）。\\n       panelFrame 画「黑底整块 + 紫底内缩 2U」，就是样图那个粗黑外框。 */\\n    var UI_SKIN = { U: 4, ink: '#000000', fill: '#6F3CDB', text: '#ffffff', sub: '#E2D5FF', dim: '#4E2A97' };\\n\\n    function uiPanel(ctx, x, y, w, h) {\\n      var U = UI_SKIN.U;\\n      ctx.fillStyle = UI_SKIN.ink; ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = UI_SKIN.fill; ctx.fillRect(x + U * 2, y + U * 2, w - U * 4, h - U * 4);\\n    }\\n    /* 样图里那两根「黑框条」：1U 黑边 + 紫内填；sel=true 时整条反成黑底 */\\n    function uiBar(ctx, x, y, w, h, sel) {\\n      var U = UI_SKIN.U;\\n      ctx.fillStyle = UI_SKIN.ink; ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = sel ? UI_SKIN.ink : UI_SKIN.fill;\\n      ctx.fillRect(x + U, y + U, w - U * 2, h - U * 2);\\n    }\\n    /* 带黑描边的白字（像素 UI 的惯用手法：偏移 2px 的硬阴影，不用模糊） */\\n    function uiText(ctx, s, x, y, font, color, shadow) {\\n      ctx.font = font;\\n      if (shadow) { ctx.fillStyle = UI_SKIN.ink; ctx.fillText(s, x + 2, y + 2); }\\n      ctx.fillStyle = color; ctx.fillText(s, x, y);\\n    }\\n\\n    function drawTitle(ctx) {\\n      if (!titleOpen) return;\\n      var cx = CW / 2, L = titleLayout();\\n      /* 横屏时标题贴着封面（左半），按键在右半 —— 两处中心不一样，别都用 CW/2 */\\n      var tx = L.tx, bcx = L.bx + L.bw / 2;\\n      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);\\n\\n      /* TITLEART_v1：整幅封面（保持比例，画不下的高度已经由 layout 让给按键） */\\n      if (TITLE_COVER && TITLE_COVER.complete && TITLE_COVER.width) {\\n        ctx.imageSmoothingEnabled = false;\\n        ctx.drawImage(TITLE_COVER, L.ix, L.iy, L.iw, L.ih);\\n      } else {\\n        ctx.fillStyle = '#241038'; ctx.fillRect(0, 0, CW, L.ih);\\n      }\\n\\n      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\\n\\n      /* 标题文字：挪到封面下方的黑底上（横图铺不满竖屏，正好当标题区） */\\n      var ty = L.textY;\\n      uiTextEdge(ctx, '深 渊 之 底', tx, ty, 'bold 26px monospace', '#ffffff');\\n      /* TITLEMETA_v1：副标题按常量算，别再硬编码「四章 · 48 层」 */\\n      uiTextEdge(ctx, 'v12 · ' + Math.ceil(MAX_FLOOR / FLOORS_PER_CH) + ' 章 · ' + MAX_FLOOR + ' 段',\\n        tx, ty + 22, 'bold 10px monospace', '#E2D5FF');\\n      var inf = saveInfo();\\n      if (inf) {\\n        uiTextEdge(ctx, '存档 第 ' + inf.floor + ' 段 · Lv.' + (inf.p ? inf.p.lv : '?') + ' · ◆' + (inf.p ? inf.p.gems : 0),\\n          tx, ty + 40, '10px monospace', '#E2D5FF');\\n      }\\n\\n      /* 按键：1U 黑框 + 紫内填；选中那条整根反黑 */\\n      for (var i = 0; i < TITLE_ITEMS.length; i++) {\\n        var y = L.by + i * (L.bh + L.gap), sel = i === titleIdx;\\n        titleBar(ctx, L.bx, y, L.bw, L.bh, sel);\\n        ctx.textAlign = 'center';\\n        ctx.font = 'bold 17px monospace';\\n        ctx.fillStyle = UI_SKIN.text;\\n        ctx.fillText((sel ? '▶ ' : '   ') + TITLE_ITEMS[i], bcx, y + L.bh / 2 + 6);\\n      }\\n\\n      var tou = (typeof window !== 'undefined') && (('ontouchstart' in window) || (navigator && navigator.maxTouchPoints > 0));\\n      uiTextEdge(ctx, tou ? '点按键开始' : '↑↓ 选择 · 空格 确认', cx, CH - 8, 'bold 10px monospace', '#CDB6FF');\\n      ctx.textAlign = 'left';\\n    }\\n\\n    /* ================= v4.0 主控面板（ESC 唤出 · 纯常规设置） =================\\n       这里只有「正常玩家需要的东西」：音量、音效、操作说明、存读档、返回标题。\\n       调试用的「挂」不在这个面板里，也不在任何菜单/提示里出现 ——\\n       它只认游戏里连按三次 P（连他自己都懒得写在界面上）。\\n       ==================================================================== */\\n    var CFG_ITEMS = [\\n      { id: 'resume',  name: '继续游戏', kind: 'go',     hint: '回到地牢' },\\n      { id: 'sfx',     name: '音效',     kind: 'toggle', hint: '关掉就是静音' },\\n      { id: 'bgm',     name: '背景音乐', kind: 'toggle', hint: '程序合成的环境乐' },\\n      { id: 'vol',     name: '音量',     kind: 'range',  hint: '← → 调节' },\\n      { id: 'help',    name: '操作说明', kind: 'go',     hint: '键位与玩法' },\\n      { id: 'save',    name: '保存进度', kind: 'go',     hint: '写到本机存档' },\\n      { id: 'load',    name: '读取存档', kind: 'go',     hint: '回到上次存档' },\\n      { id: 'title',   name: '返回标题', kind: 'go',     hint: '当前进度不保留' },\\n      { id: 'restart', name: '重新开始', kind: 'go',     hint: '从第 1 层重来' }\\n    ];\\n    var CFG_VOLS = [0, 0.25, 0.5, 0.75, 1];\\n    var CFG_VOL_NAME = ['静音', '低', '中', '偏高', '高'];\\n\\n    function cfgVolIdx() {\\n      var best = 0, bd = 9;\\n      for (var i = 0; i < CFG_VOLS.length; i++) {\\n        var d = Math.abs(CFG_VOLS[i] - CFG.vol);\\n        if (d < bd) { bd = d; best = i; }\\n      }\\n      return best;\\n    }\\n    function cfgVolLabel() { return CFG_VOL_NAME[cfgVolIdx()] || String(Math.round(CFG.vol * 100)); }\\n    function cfgOpen() {\\n      CFG.open = true; CFG.idx = 0; CFG.confirm = null; CFG.help = false;\\n      SFX.shop();\\n    }\\n    function cfgClose() { CFG.open = false; CFG.confirm = null; CFG.help = false;\\n      _cfgClosedFrame = _frameNo;   /* ESCFIX_v1：同一帧别再被下面的 Esc 分支打开 */ }\\n\\n    function updateConfig(dt) {\\n      var inp = game.input;\\n      if (!CFG.open) return;\\n      if (CFG.help) {\\n        if (inp.justPressed('Escape') || inp.justPressed('space') || inp.justPressed('Enter') || inp.pointer.justDown) CFG.help = false;\\n        return;\\n      }\\n      if (CFG.confirm) {\\n        if (inp.justPressed('Escape') || inp.justPressed('KeyN')) { CFG.confirm = null; SFX.step(); return; }\\n        if (inp.justPressed('space') || inp.justPressed('Enter') || inp.justPressed('KeyY')) {\\n          var what = CFG.confirm; CFG.confirm = null; cfgClose();\\n          if (what === 'title') { backToTitle(); }   /* TITLEFIX_v1 */\\n          else { restart(); }\\n          SFX.shop();\\n        }\\n        return;\\n      }\\n      if (inp.justPressed('Escape')) { cfgClose(); return; }\\n      if (inp.justPressed('up') || inp.justPressed('KeyW')) { CFG.idx = (CFG.idx - 1 + CFG_ITEMS.length) % CFG_ITEMS.length; SFX.step(); }\\n      if (inp.justPressed('down') || inp.justPressed('KeyS')) { CFG.idx = (CFG.idx + 1) % CFG_ITEMS.length; SFX.step(); }\\n      var it = CFG_ITEMS[CFG.idx];\\n      if (it.kind === 'toggle') {\\n        if (inp.justPressed('left') || inp.justPressed('KeyA') || inp.justPressed('right') || inp.justPressed('KeyD')) {\\n          CFG.sfx = !CFG.sfx; cfgSave(); SFX.step();\\n        }\\n      } else if (it.kind === 'range') {\\n        if (inp.justPressed('left') || inp.justPressed('KeyA')) {\\n          CFG.vol = CFG_VOLS[Math.max(0, cfgVolIdx() - 1)]; cfgSave(); SFX.step();\\n        }\\n        if (inp.justPressed('right') || inp.justPressed('KeyD')) {\\n          CFG.vol = CFG_VOLS[Math.min(CFG_VOLS.length - 1, cfgVolIdx() + 1)]; cfgSave(); SFX.step();\\n        }\\n      }\\n      if (inp.justPressed('space') || inp.justPressed('Enter')) cfgActivate(it);\\n    }\\n    function cfgActivate(it) {\\n      if (!it) return;\\n      if (it.id === 'resume') { cfgClose(); return; }\\n      if (it.id === 'sfx') { CFG.sfx = !CFG.sfx; cfgSave(); SFX.step(); BGM.sync(); return; }\\n      if (it.id === 'bgm') { CFG.bgm = !CFG.bgm; cfgSave(); SFX.step(); BGM.sync(); return; }\\n      if (it.id === 'vol') { CFG.vol = CFG_VOLS[(cfgVolIdx() + 1) % CFG_VOLS.length]; cfgSave(); SFX.step(); return; }\\n      if (it.id === 'help') { CFG.help = true; SFX.shop(); return; }\\n      if (it.id === 'save') { cfgClose(); saveGame(); return; }\\n      if (it.id === 'load') { if (!hasSave()) { SFX.trap(); return; } cfgClose(); loadGame(); return; }\\n      if (it.id === 'title') { CFG.confirm = 'title'; SFX.trap(); return; }\\n      if (it.id === 'restart') { CFG.confirm = 'restart'; SFX.trap(); return; }\\n    }\\n\\n    /* 触控：点哪一行就选哪一行（第二下生效） */\\n    function cfgPointer(dt) {\\n      var inp = game.input;\\n      if (!CFG.open || CFG.help || CFG.confirm) return;\\n      if (!inp.pointer.justDown) return;\\n      var px = inp.pointer.x, py = inp.pointer.y;\\n      var g = CFG_LAY();\\n      for (var i = 0; i < CFG_ITEMS.length; i++) {\\n        var ry = g.y + g.TITLE_H + i * g.ROW;\\n        if (py >= ry && py <= ry + g.ROW && px >= g.x && px <= g.x + g.w) {\\n          if (CFG.idx === i) cfgActivate(CFG_ITEMS[i]);\\n          else { CFG.idx = i; SFX.step(); }\\n          return;\\n        }\\n      }\\n    }\\n\\n    /* 布局常量集中一处：绘制与命中检测共用，改一个数两边一起变 */\\n    function CFG_LAY() {\\n      var w = 300, ROW = 30, TITLE_H = 34, FOOT_H = 42;\\n      var h = TITLE_H + CFG_ITEMS.length * ROW + FOOT_H, y = 84;\\n      /* PCMODE_v1：横屏只有 360 高，9 行 × 30 + 76 = 346，从 y=84 起会掉出屏幕下沿。\\n         塞不下就把行距压到 20~28 并整块居中；竖屏（640 高）走不到这一支。 */\\n      if (h + 24 > CH) {\\n        ROW = Math.max(20, Math.floor((CH - 24 - TITLE_H - FOOT_H) / CFG_ITEMS.length));\\n        h = TITLE_H + CFG_ITEMS.length * ROW + FOOT_H;\\n        y = Math.max(10, Math.round((CH - h) / 2));\\n      }\\n      return {\\n        w: w, ROW: ROW, TITLE_H: TITLE_H, FOOT_H: FOOT_H,\\n        h: h, x: CW / 2 - w / 2, y: y\\n      };\\n    }\\n\\n    /* ================= 硬件键皮肤（HWUI_v1） ================= */\\n    /* 配色直接取用户手绘按键的调色板：黑描边 / 紫面 / 左上亮 右下暗 / 灰键面 */\\n    var HW = {\\n      ink: '#000000', face: '#473C5A', lt: '#6A5D81', dk: '#30293C',\\n      plate: '#A5A5A5', plateLt: '#C1C1C1', plateDk: '#656565',\\n      well: '#16121E', wellTop: '#0B0910',\\n      text: '#C1C1C1', textDim: '#7E7694', textOnPlate: '#16121E'\\n    };\\n\\n    /* 一根实体键：黑框 + 面 + 左上亮边 / 右下暗边（b = 倒角宽度） */\\n    function hwKey(ctx, x, y, w, h, face, lt, dk, b) {\\n      b = b || 3;\\n      ctx.fillStyle = HW.ink; ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = face; ctx.fillRect(x + 1, y + 1, w - 2, h - 2);\\n      ctx.fillStyle = lt;\\n      ctx.fillRect(x + 1, y + 1, w - 2, b);\\n      ctx.fillRect(x + 1, y + 1, b, h - 2);\\n      ctx.fillStyle = dk;\\n      ctx.fillRect(x + 1, y + h - 1 - b, w - 2, b);\\n      ctx.fillRect(x + w - 1 - b, y + 1, b, h - 2);\\n    }\\n\\n    /* 面板：外壳倒角 + 内凹槽（凹槽上沿压一条深线，看着像真的挖进去） */\\n    function hwPanel(ctx, x, y, w, h) {\\n      ctx.fillStyle = HW.ink; ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = HW.face; ctx.fillRect(x + 2, y + 2, w - 4, h - 4);\\n      ctx.fillStyle = HW.lt;\\n      ctx.fillRect(x + 2, y + 2, w - 4, 3);\\n      ctx.fillRect(x + 2, y + 2, 3, h - 4);\\n      ctx.fillStyle = HW.dk;\\n      ctx.fillRect(x + 2, y + h - 5, w - 4, 3);\\n      ctx.fillRect(x + w - 5, y + 2, 3, h - 4);\\n      var ix = x + 8, iy = y + 8, iw = w - 16, ih = h - 16;\\n      ctx.fillStyle = HW.ink; ctx.fillRect(ix, iy, iw, ih);\\n      ctx.fillStyle = HW.well; ctx.fillRect(ix + 1, iy + 1, iw - 2, ih - 2);\\n      ctx.fillStyle = HW.wellTop; ctx.fillRect(ix + 1, iy + 1, iw - 2, 2);\\n    }\\n\\n    /* 行键：未选 = 紫面凸起；选中 = 换成灰键面（按下去、点亮的那一颗） */\\n    function hwRow(ctx, x, y, w, h, sel) {\\n      if (sel) hwKey(ctx, x, y, w, h, HW.plate, HW.plateLt, HW.plateDk, 3);\\n      else hwKey(ctx, x, y, w, h, HW.face, HW.lt, HW.dk, 3);\\n    }\\n\\n    function drawConfig(ctx) {\\n      if (!CFG.open) return;\\n      var g = CFG_LAY();\\n      var PADX = 22;\\n      /* 全屏压暗 */\\n      ctx.fillStyle = 'rgba(2,3,8,.86)'; ctx.fillRect(0, 0, CW, CH);\\n\\n      if (CFG.help) { drawCfgHelp(ctx); return; }\\n\\n      /* 外壳：紫框 + 倒角 + 内凹槽 */\\n      hwPanel(ctx, g.x, g.y, g.w, g.h);\\n      var WX = g.x + 10, WW = g.w - 20;\\n\\n      ctx.textBaseline = 'middle';\\n      /* 标题行 */\\n      ctx.textAlign = 'left';\\n      ctx.fillStyle = HW.plateLt; ctx.font = 'bold 14px monospace';\\n      ctx.fillText('设  置', g.x + PADX, g.y + g.TITLE_H / 2 + 2);\\n      ctx.fillStyle = HW.dk;\\n      ctx.fillRect(WX, g.y + g.TITLE_H + 1, WW, 2);\\n\\n      /* 行键 */\\n      for (var i = 0; i < CFG_ITEMS.length; i++) {\\n        var it = CFG_ITEMS[i], sel = i === CFG.idx;\\n        var ry = g.y + g.TITLE_H + i * g.ROW;\\n        hwRow(ctx, WX, ry + 2, WW, g.ROW - 5, sel);\\n\\n        ctx.textAlign = 'left';\\n        ctx.fillStyle = sel ? HW.textOnPlate : HW.text;\\n        ctx.font = 'bold 12px monospace';\\n        ctx.fillText(it.name, WX + 10, ry + g.ROW / 2);\\n\\n        /* 右侧当前值 */\\n        ctx.textAlign = 'right';\\n        var vx = WX + WW - 8;\\n        if (it.kind === 'toggle') {\\n          var on = (it.id === 'bgm') ? !!CFG.bgm : !!CFG.sfx;\\n          var tw2 = 40, th2 = 18, tx2 = vx - tw2, ty2 = ry + (g.ROW - th2) / 2;\\n          if (on) hwKey(ctx, tx2, ty2, tw2, th2, HW.plate, HW.plateLt, HW.plateDk, 2);\\n          else hwKey(ctx, tx2, ty2, tw2, th2, HW.dk, '#3E3450', '#241E2E', 2);\\n          ctx.fillStyle = on ? HW.textOnPlate : '#8F86A6';\\n          ctx.font = 'bold 10px monospace';\\n          ctx.fillText(on ? 'ON' : 'OFF', vx - tw2 / 2, ty2 + th2 / 2 + 1);\\n        } else if (it.kind === 'range') {\\n          var idx = cfgVolIdx(), n = CFG_VOLS.length;\\n          var segW = 8, segG = 2, barW2 = n * (segW + segG) - segG, bx = vx - barW2;\\n          for (var s2 = 0; s2 < n; s2++) {\\n            var onSeg = s2 < idx;\\n            hwKey(ctx, bx + s2 * (segW + segG), ry + (g.ROW - 14) / 2, segW, 14,\\n              onSeg ? HW.plate : HW.dk, onSeg ? HW.plateLt : '#3E3450',\\n              onSeg ? HW.plateDk : '#241E2E', 2);\\n          }\\n          ctx.fillStyle = sel ? HW.textOnPlate : HW.text;\\n          ctx.font = 'bold 10px monospace';\\n          /* PCMODE_v1：数值放到音量格左边 —— 原来两者都右对齐到 vx，字压在格子上 */\\n          ctx.fillText(cfgVolLabel(), bx - 8, ry + g.ROW / 2);\\n        } else {\\n          ctx.fillStyle = sel ? HW.textOnPlate : HW.textDim;\\n          ctx.font = '10px monospace';\\n          ctx.fillText(it.hint || '', vx, ry + g.ROW / 2);\\n        }\\n      }\\n\\n      /* 底部提示 */\\n      ctx.textAlign = 'center';\\n      ctx.fillStyle = HW.textDim; ctx.font = '10px monospace';\\n      ctx.fillText('↑↓ 选择 · ←→ 调节 · 空格 确认 · ESC 返回', g.x + g.w / 2, g.y + g.h - 20);\\n\\n      /* 二次确认：同一套外壳，只是标题换成警示色 */\\n      if (CFG.confirm) {\\n        var tw = 280, th = 112, tx = CW / 2 - tw / 2, ty = CW / 2 - th / 2 + 60;\\n        hwPanel(ctx, tx, ty, tw, th);\\n        ctx.textAlign = 'center';\\n        ctx.fillStyle = '#FF9A9A'; ctx.font = 'bold 12px monospace';\\n        ctx.fillText(CFG.confirm === 'title' ? '返回标题页？' : '重新开始？', CW / 2, ty + 34);\\n        ctx.fillStyle = HW.text; ctx.font = '10px monospace';\\n        ctx.fillText(CFG.confirm === 'title' ? '当前进度不会自动保存。' : '会丢掉当前这一局的进度。', CW / 2, ty + 54);\\n        hwKey(ctx, CW / 2 - 96, ty + 68, 86, 20, HW.plate, HW.plateLt, HW.plateDk, 2);\\n        hwKey(ctx, CW / 2 + 10, ty + 68, 86, 20, HW.face, HW.lt, HW.dk, 2);\\n        ctx.fillStyle = HW.textOnPlate; ctx.font = 'bold 10px monospace';\\n        ctx.fillText('Y / 空格 确认', CW / 2 - 53, ty + 79);\\n        ctx.fillStyle = HW.text; ctx.font = 'bold 10px monospace';\\n        ctx.fillText('N / ESC 取消', CW / 2 + 53, ty + 79);\\n      }\\n      ctx.textAlign = 'left';\\n      ctx.textBaseline = 'alphabetic';\\n    }\\n\\n    /* 操作说明子页 */\\n    /* 说明文字一律控制在 20 个字以内 —— 画布只有 360px 宽，\\n       值列从 x+98 起排，20 个全角字 ≈ 200px，右边还剩 36px 安全边距。\\n       （上一版最长那句 20 字被右边缘裁掉了，截图上能直接看到。） */\\n    /* HELPTEXT_v1：全部逐条对过代码再写，别再出现「等一回合 / 回合制 / 12 层」 */\\n    var CFG_HELP = [\\n      ['方向键 / WASD', '移动；撞到怪就是攻击'],\\n      ['Q / E', '切换武器'],\\n      ['1 - 6', '释放技能（Shift + 数字 直选武器）'],\\n      ['B', '打开背包（服饰页可穿 / 脱）'],\\n      ['K / L', '快速存档 / 读档'],\\n      ['空格 / 回车', '推进对话 · 确认'],\\n      ['ESC', '打开这个设置面板'],\\n      ['F', '全屏 / 退出全屏（电脑端）'],\\n      ['点击地板', '自动朝那一步走'],\\n      ['', ''],\\n      ['符文门', '踩亮本段全部符文才会消失'],\\n      ['木梯', '踩上去下一段；3 章共 18 段']\\n    ];\\n    function drawCfgHelp(ctx) {\\n      ctx.fillStyle = '#04060c'; ctx.fillRect(0, 0, CW, CH);\\n      var g = { x: 26, y: 112, w: CW - 52 };\\n      ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 15px monospace';\\n      ctx.textAlign = 'center';\\n      ctx.fillText('操 作 说 明', CW / 2, g.y - 22);\\n      ctx.textAlign = 'left';\\n      var y = g.y + 8;\\n      /* HELPTEXT_v1：行距写死 22px，横屏 360 高会算到 362 掉出屏幕。\\n         塞不下就压到 16~21px；竖屏（640 高）走不到这一支，手机版面不变。 */\\n      var _rowH = 22;\\n      if (g.y + 8 + CFG_HELP.length * _rowH + 34 > CH) {\\n        _rowH = Math.max(16, Math.floor((CH - g.y - 42) / CFG_HELP.length));\\n      }\\n      for (var i = 0; i < CFG_HELP.length; i++) {\\n        var k = CFG_HELP[i][0], v = CFG_HELP[i][1];\\n        if (!k && !v) { y += Math.max(4, Math.round(_rowH * 0.36)); continue; }\\n        ctx.fillStyle = '#ffd93d'; ctx.font = 'bold 10px monospace';\\n        ctx.fillText(k, g.x + 2, y);\\n        ctx.fillStyle = '#dbe6f5'; ctx.font = '10px monospace';\\n        ctx.fillText(v, g.x + 98, y);\\n        y += _rowH;\\n      }\\n      /* HELPY_v1：把这次排版的实际行距 / 末行 y / 画布高报给验收（横屏 360 有没有溢出） */\\n      if (typeof window !== 'undefined') { window.__HELPY = { rowH: _rowH, lastY: Math.round(y), ch: CH }; }\\n      ctx.fillStyle = 'rgba(255,255,255,' + (0.35 + 0.35 * Math.sin(animClock * 4)) + ')';\\n      ctx.font = 'bold 11px monospace'; ctx.textAlign = 'center';\\n      ctx.fillText('空格 / ESC 返回', CW / 2, y + 22);\\n      ctx.textAlign = 'left';\\n    }\\n\\n    /* ==================================================================\\n       v8.0 · 手机 UI 层（DOM 覆盖）\\n\\n       为什么要有这一层：canvas 里的面板全部只认键盘\\n         · 商店：Digit1..N 购买、Digit0 / Esc 离开  → 手机上打开后买不了、也关不掉\\n         · 设置：只有 Esc 能打开                   → 手机上根本没有入口\\n         · 遗物/事件：方向键 + 回车                 → 手机上点不动\\n         · 标题页：点哪儿都只是\\\"确认当前项\\\"，选不了第二项\\n       所以这里铺一层真 DOM：真按钮、真命中区、真关闭键，视觉也用 CSS 做得像样些。\\n\\n       原则：DOM 只负责「显示 + 点」，所有状态仍写回游戏自己的变量\\n       （titleOpen / CFG / shopOpen / shrineOpen / Choice / over），\\n       键盘、存档、测试钩子一行都不用改。\\n       ================================================================== */\\n\\n    var MOBILE = (function () {\\n      var doc = (typeof document !== 'undefined') ? document : null;\\n      /* PCMODE_v1：PC 横屏版只关触屏控件，DOM 面板（背包/菜单/设置/三选一）照用 */\\n      var PCUI = !!(typeof window !== 'undefined' && window.__PCMODE);\\n      var ON = !!doc;\\n      var R = null;        /* 面板根（全屏） */\\n      /* OKKEY_v1 */\\n      var C = null;        /* 操作控件根 */\\n      var builtW = -1, builtH = -1;   /* 建控件时的 uiLayer 宽高，变了就重建 */   /* RESIZE_v1 */\\n      var sig = '';        /* 当前面板签名，没变就不重建 DOM */\\n      var held = {};       /* D-pad 当前按下的方向 */\\n      var skBtns = [];     /* 技能键 DOM，按帧刷状态 */\\n\\n      var DIRS = { up: 'ArrowUp', down: 'ArrowDown', left: 'ArrowLeft', right: 'ArrowRight' };\\n      var DPAPI = null;   /* DPAD_v10：十字键的观测入口，buildControls 里填 */\\n\\n      /* ---------------- 技能键美术表（用户手绘，16x16 原生像素） ----------------\\n         key = SKILLS[i].id。值是 url(\\\"data:image/png;base64,...\\\")。\\n         单文件游戏不能引外部图，只能内嵌；16x16 放大靠 image-rendering:pixelated 保硬边。\\n         血月斩：黑框石板 + 斜向刀光 + 血点（用户自绘）\\n         其余 5 个技能还没画 —— 有图就按同样格式加一行。 ---------------------- */\\n      var SKILL_ART = {\\n        bloodmoon: 'url(\\\"data:image/webp;base64,UklGRngAAABXRUJQVlA4TGsAAAAvD8ADEPU4aBtJ - 样式 ----------------\\n         v9.5：整套面板换成用户手绘样图的风格（样图 = 粗黑外框 + 纯紫平涂 + 黑框条 + 方角）。\\n         从样图量出来的东西（别凭感觉改）：\\n           填充 #6F3CDB / 描边 #000000 / 外框 = 2 个单位 / 条框 = 1 个单位\\n           单位 u = 样图 34px；按面板宽 1099px 折算是 3.1%\\n         360 宽的画布上取 u=4：外框 8px、条框 4px —— 再粗就吃掉正文了。\\n         硬规矩：不许出现渐变、圆角、阴影、毛玻璃。整个卡片只有两个颜色加白色文字。 */\\n      function installCSS() {\\n        if (!ON || doc.getElementById('__m_css')) return;\\n        var st = doc.createElement('style');\\n        st.id = '__m_css';\\n        st.textContent = [\\n          '.mroot{position:absolute;left:0;top:0;right:0;bottom:0;z-index:60;pointer-events:none;',\\n          \\\"font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;\\\",\\n          '-webkit-tap-highlight-color:transparent;}',\\n          /* 遮罩：纯黑，不用径向渐变 */\\n          '.mback{position:absolute;left:0;top:0;right:0;bottom:0;pointer-events:auto;display:flex;',\\n          'align-items:center;justify-content:center;padding:14px;box-sizing:border-box;overflow:hidden;',\\n          'background:rgba(0,0,0,.90);}',\\n          '.mback:before{display:none;}',\\n          /* 卡片：8px 黑外框 + 紫底，方角、无阴影、无动画 */\\n          '.mcard{position:relative;width:100%;max-width:334px;max-height:calc(100vh - 28px);overflow-y:auto;-webkit-overflow-scrolling:touch;',\\n          'background:#6F3CDB;border:8px solid #000;border-radius:0;padding:14px 13px 13px;box-sizing:border-box;',\\n          'box-shadow:none;animation:none;}',\\n          '.mcard:before{display:none;}',\\n          '.mcard::-webkit-scrollbar{width:6px;}',\\n          '.mcard::-webkit-scrollbar-thumb{background:#000;}',\\n          /* hero：主菜单 */\\n          '.mcard.hero{padding:20px 14px 16px;max-width:322px;}',\\n          '.mcard.hero .mtitle{font-size:26px;letter-spacing:8px;margin:0 0 10px;',\\n          'background:none;-webkit-background-clip:initial;background-clip:initial;',\\n          'color:#fff;filter:none;text-shadow:3px 3px 0 #000;}',\\n          '.mcard.hero .msub{margin-bottom:16px;letter-spacing:.4px;}',\\n          '.mcard.hero .mitem{min-height:52px;}',\\n          /* 分组标题：白字 + 2px 硬黑阴影（紫底上比纯黑字清楚，又不抢条目） */\\n          '.msec{font-size:10.5px;font-weight:900;letter-spacing:2.6px;color:#fff;margin:12px 3px 6px;',\\n          'text-shadow:1px 1px 0 #000;}',\\n          '.msec:first-of-type{margin-top:2px;}',\\n          '.mtitle{font-size:19px;font-weight:900;letter-spacing:4px;color:#fff;margin:0 0 6px;text-align:center;',\\n          'text-shadow:2px 2px 0 #000;}',\\n          '.msub{font-size:11.5px;color:#e2d5ff;margin:0 0 13px;line-height:1.6;text-align:center;font-weight:700;}',\\n          '.msub b{color:#fff;}',\\n          '.msep{height:4px;background:#000;margin:11px 0;border-radius:0;}',\\n          /* 菜单条：紫底 + 4px 黑框（跟样图那两根条一模一样），按下反白成黑底 */\\n          '.mitem{display:flex;align-items:center;gap:11px;min-height:48px;padding:8px 11px;margin-bottom:8px;',\\n          'box-sizing:border-box;border-radius:0;background:#6F3CDB;border:4px solid #000;',\\n          'color:#fff;font-size:14.5px;font-weight:800;pointer-events:auto;transition:none;}',\\n          '.mitem:active{transform:none;background:#000;color:#fff;}',\\n          '.mitem.dim{color:#b49ae8;background:#4E2A97;}',\\n          /* 纯信息行（不能点、也没 act）：去掉框，否则会被当成按钮去点。\\n             死亡界面的「你倒在了第 N 层」、操作说明的每一条都走这里。 */\\n          '.mitem.info{background:transparent;border-color:transparent;color:#E2D5FF;padding-left:4px;}',\\n          '.mitem.info .tip{color:#CDB6FF;}',\\n          '.mitem.info .g{background:#000;}',\\n          '.mitem .g{width:26px;height:26px;flex:0 0 26px;border-radius:0;display:flex;align-items:center;',\\n          'justify-content:center;font-size:13px;background:#000;color:#fff;font-weight:900;}',\\n          '.mitem .tx{flex:1;min-width:0;}',\\n          '.mitem .tip{display:block;font-size:11px;font-weight:600;color:#d3c0ff;margin-top:3px;}',\\n          '.mitem .r{margin-left:auto;font-size:12.5px;font-weight:900;color:#fff;white-space:nowrap;}',\\n          '.mitem .r.chip{margin-left:auto;padding:3px 8px;border-radius:0;font-size:11.5px;letter-spacing:.3px;',\\n          'background:#000;border:none;color:#fff;}',\\n          /* 开关：方形，纯黑白滑块 */\\n          '.mitem .sw{margin-left:auto;flex:0 0 44px;width:44px;height:24px;border-radius:0;position:relative;',\\n          'background:#4E2A97;border:3px solid #000;transition:none;}',\\n          '.mitem .sw:after{content:\\\"\\\";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:0;',\\n          'background:#fff;box-shadow:none;transition:none;}',\\n          '.mitem .sw.on{background:#fff;}',\\n          '.mitem .sw.on:after{transform:translateX(20px);background:#000;}',\\n          /* 主要动作：整条反白成黑底白字 */\\n          '.mitem.primary{background:#000;color:#fff;}',\\n          '.mitem.primary .g{background:#6F3CDB;color:#fff;}',\\n          /* 危险动作：黑底红字（唯一破格的颜色，安全语义需要） */\\n          '.mitem.danger{background:#000;color:#ff8f8f;}',\\n          '.mitem.danger .g{background:#000;color:#ff8f8f;}',\\n          /* 关闭键：方角、黑框、紫底 */\\n          /* ---- 背包面板（BAGSKIN_v1）参考图：黑框 + 灰面板 + 内嵌硬亮边 ----\\n             量色：外框#000 / 面板#8b8b8b / 条面#a2a2a2 / 亮边#d2d2d2 / 暗边#6b6b6b\\n             立体感只靠 inset 硬阴影（0 模糊），禁圆角禁渐变 */\\n          '.mcard.bag{max-width:min(360px,calc(100vw - 28px));width:100%;background:#8b8b8b;',\\n          'border:8px solid #000;border-radius:0;padding:10px;box-sizing:border-box;',\\n          'box-shadow:none;animation:none;}',\\n          /* 标题条：横贯 + 自带黑框 + 内圈亮边 */\\n          '.mcard.bag .mtitle{display:flex;align-items:center;justify-content:center;margin:0 0 8px;',\\n          'height:40px;background:#a2a2a2;border:4px solid #000;border-radius:0;box-sizing:border-box;',\\n          'box-shadow:inset 3px 3px 0 #d2d2d2,inset -3px -3px 0 #6b6b6b;',\\n          'color:#111;font-size:16px;font-weight:900;letter-spacing:7px;text-shadow:none;}',\\n          /* 内容区：一个大黑框把 页签 / 网格 / 说明 全框住 */\\n          '.mbagbody{border:4px solid #000;background:#8b8b8b;padding:9px;box-sizing:border-box;}',\\n          /* 页签行：两宽 + 一窄 */\\n          '.mbagtabs{display:flex;gap:8px;margin:0 0 9px;}',\\n          '.mcard.bag .mbagtab{flex:1 1 0;min-width:0;height:40px;display:flex;align-items:center;',\\n          'justify-content:center;margin:0;box-sizing:border-box;border-radius:0;',\\n          'background:#a2a2a2;border:4px solid #000;',\\n          'box-shadow:inset 3px 3px 0 #d2d2d2,inset -3px -3px 0 #6b6b6b;',\\n          'color:#2b2b2b;font-size:12.5px;font-weight:900;letter-spacing:2px;}',\\n          '.mcard.bag .mbagtab.on{background:#3f3f3f;color:#fff;',\\n          'box-shadow:inset 3px 3px 0 #1a1a1a,inset -3px -3px 0 #7a7a7a;}',\\n          /* ✕：页签行最右那个小方块，不参与 flex-grow */\\n          '.mcard.bag .mbagx{flex:0 0 40px;width:40px;height:40px;display:flex;align-items:center;',\\n          'justify-content:center;box-sizing:border-box;border-radius:0;',\\n          'background:#a2a2a2;border:4px solid #000;',\\n          'box-shadow:inset 3px 3px 0 #d2d2d2,inset -3px -3px 0 #6b6b6b;',\\n          'color:#111;font-size:14px;font-weight:900;line-height:1;}',\\n          '.mcard.bag .mbagx:active{background:#000;color:#fff;',\\n          'box-shadow:inset 3px 3px 0 #000,inset -3px -3px 0 #000;}',\\n          /* 物品格：黑框 + 灰底 + 左上亮边 + 右下暗边。格距 6px（320 宽下仍有 41px/格） */\\n          '.mbaggrid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:0 0 9px;}',\\n          /* 服饰 16 件，5x3=15 格装不下 → 服饰页单独走 4x4 */\\n          '.mbaggrid.g4{grid-template-columns:repeat(4,1fr);gap:5px;}',\\n          '.mbaggrid.g4 .mbagcell{max-height:62px;}',\\n          '.mcard.bag .mbagcell{position:relative;aspect-ratio:1/1;display:flex;align-items:center;',\\n          'justify-content:center;overflow:hidden;box-sizing:border-box;border-radius:0;',\\n          'background:#8b8b8b;border:3px solid #000;',\\n          'box-shadow:inset 3px 3px 0 #b6b6b6,inset -3px -3px 0 #6b6b6b;}',\\n          '.mcard.bag .mbagcell.on{background:#f2f2f2;border-color:#000;',\\n          'box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #bdbdbd;}',\\n          '.mbagcell em{width:78%;height:78%;display:flex;align-items:center;justify-content:center;}',\\n          '.mbagcell canvas{width:100%;height:100%;image-rendering:pixelated;',\\n          'image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor;}',\\n          '.mbagcell .nb{position:absolute;right:0;bottom:0;font-size:10.5px;font-weight:900;',\\n          'color:#fff;background:#000;padding:0 4px;text-shadow:none;}',\\n          '.mbagcell .eq{position:absolute;left:0;top:0;font-size:9.5px;font-weight:900;',\\n          'color:#fff;background:#000;padding:1px 4px;text-shadow:none;}',\\n          /* 说明区：3 条同规格灰条（对应参考图底部那 3 根），容器本身不画框 */\\n          '.mcard.bag .mbaginfo{display:flex;flex-direction:column;gap:6px;',\\n          'background:transparent;border:0;padding:0;min-height:0;box-sizing:border-box;}',\\n          '.mcard.bag .mbaginfo .mn,.mcard.bag .mbaginfo .md,.mcard.bag .mbaginfo .me{',\\n          'background:#a2a2a2;border:3px solid #000;border-radius:0;box-sizing:border-box;padding:6px 9px;',\\n          'box-shadow:inset 3px 3px 0 #cbcbcb,inset -3px -3px 0 #747474;}',\\n          '.mcard.bag .mbaginfo .mn{font-size:14px;font-weight:900;color:#0d0d0d;',\\n          'line-height:1.35;text-shadow:none;}',\\n          '.mcard.bag .mbaginfo .md{font-size:11.5px;font-weight:600;color:#262626;',\\n          'line-height:1.6;margin:0;}',\\n          '.mcard.bag .mbaginfo .me{font-size:12px;font-weight:900;color:#123a1c;margin:0;}',\\n          '.mcard.bag .mbaginfo .mempty{background:#a2a2a2;border:3px solid #000;padding:10px 9px;',\\n          'font-size:12px;color:#3a3a3a;font-weight:700;',\\n          'box-shadow:inset 3px 3px 0 #cbcbcb,inset -3px -3px 0 #747474;}',\\n          /* 动作条：黑底白字（唯一反色的一条），不可用时退回灰面 */\\n          '.mcard.bag .mbagact{margin:2px 0 0;height:40px;display:flex;align-items:center;',\\n          'justify-content:center;background:#000;border:3px solid #000;border-radius:0;',\\n          'box-sizing:border-box;color:#fff;font-size:14px;font-weight:900;letter-spacing:3px;',\\n          'box-shadow:inset 3px 3px 0 #4a4a4a,inset -3px -3px 0 #000;}',\\n          '.mcard.bag .mbagact:active{background:#2c2c2c;}',\\n          '.mcard.bag .mbagact.off{background:#7b7b7b;color:#3d3d3d;',\\n          'box-shadow:inset 3px 3px 0 #969696,inset -3px -3px 0 #5a5a5a;}',\\n          '.mcard.bag::-webkit-scrollbar-thumb{background:#000;}',\\n          '.mclose{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:0;',\\n          'background:#6F3CDB;border:4px solid #000;color:#fff;',\\n          'font-size:15px;font-weight:900;display:flex;align-items:center;justify-content:center;pointer-events:auto;}',\\n          '.mclose:active{background:#000;}',\\n          '.mbadge{display:inline-block;padding:2px 7px;border-radius:0;font-size:11px;font-weight:900;',\\n          'background:#000;color:#fff;margin-left:6px;}',\\n          /* ---- 操作控件：全部去渐变/圆角/阴影。\\n                 方向键换成用户手绘的十字五键（黑框 + 灰键面 + 白色像素箭头，\\n                 中间那格是「等」的青色徽章），不再用圆盘摇杆。 DPAD_v10 ---- */\\n          '.mctl{position:absolute;left:0;top:0;right:0;bottom:0;z-index:50;pointer-events:none;}',\\n          /* ROTATE_v1：画布太窄时的竖屏提示。z-index 压在控件层(50)上面，\\n             pointer-events:auto —— 顺便吃掉误触。 */\\n          '.mrot{position:fixed;left:0;top:0;right:0;bottom:0;z-index:70;display:none;',\\n          'align-items:center;justify-content:center;flex-direction:column;',\\n          'background:#07070C;color:#fff;pointer-events:auto;',\\n          '-webkit-user-select:none;user-select:none;font-family:inherit;}',\\n          '.mrot .i{font-size:44px;line-height:1;margin-bottom:16px;}',\\n          '.mrot .t{font-size:21px;font-weight:900;letter-spacing:3px;}',\\n          '.mrot .s{margin-top:10px;font-size:12px;font-weight:600;opacity:.5;}',\\n          /* OKK
