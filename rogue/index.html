 it = list[idx];\\n            if (it) {\\n              var wrap = doc.createElement('em');\\n              var cv = doc.createElement('canvas');\\n              cv.width = cv.height = 96;\\n              wrap.appendChild(cv);\\n              cell.appendChild(wrap);\\n              bagIcon(cv, it);\\n              if (it.n > 1) { var nb = div('nb'); txt(nb, '×' + it.n); cell.appendChild(nb); }\\n              if (it.cur) { var eq = div('eq'); txt(eq, '装上'); cell.appendChild(eq); }\\n              else if (it.on) { var eq2 = div('eq'); txt(eq2, '穿着'); cell.appendChild(eq2); }\\n              cell.addEventListener('pointerdown', function (e) {\\n                e.preventDefault();\\n                BAG.sel = idx; paintBag();\\n              });\\n            }\\n            grid.appendChild(cell);\\n          })(ci);\\n        }\\n        body.appendChild(grid);\\n\\n        /* ---- 详情 ---- */\\n        var sel = list[BAG.sel];\\n        var info = div('mbaginfo');\\n        if (sel) {\\n          var nm = div('mn'); txt(nm, sel.name + (sel.n > 1 ? '  ×' + sel.n : ''));\\n          info.appendChild(nm);\\n          var ds = div('md'); txt(ds, sel.desc); info.appendChild(ds);\\n          var ef = div('me'); txt(ef, sel.line); info.appendChild(ef);\\n\\n          /* 两步操作：先选中，再按这里 —— 用户明确要「选中后按食用」，\\n             点了格子就吃太容易误触（一格 52px，拇指滑一下就没了）。 */\\n          var can = false, label = '', fn = null;\\n          if (sel.kind === 'food') {\\n            var _d = foodById(sel.id) || {};\\n            if (_d.cleanse) {\\n              can = (p.poison || 0) > 0;\\n              label = can ? '饮 用' : '没有异常状态';\\n            } else if (_d.buff) {\\n              can = !(p.atkBuff && p.atkBuff.until > Date.now());\\n              label = can ? '饮 用' : '药效还在';\\n            } else if (_d.energy) {\\n              can = p.hp < p.maxHp || p.energy < p.maxEnergy;\\n              label = can ? '饮 用' : '体力已满';\\n            } else {\\n              can = p.hp < p.maxHp;\\n              label = can ? '食 用' : '体力已满';\\n            }\\n            fn = function () { eatFood(sel.i); paintBag(); };\\n          } else if (sel.kind === 'weapon') {\\n            can = sel.i !== p.cur;\\n            label = sel.cur ? '已 装 上' : '装 备';\\n            fn = function () {\\n              p.cur = sel.i; p.weapon = p.bag[sel.i];\\n              try { SFX.loot(); } catch (x2) { }\\n              paintBag();\\n            };\\n          } else if (sel.kind === 'cloth') {\\n            /* BAGCLOTH_v1：同槽互斥由 wearCloth 负责（换帽子不会顶掉披肩） */\\n            var _worn = ((p.outfit || {})[sel.slot] || '') === sel.cid;\\n            can = true;\\n            label = _worn ? '脱 下' : '穿 上';\\n            fn = function () {\\n              if (_worn) takeOffCloth(sel.slot); else wearCloth(sel.cid);\\n              try { SFX.loot(); } catch (x2) { }\\n              paintBag();\\n            };\\n          }\\n          var act = div('mbagact' + (can ? '' : ' off'));\\n          txt(act, label);\\n          if (can) {\\n            act.addEventListener('pointerdown', function (e) {\\n              e.preventDefault(); e.stopPropagation();\\n              try { fn(); } catch (x3) { }\\n            });\\n          }\\n          info.appendChild(act);\\n        } else {\\n          var em2 = div('mempty');\\n          txt(em2, BAG.tab === 'food' ? '背包里还没有食物。'\\n                   : (BAG.tab === 'cloth' ? '还没有捡到服饰。打碎木桶、开宝箱会掉。'\\n                                          : '还没有捡到武器。'));\\n          info.appendChild(em2);\\n        }\\n        body.appendChild(info);\\n        card.appendChild(body);\\n      }\\n\\n      function paint(s) {\\n        shell();\\n        var card = doc.getElementById('__m_card');\\n        while (card.firstChild) card.removeChild(card.firstChild);\\n\\n        if (s.close) {\\n          var x = div('mclose');\\n          txt(x, '✕');\\n          x.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); s.close(); });\\n          card.appendChild(x);\\n        }\\n        card.className = 'mcard' + (s.hero ? ' hero' : '');\\n        if (s.title) { var h = div('mtitle'); txt(h, s.title); card.appendChild(h); }\\n        if (s.sub) { var sb = div('msub'); sb.innerHTML = s.sub; card.appendChild(sb); }\\n        for (var i = 0; i < (s.items || []).length; i++) {\\n          var it = s.items[i];\\n          if (it && it.sec) { var sc = div('msec'); txt(sc, it.sec); card.appendChild(sc); continue; }\\n          card.appendChild(item(it));\\n        }\\n      }\\n\\n      /* ---------------- 状态 → 面板 ---------------- */\\n      function spec() {\\n        /* 1) 结束 / 通关 */\\n        if (over) {\\n          var its = [];\\n          /* v9.0 修：原来只看 won 判断「死没死」，而 victory() 打完第 1~3 章是\\n             over=true/won=false/chapPending=n —— 结果打完第一章 Boss 手机端弹的是\\n             「深渊吞没了你 · 体力耗尽 · 你倒在了第 12 层」，还给不了「进入下一章」。\\n             现在以 chapPending 为准：有下一章 = 通关。 */\\n          var _nx = (typeof chapPending === 'number' ? chapPending : 0);\\n          var _chapN = (chap && chap.id) ? chap.id : 1;\\n          var _bossName = (chap && chap.boss && chap.boss.name) ? chap.boss.name : (BOSS_NAME[floorNo] || '守护者');\\n          if (won) {\\n            its.push({ t: '你走到了深渊底部', tip: '这一局到此为止', dim: true });\\n          } else if (_nx > 0) {\\n            its.push({ t: '你击退了「' + _bossName + '」', tip: '第 ' + _chapN + ' 章 通关', dim: true });\\n          } else {\\n            its.push({ t: '你倒在了第 ' + floorNo + ' 层', tip: '体力耗尽', dim: true });\\n          }\\n          if (_nx > 0) {\\n            its.push({ t: '进入第 ' + _nx + ' 章', glyph: '▶', cls: 'primary', act: function () { enterChapter(chapPending); } });\\n          } else {\\n            its.push({ t: '再来一次', glyph: '↻', cls: 'primary', act: function () { restart(); storyOnEnter(1); } });\\n          }\\n          its.push({ t: '回到主菜单', glyph: '☰', act: goTitle });\\n          return { id: 'over', title: won ? '通 关' : (_nx > 0 ? ('第 ' + _chapN + ' 章 通 关') : '深 渊 吞 没 了 你'), sub: '', items: its };\\n        }\\n\\n        /* 2) 标题 / 主菜单 —— v9.4：已交还给 canvas 的 drawTitle()\\n           原来这里用卡片面板盖住了标题页（大标题 + 「新的深渊」按钮）。\\n           用户明确要回原来的样子 —— canvas 版那个大字带辉光的标题页更好看，\\n           所以这一支整个撤掉：spec() 不再接管标题，drawTitle() 直接露出来。\\n           注意：手机上走 updateTitle() 的 pointer.justDown 确认（点一下 = 选中的那项），\\n           「操作说明」仍在 ESC 设置面板里，不会丢。 */\\n\\n        /* 3) 设置 */\\n        if (CFG.open) {\\n          /* PCMODE_v1：电脑端不镜像设置卡片 —— canvas 那块 CFG 面板是键盘原生的，\\n             两套一起开会叠成两层（上层窄卡片 + 下层宽面板，下面几行还被裁掉）。 */\\n          if (PCUI) return null;\\n          if (CFG.help) {\\n            return { id: 'cfghelp', title: '操 作 说 明', sub: '', items: helpItems(), close: function () { CFG.help = false; } };\\n          }\\n          if (CFG.confirm) {\\n            var what = CFG.confirm;\\n            return {\\n              id: 'cfgconfirm', title: what === 'title' ? '返回标题页？' : '重新开始？',\\n              sub: what === 'title' ? '当前进度不会自动保存。' : '会丢掉这一局的进度。',\\n              items: [\\n                { t: '确定', glyph: '✓', cls: 'primary', act: function () { CFG.confirm = null; if (what === 'title') { goTitle(); } else { cfgClose(); restart(); storyOnEnter(1); } } },\\n                { t: '取消', glyph: '✕', act: function () { CFG.confirm = null; } }\\n              ]\\n            };\\n          }\\n          /* v9.1：分成「进度 / 声音 / 其它」三组，开关类做成真开关，\\n             数值类做成 chip。分组标题用 .msec（不是 .mitem，不参与点击与计数）。 */\\n          var ci = [];\\n          ci.push({ sec: '进 度' });\\n          ci.push({ t: '继续游戏', glyph: '▶', cls: 'primary', act: function () { cfgClose(); } });\\n          /* 换武器：键盘是 Q/E 和「换」按钮，手机上那个按钮被新控件取代了 ——\\n             没有这一条，捡到第二把武器也换不了。右侧实时显示当前武器名。 */\\n          ci.push({\\n            t: '切换武器', glyph: '⚔', chip: true,\\n            right: (function () { var w = curWeapon(); return w ? w.name : '赤手空拳'; })(),\\n            tip: '依次轮换背包里的武器',\\n            act: function () { cycleWeapon(1); sig = ''; }\\n          });\\n          ci.push({ t: '保存进度', glyph: '⤓', act: function () { cfgClose(); saveGame(); } });\\n          ci.push({ t: '读取存档', glyph: '⤒', dim: !hasSave(), act: function () { if (!hasSave()) return; cfgClose(); loadGame(); } });\\n          ci.push({ sec: '声 音' });\\n          ci.push({\\n            t: '音效', glyph: '♪', sw: CFG.sfx ? 'on' : 'off',\\n            act: function () { CFG.sfx = !CFG.sfx; cfgSave(); SFX.step(); BGM.sync(); }\\n          });\\n          ci.push({\\n            t: '背景音乐', glyph: '♬', sw: CFG.bgm ? 'on' : 'off',\\n            act: function () { CFG.bgm = !CFG.bgm; cfgSave(); SFX.step(); BGM.sync(); }\\n          });\\n          ci.push({\\n            t: '音量', glyph: '◐', chip: true, right: CFG_VOL_NAME[cfgVolIdx()],\\n            act: function () { CFG.vol = CFG_VOLS[(cfgVolIdx() + 1) % CFG_VOLS.length]; cfgSave(); SFX.step(); }\\n          });\\n          ci.push({ sec: '其 它' });\\n          ci.push({ t: '操作说明', glyph: '?', act: function () { CFG.help = true; } });\\n          ci.push({ t: '返回标题', glyph: '☰', act: function () { CFG.confirm = 'title'; } });\\n          ci.push({ t: '重新开始', glyph: '↻', cls: 'danger', act: function () { CFG.confirm = 'restart'; } });\\n          return { id: 'cfg', title: '设 置', sub: '', items: ci, close: function () { cfgClose(); } };\\n        }\\n\\n        /* 4) 商店 */\\n        if (shopOpen) {\\n          var si = [];\\n          for (var j = 0; j < shopStock.length; j++) {\\n            (function (idx) {\\n              var s2 = shopStock[idx];\\n              si.push({\\n                t: s2.name, glyph: '◆', right: '◆ ' + s2.cost,\\n                tip: s2.desc || '',\\n                dim: p.gems < s2.cost,\\n                act: function () { buyFromShop(idx); }\\n              });\\n            })(j);\\n          }\\n          si.push({ t: '离开', glyph: '✕', act: function () { shopOpen = false; log('你离开了商店。', '#9aa8bd'); } });\\n          return {\\n            id: 'shop', title: '流 浪 商 人',\\n            sub: '身上的宝石：<b style=\\\"color:#ffd76a\\\">◆ ' + p.gems + '</b>',\\n            items: si, close: function () { shopOpen = false; log('你离开了商店。', '#9aa8bd'); }\\n          };\\n        }\\n\\n        /* 5) 神龛 */\\n        if (shrineOpen) {\\n          var hi = [];\\n          for (var k2 = 0; k2 < (shrineChoices || []).length; k2++) {\\n            (function (idx) {\\n              var c2 = shrineChoices[idx];\\n              hi.push({\\n                t: (idx + 1) + '. ' + c2.name, glyph: '☩', tip: c2.desc || '',\\n                act: function () { chooseShrine(idx); }\\n              });\\n            })(k2);\\n          }\\n          hi.push({ t: '不碰它', glyph: '✕', act: function () { shrineOpen = false; shrineChoices = null; } });\\n          return {\\n            id: 'shrine', title: '古 老 神 龛',\\n            sub: '选一样带走 —— 但神龛从来不会白给。',\\n            items: hi, close: function () { shrineOpen = false; shrineChoices = null; }\\n          };\\n        }\\n\\n        /* 6) 遗物 / 事件（Choice） */\\n        if (Choice.on) {\\n          var qi = [];\\n          for (var m2 = 0; m2 < Choice.items.length; m2++) {\\n            (function (idx) {\\n              var it = Choice.items[idx];\\n              qi.push({\\n                t: it.name || it.t || ('选项 ' + (idx + 1)),\\n                glyph: '◆',\\n                tip: it.desc || '',\\n                right: it.tag || '',\\n                dim: it.ok === false,\\n                act: function () { Choice.pick(idx); }\\n              });\\n            })(m2);\\n          }\\n          qi.push({ t: '放弃', glyph: '✕', act: function () { Choice.on = false; try { setPadVisible(true); _padOn = true; } catch (e) { } } });\\n          return { id: 'choice', title: Choice.title || '', sub: Choice.sub || '', items: qi };\\n        }\\n\\n        return null;\\n      }\\n\\n      var helpOpen = false;\\n      function helpItems() {\\n        return [\\n          { t: '左下圆盘', tip: '按住拖到哪个方向就往哪走，按住不放会一直走', dim: true },\\n          { t: '右下 ✓', tip: '剧情 / 对话时出现，点它继续下一句', dim: true },\\n          { t: '右下 ☰', tip: '随时打开主菜单（换武器、存档、设置、回标题）', dim: true },\\n          { t: '右下 包', tip: '打开背包；服饰页可以穿 / 脱', dim: true },\\n          { t: '右下技能格', tip: '共 6 个技能，亮着才能放；发暗表示能量不够', dim: true },\\n          { t: '点地图', tip: '也能朝点的地方走一步', dim: true },\\n          { t: '关闭', glyph: '✕', act: function () { helpOpen = false; if (CFG.open) CFG.help = false; } }\\n        ];\\n      }\\n\\n      function goTitle() { helpOpen = false; backToTitle(); }   /* TITLEFIX_v1：helpOpen 是这一层的局部量，只能在这里清 */\\n\\n      /* ---------------- 每帧同步 ---------------- */\\n      function sync() {\\n        /* 背包是独立面板：网格 + 详情，塞不进 spec() 那套「一行一条」的结构，\\n           所以在这里先拦一道。 */\\n        if (BAG.open) {\\n          shell();\\n          R.style.display = '';\\n          var bk = bagSig();\\n          if (bk !== sig) { sig = bk; paintBag(); }\\n          return;\\n        }\\n        var s = spec();\\n        if (!s) {\\n          if (R) R.style.display = 'none';\\n          sig = '';\\n          return;\\n        }\\n        var key = s.id + '|' + s.title + '|' + (s.sub || '') + '|' + (s.close ? 1 : 0) + '|' + (s.hero ? 1 : 0) + '|' +\\n          s.items.map(function (i) {\\n            if (i.sec) return '#' + i.sec;\\n            return i.t + '/' + (i.right || '') + '/' + (i.sw || '') + '/' +\\n                   (i.dim ? 1 : 0) + '/' + (i.tip || '') + '/' + (i.chip ? 1 : 0);\\n          }).join(',');\\n        shell();\\n        R.style.display = '';\\n        if (key === sig) return;\\n        sig = key;\\n        paint(s);\\n      }\\n\\n      /* ---------------- 触控控件 ---------------- */\\n      function buildControls() {\\n        if (!ON) return;\\n        var L = game.uiLayer;\\n        if (!L) return;\\n        /* RESIZE_v1：控件坐标全是按 k 一次性算死的，视口一变就得整块重建。\\n           原来这里是 `if (C && C.parentNode) return;` —— 只建一次，\\n           横竖屏旋转后圆盘还是旧尺寸（320 宽的屏上 177px 的圆盘会把 6 个技能格全压住）。\\n           只在「取整后的宽高真的变了」时重建，不会每帧抖。 */\\n        var _w = Math.round(L.clientWidth || 0), _h = Math.round(L.clientHeight || 0);\\n        if (C && C.parentNode) {\\n          if (_w === builtW && _h === builtH) return;\\n          rebuild();              /* 拆旧的：C / R / sig / skBtns 一起清 */\\n        }\\n        builtW = _w; builtH = _h;\\n        var W = L.clientWidth || 390;\\n        var k = Math.max(0.72, Math.min(1.35, W / 390));\\n\\n        C = div('mctl');\\n        C.id = '__m_ctl';\\n\\n        /* --- 十字五键方向键（用户手绘样图）。\\n           18x18 像素网格画一只键：黑框 1 格 + 灰键面 #9CACB2 + 白色像素箭头；\\n           中间那格是「等」（四角青括号 + 菱形环 + 白芯）。\\n           网格取 18（偶数）—— 90 度旋转后像素仍落整格，不会糊边。 --- */\\n        var DP_G = 18;\\n        var DP_FACE = '#9CACB2', DP_FACE_ON = '#3C474B', DP_ORG = '#030607';\\n        var DP_CY = '#5FCFF7', DP_CY2 = '#A4E1F7';\\n\\n        /* 朝上的键面：r=1..6 逐级放宽（4,6,8,10,12,14），r>=7 满宽 16 */\\n        function dpUpFace(r, c) {\\n          if (r < 1 || r > 16) return false;\\n          var w = r >= 7 ? 16 : [0, 4, 6, 8, 10, 12, 14][r];\\n          var hw = w / 2;\\n          return c >= 9 - hw && c < 9 + hw;\\n        }\\n        /* 按方向把坐标反变换回「朝上」，五种键共用一套形状 */\\n        function dpFace(kind, r, c) {\\n          if (kind === 'wait') return r >= 1 && r <= 16 && c >= 1 && c <= 16;\\n          if (kind === 'up') return dpUpFace(r, c);\\n          if (kind === 'down') return dpUpFace(17 - r, 17 - c);\\n          if (kind === 'right') return dpUpFace(17 - c, r);\\n          return dpUpFace(c, 17 - r);\\n        }\\n        /* 描边 = 键面膨胀 1 格（沿对角线自然形成阶梯状黑边，跟样图一致） */\\n        function dpOut(kind, r, c) {\\n          if (dpFace(kind, r, c)) return false;\\n          for (var a = -1; a <= 1; a++) {\\n            for (var b = -1; b <= 1; b++) {\\n              var rr = r + a, cc = c + b;\\n              if (rr < 0 || cc < 0 || rr >= DP_G || cc >= DP_G) continue;\\n              if (dpFace(kind, rr, cc)) return true;\\n            }\\n          }\\n          return false;\\n        }\\n        /* 白箭头 10x10，居中放在 18 网格的 4..13 —— 10 是偶数，\\n           (4..13) 旋转回自己，不会偏心 1 格 */\\n        var DP_ART = [\\n          '...####...',\\n          '..######..',\\n          '##########',\\n          '##########',\\n          '##.####.##',\\n          '...####...',\\n          '...####...',\\n          '...####...',\\n          '...####...',\\n          '...####...'\\n        ];\\n        function dpUpArrow(r, c) {\\n          var y = r - 4, x = c - 4;\\n          if (y < 0 || y > 9 || x < 0 || x > 9) return 0;\\n          return DP_ART[y].charAt(x) === '#' ? 1 : 0;\\n        }\\n        function dpArrow(kind, r, c) {\\n          if (kind === 'up') return dpUpArrow(r, c);\\n          if (kind === 'down') return dpUpArrow(17 - r, 17 - c);\\n          if (kind === 'right') return dpUpArrow(17 - c, r);\\n          return dpUpArrow(c, 17 - r);\\n        }\\n        /* 「等」的徽章：12x12，放在键面（1..16）正中，占 3..14 */\\n        /* 14x14，放在键面（1..16）的 2..15 —— 左右各只留 1 格边距。\\n           原来是 12x12 放 3..14，留了 2 格，在 51px 的键上徽章明显偏小，\\n           跟样图「徽章几乎顶到黑框」的比例对不上。 */\\n        var DP_EQM = [\\n          'CC..........CC',\\n          'C............C',\\n          '...CC.CC.CC...',\\n          '...CC.CC.CC...',\\n          '.....CCCC.....',\\n          '...CCCCCCCC...',\\n          '...CCCLWCCC...',\\n          '...CCCLLCCC...',\\n          '...CCCCCCCC...',\\n          '.....CCCC.....',\\n          '...CC.CC.CC...',\\n          '...CC.CC.CC...',\\n          'C............C',\\n          'CC..........CC'\\n        ];\\n        function dpEq(r, c) {\\n          var y = r - 2, x = c - 2;\\n          if (y < 0 || y > 13 || x < 0 || x > 13) return '';\\n          return DP_EQM[y].charAt(x);\\n        }\\n        function dpDraw(cv, kind, on) {\\n          var g = cv.getContext('2d');\\n          if (!g) return;\\n          g.clearRect(0, 0, DP_G, DP_G);\\n          var r, c, ch;\\n          for (r = 0; r < DP_G; r++) {\\n            for (c = 0; c < DP_G; c++) {\\n              if (!dpOut(kind, r, c)) continue;\\n              g.fillStyle = DP_ORG;\\n              g.fillRect(c, r, 1, 1);\\n            }\\n          }\\n          for (r = 0; r < DP_G; r++) {\\n            for (c = 0; c < DP_G; c++) {\\n              if (!dpFace(kind, r, c)) continue;\\n              g.fillStyle = on ? DP_FACE_ON : DP_FACE;\\n              g.fillRect(c, r, 1, 1);\\n            }\\n          }\\n          if (kind === 'wait') {\\n            for (r = 0; r < DP_G; r++) {\\n              for (c = 0; c < DP_G; c++) {\\n                ch = dpEq(r, c);\\n                if (ch !== 'C' && ch !== 'L' && ch !== 'W') continue;\\n                g.fillStyle = ch === 'W' ? '#FFFFFF' : (ch === 'L' ? DP_CY2 : DP_CY);\\n                g.fillRect(c, r, 1, 1);\\n              }\\n            }\\n          } else {\\n            for (r = 0; r < DP_G; r++) {\\n              for (c = 0; c < DP_G; c++) {\\n                if (!dpArrow(kind, r, c)) continue;\\n                g.fillStyle = '#FFFFFF';\\n                g.fillRect(c, r, 1, 1);\\n              }\\n            }\\n          }\\n        }\\n\\n        /* 十字摆位：单键 S，整体 3S。样图五键几乎挨着，所以不留缝 */\\n        var D = Math.round(153 * k);\\n        var S = Math.floor(D / 3);\\n        var padW = S * 3;\\n        var pad = div('mdpad', 'left:' + Math.round(12 * k) + 'px;bottom:' + Math.round(16 * k) + 'px;' +\\n          'width:' + padW + 'px;height:' + padW + 'px;');\\n        pad.id = '__m_pad';\\n        pad._padBtn = false;   /* 声明这不是引擎的触控键，别被显隐逻辑波及 */\\n        var dpKeys = {};\\n        var dpList = [['up', 1, 0], ['left', 0, 1], ['wait', 1, 1], ['right', 2, 1], ['down', 1, 2]];\\n        for (var dq = 0; dq < dpList.length; dq++) {\\n          var dk = dpList[dq];\\n          var dcv = doc.createElement('canvas');\\n          dcv.width = DP_G;\\n          dcv.height = DP_G;\\n          dcv.style.cssText = 'left:' + (dk[1] * S) + 'px;top:' + (dk[2] * S) + 'px;' +\\n            'width:' + S + 'px;height:' + S + 'px;';\\n          if (dk[0] === 'wait') {\\n            dcv.setAttribute('data-label', 'wait');\\n            dcv.title = '等（原地等一回合）';\\n          }\\n          dpDraw(dcv, dk[0], false);\\n          pad.appendChild(dcv);\\n          dpKeys[dk[0]] = dcv;\\n        }\\n\\n        function mark(d) {\\n          var kk;\\n          for (kk in dpKeys) dpDraw(dpKeys[kk], kk, kk === d);\\n        }\\n        function setDir(d) {\\n          var name;\\n          for (name in DIRS) {\\n            if (name !== d) {\\n              if (held[name]) { game.input.keys[DIRS[name]] = false; held[name] = false; }\\n            }\\n          }\\n          if (d && !held[d]) {\\n            held[d] = true;\\n            game.input.keys[DIRS[d]] = true;\\n            game.input.just[DIRS[d]] = true;   /* 点一下就立刻走一格 */\\n          }\\n          if (d !== dpCur) { dpCur = d; mark(d); }\\n        }\\n        /* 中心那格是「等」：只吃 pointerdown，拖动经过不算，免得一路狂等 */\\n        function dpZone(ev) {\\n          var r = pad.getBoundingClientRect();\\n          var dx = (ev.clientX - (r.left + r.width / 2)) / r.width;\\n          var dy = (ev.clientY - (r.top + r.height / 2)) / r.height;\\n          if (Math.abs(dx) < 0.166 && Math.abs(dy) < 0.166) return 'wait';\\n          if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';\\n          return dy > 0 ? 'down' : 'up';\\n        }\\n        function dpWait() {\\n          try {\\n            var ob = game.input.buttons['等'];\\n            if (!ob) return;\\n            ob.justDown = true;\\n            ob.down = true;\\n            setTimeout(function () { try { ob.down = false; } catch (x) { } }, 90);\\n          } catch (x) { }\\n        }\\n        var pid = null, dpCur = null, waitArmed = false;\\n        pad.addEventListener('pointerdown', function (ev) {\\n          ev.preventDefault();\\n          pid = ev.pointerId;\\n          try { pad.setPointerCapture(pid); } catch (x) { }\\n          var z = dpZone(ev);\\n          waitArmed = (z === 'wait');\\n          if (waitArmed) { dpWait(); setDir(null); if (dpCur !== 'wait') { dpCur = 'wait'; mark('wait'); } }\\n          else setDir(z);\\n          try { if (typeof AudioSys !== 'undefined') AudioSys.ensure(); } catch (x) { }\\n        });\\n        pad.addEventListener('pointermove', function (ev) {\\n          if (pid === null || ev.pointerId !== pid) return;\\n          ev.preventDefault();\\n          var z = dpZone(ev);\\n          if (z === 'wait') { setDir(null); if (waitArmed && dpCur !== 'wait') { dpCur = 'wait'; mark('wait'); } return; }\\n          waitArmed = false;\\n          setDir(z);\\n        });\\n        function padEnd(ev) {\\n          if (pid !== null && ev && ev.pointerId !== undefined && ev.pointerId !== pid) return;\\n          pid = null;\\n          waitArmed = false;\\n          setDir(null);\\n          if (dpCur !== null) { dpCur = null; mark(null); }\\n        }\\n        pad.addEventListener('pointerup', padEnd);\\n        pad.addEventListener('pointercancel', padEnd);\\n        pad.addEventListener('lostpointercapture', padEnd);\\n        C.appendChild(pad);\\n\\n        /* ★ pad / dpKeys / DP_* 全是 buildControls 的局部变量，外层对象拿不到，\\n           所以在这里现做一份只读快照，给回归脚本量几何、看像素点阵 */\\n        DPAPI = {\\n          keys: function () {\\n            var out = [], pr = pad.getBoundingClientRect();\\n            for (var kk in dpKeys) {\\n              var r = dpKeys[kk].getBoundingClientRect();\\n              out.push({ k: kk, l: r.left, t: r.top, w: r.width, h: r.height,\\n                         dx: r.left - pr.left, dy: r.top - pr.top });\\n            }\\n            out.sort(function (a, b) { return a.dy - b.dy || a.dx - b.dx; });\\n            return { pad: { l: pr.left, t: pr.top, w: pr.width, h: pr.height }, keys: out };\\n          },\\n          face: function (kind) {\\n            var rows = [], r, c, line;\\n            for (r = 0; r < DP_G; r++) {\\n              line = '';\\n              for (c = 0; c < DP_G; c++) {\\n                if (dpOut(kind, r, c)) line += '#';\\n                else if (kind === 'wait') {\\n                  var q = dpEq(r, c);\\n                  line += (q === 'C' || q === 'L' || q === 'W') ? q : '.';\\n                } else line += dpArrow(kind, r, c) ? 'A' : '.';\\n              }\\n              rows.push(line);\\n            }\\n            return rows;\\n          }\\n        };\\n\\n        /* --- 右下功能键 --- */\\n        function btn(label, glyph, size, x, y, fn, cls) {\\n          var s = Math.round(size * k);\\n          var b = div('mbtn' + (cls ? ' ' + cls : ''),\\n            'right:' + Math.round(x * k) + 'px;bottom:' + Math.round(y * k) + 'px;width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(size * 0.42 * k) + 'px;');\\n          b.textContent = glyph;\\n          b.setAttribute('data-label', label);\\n          b.addEventListener('pointerdown', function (ev) {\\n            ev.preventDefault();\\n            ev.stopPropagation();\\n            try { b.style.transform = 'scale(.94)'; } catch (x) { }\\n            if (typeof AudioSys !== 'undefined') { try { AudioSys.ensure(); } catch (x) { } }\\n            fn(true);\\n          });\\n          function up() { try { b.style.transform = ''; } catch (x) { } fn(false); }\\n          b.addEventListener('pointerup', up);\\n          b.addEventListener('pointercancel', up);\\n          b.addEventListener('pointerleave', up);\\n          C.appendChild(b);\\n          return b;\\n        }\\n\\n        /* ✓ 确认：直接喂 Space —— 战斗出招、对话继续、菜单确认全走这条路。\\n           右边三键竖着一列排，左中右分区不再互相挤。 */\\n        /* TAPFIX_v1：.mbtn 是 content-box + 4px 边，实际尺寸 = 声明 + 8。\\n           纵向排布必须按「实际尺寸 + 4px 间隙」推，否则 ✓ 的左上角会被 ☰ 压住。 */\\n        var OKB = 14, OKS = 58, MNS = 46;\\n        var MNU_BOT = OKB + OKS + 8 + 4;      /* 84 */\\n        var BAG_BOT = MNU_BOT + MNS + 8 + 4;  /* 142 */\\n        btn('ok', '✓', OKS, 8, OKB, function (down) {\\n          if (down) { game.input.just['Space'] = true; game.input.keys['Space'] = true; }\\n          else { game.input.keys['Space'] = false; }\\n        }, 'ok');\\n\\n        /* 背包：塞尔达式网格，捡了东西随时翻 */\\n        btn('bag', '包', MNS, 22, BAG_BOT, function (down) {\\n          if (!down) return;\\n          BAG.open = !BAG.open;\\n          BAG.sel = 0;\\n        }, 'menu');\\n\\n        /* ☰ 主菜单 */\\n        btn('menu', '☰', MNS, 22, MNU_BOT, function (down) {\\n          if (!down) return;\\n          if (CFG.open) { cfgClose(); return; }\\n          cfgOpen();\\n        }, 'menu');\\n\\n        /* --- 技能键：2 列 3 行，显示技能名首字。\\n           原来那 6 个「蓝色圆钮只有数字」被藏掉了 —— 数字对玩家没信息量，\\n           改成首字（穿/奥/治/震/终/血）+ 三态：未学会(灰) / 学会但能量不够(暗) / 可放(亮) --- */\\n        var SK_W = 40, SK_G = 6;\\n        /* 小屏（320 宽，k≈0.82）别再跟着缩 —— 低于 40px 手指点不准，\\n           这正是用户说的「十字键用起来不舒服」的同源问题 */\\n        var SKS = Math.max(40, Math.round(SK_W * k));\\n        /* ★ 步长必须按【实际按钮尺寸】算，不能按 40*k 算。\\n           以前的写法：位置 right/bottom 用 (96 + col*(SK_W+SK_G))*k 缩放，\\n           尺寸却是 max(40, 40*k) —— 小屏时尺寸不缩、位置缩了，两列/三行就叠在一起。\\n           实测（verify_skill_layout.js 的旧版对照）：320 宽叠 2px、280 宽叠 7px，\\n           横竖都叠。改成 STEP = 真实尺寸 + 真实间距 后，280~480 全过。 */\\n        var SK_STEP = SKS + Math.max(5, Math.round(SK_G * k));\\n        var SK_R0 = Math.round(96 * k);        /* 最右一列距屏幕右边的距离 */\\n        var SK_B0 = Math.round(18 * k);        /* 最下一行距屏幕底边的距离 */\\n        for (var s5 = 0; s5 < SKILLS.length; s5++) {\\n          (function (idx) {\\n            var col = idx % 2, row = Math.floor(idx / 2);\\n            var b2 = div('mskill lock',\\n              'right:' + (SK_R0 + col * SK_STEP) + 'px;' +\\n              'bottom:' + (SK_B0 + row * SK_STEP) + 'px;' +\\n              'width:' + SKS + 'px;height:' + SKS + 'px;' +\\n              'font-size:' + Math.max(14, Math.round(16 * k)) + 'px;');\\n            b2.setAttribute('data-skill', String(idx));\\n            b2.setAttribute('title', SKILLS[idx].name + '（EN ' + SKILLS[idx].cost + '）');\\n            /* 有手绘美术就上图（文字首字退场），没有就还是首字 */\\n            var _art = SKILL_ART[SKILLS[idx].id];\\n            if (_art) {\\n              b2.className = 'mskill art lock';\\n              b2.style.backgroundImage = _art;\\n            } else {\\n              b2.textContent = SKILLS[idx].name.slice(0, 1);\\n            }\\n            /* AIMANGLE_v1：不再走引擎的「按一下就算放」，改成长按拖拽。\\n               点一下 -> 按当前面向（电脑端会自动锁敌）\\n               点住往任意方向拖 -> 松手时朝那个方向放（不再只有 4 向） */\\n            b2.addEventListener('pointerdown', function (ev) {\\n              try { AIM.begin(ev, idx, b2); } catch (x) {\\n                var ob = game.input.buttons[String(idx + 1)];\\n                if (ob) { ob.justDown = true; ob.down = true; }\\n              }\\n            });\\n            b2.addEventListener('contextmenu', function (ev) { ev.preventDefault(); });\\n            C.appendChild(b2);\\n            skBtns.push(b2);\\n          })(s5);\\n        }\\n\\n        L.appendChild(C);\\n      }\\n\\n      /* 把引擎自带的箭头键 / 存读换↺ / 数字技能键藏掉：\\n         它们和新的圆盘、技能格重复，还是老手感（数字钮只有数字，没信息量） */\\n      function hideLegacy() {\\n        var L = game.uiLayer;\\n        if (!L || !L.children) return;\\n        var kill = { '▲': 1, '◀': 1, '▶': 1, '▼': 1, '换': 1, '存': 1, '读': 1, '↺': 1, '等': 1 };\\n        for (var i = 1; i <= SKILLS.length; i++) kill[String(i)] = 1;\\n        for (var i = 0; i < L.children.length; i++) {\\n          var el = L.children[i];\\n          if (!el || !el._padBtn) continue;\\n          var t = (el.textContent || '').trim();\\n          if (kill[t]) { el.style.display = 'none'; el.style.pointerEvents = 'none'; }\\n        }\\n      }\\n\\n      /* 技能格三态：未学会 / 学会但能量不够 / 可放 */\\n      function syncSkills() {\\n        for (var i = 0; i < skBtns.length; i++) {\\n          var own = p.skills.indexOf(i) >= 0;\\n          var art = !!SKILL_ART[SKILLS[i].id];\\n          var cls = 'mskill' + (art ? ' art' : '');\\n          if (!own) cls += ' lock';\\n          else if (p.energy >= SKILLS[i].cost) cls += ' ready';\\n          else if (art) cls += ' own';\\n          if (skBtns[i].className !== cls) skBtns[i].className = cls;\\n        }\\n      }\\n\\n      /* ============ ROTATE_v1：画布太窄 → 请竖屏 ============ */\\n      var rotEl = null, rotOn = false, rotI = null, rotT = null, rotS = null;\\n      function syncRotate() {\\n        var cw = (game.uiLayer && game.uiLayer.clientWidth) || 0;\\n        var need = cw > 0 && cw < 300;\\n        if (!rotEl) {\\n          rotEl = div('mrot');\\n          rotEl.id = '__m_rot';\\n          rotI = txt(div('i'), '📱');\\n          rotT = txt(div('t'), '请竖屏游玩');\\n          rotS = txt(div('s'), '横屏会把画面挤成窄条，按钮会互相压住');\\n          rotEl.appendChild(rotI); rotEl.appendChild(rotT); rotEl.appendChild(rotS);\\n          (doc.body || doc.documentElement).appendChild(rotEl);\\n        }\\n        if (need === rotOn) return;\\n        rotOn = need;\\n        /* 文案跟方向走：横屏才劝竖屏；真是竖屏但机器太窄，就说屏幕太窄。 */\\n        var land = (window.innerWidth || 0) > (window.innerHeight || 0);\\n        rotT.textContent = land ? '请竖屏游玩' : '屏幕太窄';\\n        rotS.textContent = land ? '横屏会把画面挤成窄条，按钮会互相压住'\\n                                : '触控按钮需要 300px 以上的画布宽度';\\n        rotEl.style.display = need ? 'flex' : 'none';\\n      }\\n\\n      function tick() {\\n        if (!ON) return;\\n        installCSS();\\n        /* ---- PCUI_CTL_v1：电脑端照样建，建完只保留「包 / ☰」两颗鼠标可点的键\\n           —— 用户要「菜单和背包都是 UI，要显现出来、用鼠标能点」。\\n           方向盘 / 技能键 / ✓ 键随后从 DOM 里摘掉（鼠标玩不需要，也不该占画面）。 ---- */ /*PCUI_CTL_v1*/\\n        buildControls();                /* PCUI_CTL_v1：电脑端也建，建完只留 包/☰ */\\n        if (PCUI && C && C.parentNode && !C.__pcTrim) {\\n          C.__pcTrim = 1;\\n          var _pcDrop = C.querySelectorAll('.mdpad,.mskill,.mbtn.ok,#__m_pad');\\n          for (var _pcI = _pcDrop.length - 1; _pcI >= 0; _pcI--) {\\n            if (_pcDrop[_pcI].parentNode) _pcDrop[_pcI].parentNode.removeChild(_pcDrop[_pcI]);\\n          }\\n          C.className = 'mctl pconly';\\n          /* 控件根铺满全屏，必须穿透；两颗 .mbtn 自己是 pointer-events:auto */\\n          C.style.pointerEvents = 'none';\\n        }\\n        hideLegacy();\\n        sync();\\n        try { syncSkills(); } catch (e) { }\\n        /* PCUI_CTL_v1：电脑端开菜单（CFG.open）时控件层要继续显示，\\n           否则 ☰ 一按就消失，鼠标没法再点回去。 */\\n        var blocked = titleOpen || storyOpen || over || (CFG.open && !PCUI) || CHEAT.on || Choice.on || shopOpen || shrineOpen || BAG.open;\\n        /* OKKEY_v1：吃 Space 的弹层只留 ✓ 一颗键，其余隐藏。\\n           标题页 / 设置 / 调试 / 背包不吃 Space，照旧整层隐藏，免得误触。 */\\n        /* 只对 canvas 剧情窗生效：结算 / 三选一 / 商店 / 神龛都是 .mroot(z60) 的\\n           DOM 卡片，压在控件层(z50) 上面，留 ✓ 既看不见也点不到。 */\\n        var okOnly = !!(storyOpen);\\n        if (C) {\\n          if (blocked && okOnly) {\\n            if (C.style.display === 'none') C.style.display = '';\\n            if (!C.classList.contains('okonly')) C.classList.add('okonly');\\n          } else {\\n            if (blocked) C.style.display = 'none'; else C.style.display = '';\\n            if (C.classList.contains('okonly')) C.classList.remove('okonly');\\n          }\\n        }\\n        if (C && !blocked) {\\n          for (var si = 0; si < skBtns.length; si++) skBtns[si].style.display = '';\\n          var wb = C.querySelector('.mbtn[data-label=\\\"wait\\\"]');\\n          if (wb) wb.style.display = '';\\n          /* DPAD_v10_TICK：display 兜底。十字键被引擎「触控键显隐」一次性设成过 none，\\n             之后不恢复（实测手动置空后 2 秒内没有第二次写入）。\\n             那个函数只认 _padBtn，按理碰不到方向键，但写入点抓不到\\n             （CSSStyleDeclaration.prototype 上拿不到 display 的 setter），\\n             所以每帧兜底一次 —— 一次字符串比较，开销可忽略。 */\\n          var _pd = doc.getElementById('__m_pad');\\n          if (_pd && _pd.style.display === 'none') _pd.style.display = '';\\n        }\\n        try { syncRotate(); } catch (e) { }   /* ROTATE_v1 */\\n      }\\n\\n      /* 重开/切场景后控件可能被清掉，暴露一个重建入口 */\\n      function rebuild() {\\n        try { if (C && C.parentNode) C.parentNode.removeChild(C); } catch (e) { }\\n        try { if (R && R.parentNode) R.parentNode.removeChild(R); } catch (e) { }\\n        C = null; R = null; sig = '';\\n        skBtns = [];\\n      }\\n\\n      return {\\n        on: ON, tick: tick, sync: sync, rebuild: rebuild,\\n        rotState: function () { return { on: rotOn, el: !!rotEl, w: (game.uiLayer && game.uiLayer.clientWidth) || 0, land: (window.innerWidth || 0) > (window.innerHeight || 0), text: rotT ? rotT.textContent : null }; },\\n        /* ---- 十字键：自动化用（DPAD_v10）----\\n           pad / dpKeys / DP_* 都是 buildControls 的局部变量，外层拿不到，\\n           所以走 buildControls 里填好的 DPAPI 快照。 */\\n        dpKeys: function () { return DPAPI ? DPAPI.keys() : null; },\\n        dpFace: function (kind) { return DPAPI ? DPAPI.face(kind) : null; },\\n        /* ---- 背包：自动化用（BAGUI_v99）---- */\\n        bagOpen: function (v) { BAG.open = !!v; sig = ''; return BAG.open; },\\n        /* BAGKEY_v1：键盘 B 用。BAG 在模块闭包里，外面摸不到，只能从这儿走 */\\n        bagToggle: function () { BAG.open = !BAG.open; BAG.sel = 0; sig = ''; return BAG.open; },\\n        bagTab: function (t) { BAG.tab = t; BAG.sel = 0; sig = ''; return BAG.tab; },\\n        bagPick: function (i) { BAG.sel = i; paintBag(); return BAG.sel; },\\n        bagClick: function (what) {\\n          var el = doc.querySelector('#__m_card .' + what);\\n          if (!el) return false;\\n          el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true }));\\n          return true;\\n        },\\n        bagState: function () {\\n          var l = bagList();\\n          return { open: BAG.open, tab: BAG.tab, sel: BAG.sel,\\n                   n: l.length, names: l.map(function (a) { return a.name + (a.n > 1 ? 'x' + a.n : ''); }) };\\n        },\\n        help: function (v) { helpOpen = !!v; sig = ''; },\\n        /* ---- 观测/自动化用（手机端回归测试靠这几个拿坐标） ---- */\\n        visible: function () { return !!(R && R.parentNode && R.style.display !== 'none'); },\\n        panel: function () {\\n          if (!R || R.style.display === 'none') return null;\\n          var h = doc.querySelector('#__m_card .mtitle');\\n          return h ? h.textContent : '';\\n        },\\n        itemRects: function () {\\n          var out = [], l = doc.querySelectorAll('#__m_card .mitem');\\n          for (var i = 0; i < l.length; i++) {\\n            var r = l[i].getBoundingClientRect();\\n            out.push({ t: (l[i].textContent || '').trim().slice(0, 14), x: r.left + r.width / 2, y: r.top + r.height / 2, dim: l[i].className.indexOf('dim') >= 0 });\\n          }\\n          return out;\\n        },\\n        closeRect: function () {\\n          var b = doc.querySelector('#__m_card .mclose');\\n          if (!b) return null;\\n          var r = b.getBoundingClientRect();\\n          return { x: r.left + r.width / 2, y: r.top + r.height / 2 };\\n        },\\n        ctlRect: function () {\\n          var b = doc.getElementById('__m_ctl');\\n          if (!b) return null;\\n          var r = b.getBoundingClientRect();\\n          return { x: r.left, y: r.top, w: r.width, h: r.height, shown: b.style.display !== 'none',\\n                   okOnly: b.classList.contains('okonly') };   /* OKKEY_v1 */\\n        },\\n        padRect: function () {\\n          var p2 = doc.getElementById('__m_pad');\\n          if (!p2) return null;\\n          var r = p2.getBoundingClientRect();\\n          return { x: r.left, y: r.top, w: r.width, h: r.height };\\n        },\\n        btnRect: function (label) {\\n          var b = doc.querySelector('#__m_ctl .mbtn[data-label=\\\"' + label + '\\\"]');\\n          if (!b) return null;\\n          var r = b.getBoundingClientRect();\\n          return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width };\\n        },\\n        skillRects: function () {\\n          var out = [], l = doc.querySelectorAll('#__m_ctl .mskill');\\n          for (var i = 0; i < l.length; i++) {\\n            var r = l[i].getBoundingClientRect();\\n            out.push({\\n              i: i, t: (l[i].textContent || ''), cls: l[i].className,\\n              x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width\\n            });\\n          }\\n          return out;\\n        }\\n      };\\n    })();\\n\\n    /* ================= MOVEFEEL_v1：匀速滑行 =================\\n       为什么不沿用 ease = min(1, dt*16)：那是指数趋近，每步开头猛、末尾拖，\\n       150ms 一步就变成「冲一下、停一下」。匀速才是传说之下那种手感。\\n       dl > TILE*2.6 判定为瞬移（goto / 读档 / 换层），直接落位不滑。 */\\n    var _mvMode = 1;     /* 1 = 匀速（默认）；0 = 旧指数趋近，只给 A/B 对照用 */\\n    var _mvMul = 1.06;   /* 速度余量：多 6% 保证每步都走到位，不吃掉零头 */\\n    var _mvDur = 0.15, _mvLim = 0, _mvDt = 0.0167;\\n    function mvSlide(ent, tx, ty, lim) {\\n      var dx = tx - ent.x, dy = ty - ent.y;\\n      var dl = Math.sqrt(dx * dx + dy * dy);\\n      if (dl <= lim || dl > TILE * 2.6) { ent.x = tx; ent.y = ty; return; }\\n      ent.x += dx / dl * lim;\\n      ent.y += dy / dl * lim;\\n    }\\n\\n    /* ================= 主循环 ================= */\\n    /* ---- ESCFIX_v1：同帧「关了又被打开」的守卫 ---- */ /*ESCFIX_v1*/\\n    var stepCd = 0, tapCd = 0;\\n    var _frameNo = 0, _cfgClosedFrame = -1;\\n    scene.onUpdate = function (dt) {\\n      _frameNo++;          /* ESCFIX_v1 */\\n      animClock += dt;\\n      stepCd = Math.max(0, stepCd - dt); tapCd = Math.max(0, tapCd - dt);\\n      p.hitT = Math.max(0, p.hitT - dt);\\n      for (var mi = 0; mi < mons.length; mi++) mons[mi].hitT = Math.max(0, mons[mi].hitT - dt);\\n      /* ---- MOVEFEEL_v1：匀速滑行（原来是指数趋近，速度是锯齿波）---- */\\n      _mvDt = dt;                                  /* 暴露给探针：算速度要用游戏自己的 dt */\\n      _mvDur = CHEAT.speed ? 0.075 : 0.15;         /* 必须和输入处 stepCd 的取值一致 */\\n      _mvLim = (TILE / _mvDur) * _mvMul * dt;      /* 多给一点余量，保证每步都走到位 */\\n      if (_mvMode === 1) {\\n        mvSlide(player, (p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, _mvLim);\\n      } else {\\n        var _ease = Math.min(1, dt * 16);\\n        player.x += ((p.gx + 0.5) * TILE - player.x) * _ease;\\n        player.y += ((p.gy + 0.5) * TILE - player.y) * _ease;\\n      }\\n      for (var i = 0; i < mons.length; i++) {\\n        var m = mons[i], e = monEnts[i];\\n        if (!e) continue;\\n        if (_mvMode === 1) mvSlide(e, (m.gx + 0.5) * TILE, (m.gy + 0.5) * TILE, _mvLim);\\n        else {\\n          var _ease2 = Math.min(1, dt * 16);\\n          e.x += ((m.gx + 0.5) * TILE - e.x) * _ease2;\\n          e.y += ((m.gy + 0.5) * TILE - e.y) * _ease2;\\n        }\\n      }\\n\\n      var inp = game.input;\\n\\n      /* v8.0：手机 UI 层每帧同步（面板 / 触控圆盘） */\\n      try { MOBILE.tick(); } catch (e) { if (!window.__MOBERR) { window.__MOBERR = String(e); } }\\n\\n      /* ---- v3.2.7：统一同步触控键显隐（必须最先执行！\\n         原来放在 titleOpen 分支之后，标题页直接 return 导致永远不执行） ---- */\\n      syncPad();\\n      /* v6.0：命中顿帧 —— 只冻结输入，粒子与动画继续跑 */\\n      VFX.update(dt); BGM.tick(dt);\\n      if (hitStop > 0) { hitStop = Math.max(0, hitStop - dt); return; }\\n\\n      /* ---- v4.0：主控面板最先响应（它一开，别的输入全让路）---- */\\n      updateConfig(dt); cfgPointer(dt);\\n      if (CFG.open) return;\\n\\n      /* ---- v6.0：遗物 / 事件选择面板（次高优先级，开了就吞掉一切输入）---- */\\n      updateChoice(dt);\\n      if (Choice.on) return;\\n\\n      /* ---- v3：标题页最先 ---- */\\n      if (titleOpen) { updateTitle(dt); return; }\\n\\n      /* ---- v3：调试面板优先 ---- */\\n      updateCheat(dt);\\n      if (CHEAT.on) return;\\n\\n      /* ---- v3：剧情窗口 ---- */\\n      if (storyOpen) {\\n        updateStory(dt);\\n        if (storyTimer > 0.5 && (inp.justPressed('space') || inp.justPressed('Enter') || inp.pointer.justDown)) {\\n          storyOpen = false;\\n          /* STORYFLOW_v1：剧情看完，该给的东西补上 */\\n          if (pendingOffer) {\\n            pendingOffer = 0;\\n            try { offerSkill(); } catch (e) { }\\n            try { offerRelic(); } catch (e) { }\\n          }\\n        }\\n        return;\\n      }\\n\\n      /* ---- v4.0：ESC 打开主控面板（战斗 / 剧情 / 标题时不抢键）---- */\\n      /* ESCFIX_v1：`justPressed` 在同一帧被读两次不会失效 —— updateConfig 刚用它\\n         关掉面板，这里会再打开一次，表现成「Esc 关不掉菜单」。只吞同一帧。 */\\n      if (inp.justPressed('Escape') && _cfgClosedFrame !== _frameNo) { cfgOpen(); return; }\\n\\n      /* ---- v3：武器切换（Q/E 循环，[ ] 也行） ---- */\\n      if (inp.justPressed('KeyQ') || inp.justPressed('BracketLeft')) { cycleWeapon(-1); return; }\\n      if (inp.justPressed('KeyE') || inp.justPressed('BracketRight')) { cycleWeapon(1); return; }\\n\\n      /* BAGKEY_v1：B 开背包。操作说明里一直写着「B 打开」，但输入链里从来没绑过 ——\\n         手机靠右下角那颗「包」键，电脑上没有触屏控件就等于打不开。\\n         BAG 在 MOBILE 的闭包里，这里只能走它导出的 bagToggle()。 */\\n      if (inp.justPressed('KeyB')) { MOBILE.bagToggle(); return; }\\n\\n      /* ---- v3：快存 / 快读（键盘 K/L，手机 W/S/L 按钮） ---- */\\n      if (inp.justPressed('KeyK') || inp.buttonJust('存')) { saveGame(); return; }\\n      if (inp.justPressed('KeyL') || inp.buttonJust('读')) { loadGame(); return; }\\n      if (inp.buttonJust('换')) { cycleWeapon(1); return; }\\n\\n      if (over) {\\n        if (inp.justPressed('KeyR') || inp.buttonJust('↺') || inp.justPressed('Space')) {\\n          if (chapPending > 0) { enterChapter(chapPending); }\\n          else restart();\\n        }\\n        return;\\n      }\\n      /* 神龛 / 商店：数字键选择 */\\n      if (shrineOpen) {\\n        for (var si = 0; si < SKILLS.length + 1 && si < 4; si++) {\\n          if (inp.justPressed('Digit' + (si + 1)) || inp.buttonJust(String(si + 1))) chooseShrine(si);\\n        }\\n        if (inp.justPressed('Escape') || inp.justPressed('Space')) { shrineOpen = false; shrineChoices = null; }\\n        return;\\n      }\\n      if (shopOpen) {\\n        if (inp.justPressed('Digit0') || inp.justPressed('Escape')) { shopOpen = false; log('你离开了商店。', '#9aa8bd'); }\\n        for (var qi = 0; qi < shopStock.length; qi++) {\\n          if (inp.justPressed('Digit' + (qi + 1))) buyFromShop(qi);\\n        }\\n        return;\\n      }\\n      /* 技能快捷键（Shift+数字 = 切武器，避免跟技能抢键） */\\n      var shiftHeld = inp.isDown('ShiftLeft') || inp.isDown('ShiftRight');\\n      for (var ki = 0; ki < SKILLS.length; ki++) {\\n        if (inp.justPressed('Digit' + (ki + 1)) || inp.buttonJust(String(ki + 1))) {\\n          if (shiftHeld) { switchWeapon(ki); return; }\\n          /* AIMANGLE_v1：电脑端是「按住瞄准、松手释放」，由 AIM 的键鼠监听驱动；\\n             这里直接 return，否则按下那一瞬间就放出去了。手机端仍点按即放。 */\\n          if (!AIM.desktop) { try { AIM.cast(ki); } catch (x_aim) { useSkill(ki); } }\\n          return;\\n        }\\n      }\\n      var dx = 0, dy = 0;\\n      if (inp.justPressed('left') || inp.justPressed('KeyA') || inp.buttonJust('◀')) dx = -1;\\n      else if (inp.justPressed('right') || inp.justPressed('KeyD') || inp.buttonJust('▶')) dx = 1;\\n      else if (inp.justPressed('up') || inp.justPressed('KeyW') || inp.buttonJust('▲')) dy = -1;\\n      else if (inp.justPressed('down') || inp.justPressed('KeyS') || inp.buttonJust('▼')) dy = 1;\\n      else if (stepCd <= 0) {\\n        if (inp.isDown('left') || inp.isDown('KeyA') || inp.buttonDown('◀')) dx = -1;\\n        else if (inp.isDown('right') || inp.isDown('KeyD') || inp.buttonDown('▶')) dx = 1;\\n        else if (inp.isDown('up') || inp.isDown('KeyW') || inp.buttonDown('▲')) dy = -1;\\n        else if (inp.isDown('down') || inp.isDown('KeyS') || inp.buttonDown('▼')) dy = 1;\\n        else if (inp.joy.active) {\\n          var ax = inp.joy.dx, ay = inp.joy.dy;\\n          if (Math.abs(ax) > 0.45 || Math.abs(ay) > 0.45) {\\n            if (Math.abs(ax) > Math.abs(ay)) dx = Math.sign(ax); else dy = Math.sign(ay);\\n          }\\n        }\\n      }\\n      if (dx || dy) { stepCd = CHEAT.speed ? 0.075 : 0.15; playerAct(dx, dy); return; }\\n      if (inp.justPressed('space') || inp.buttonJust('等')) { playerAct(0, 0); return; }\\n      if (inp.pointer.justDown && tapCd <= 0) {\\n        tapCd = 0.12;\\n        var wx = Math.floor((inp.pointer.x + scene.camera.ox) / TILE);\\n        var wy = Math.floor((inp.pointer.y + scene.camera.oy) / TILE);\\n        var ddx = Math.sign(wx - p.gx), ddy = Math.sign(wy - p.gy);\\n        if (ddx || ddy) {\\n          if (Math.abs(wx - p.gx) >= Math.abs(wy - p.gy)) playerAct(ddx, 0);\\n          else playerAct(0, ddy);\\n        }\\n      }\\n    };\\n\\n    /* ================================================================\\n       v6.0 · 武器词条 / 怪物词缀 / 随机事件\\n       ================================================================ */\\n    /* 武器词条：拾取时有 60% 概率附带一条（剧情武器不带） */\\n    var AFFIXES = [\\n      { id: 'sharp', name: '锋利', color: '#ff9d7a', desc: '攻击 +20%' },\\n      { id: 'leech', name: '汲取', color: '#e05a8a', desc: '命中回复 15% 伤害' },\\n      { id: 'rend',  name: '破甲', color: '#c9a0ff', desc: '无视敌人 30% 防御' },\\n      { id: 'swift', name: '迅捷', color: '#7ad8ff', desc: '15% 概率打完不惊动敌人' }\\n    ];\\n    function affixById(id) {\\n      for (var i = 0; i < AFFIXES.length; i++) if (AFFIXES[i].id === id) return AFFIXES[i];\\n      return null;\\n    }\\n    function rollAffix() {\\n      return Math.random() < 0.60 ? AFFIXES[rint(0, AFFIXES.length - 1)] : null;\\n    }\\n    function weaponAffix() {\\n      var w = curWeapon();\\n      return (w && w.affix) ? affixById(w.affix) : null;\\n    }\\n\\n    /* 怪物词缀：第 5 层起普通怪按概率带一个，名字前缀 + 数值变化 */\\n    var MON_AFFIX = [\\n      { id: 'berserk',  name: '狂暴', color: '#ff6b6b', desc: '攻击 +50%' },\\n      { id: 'armored',  name: '厚甲', color: '#b9c6d8', desc: '体力 +50%、防御 +2' },\\n      { id: 'venom',    name: '剧毒', color: '#8ee6a0', desc: '命中使目标中毒' },\\n      { id: 'vampiric', name: '嗜血', color: '#e05a8a', desc: '命中回复 40% 伤害' }\\n    ];\\n    function monAffixById(id) {\\n      for (var i = 0; i < MON_AFFIX.length; i++) if (MON_AFFIX[i].id === id) return MON_AFFIX[i];\\n      return null;\\n    }\\n\\n    /* 随机事件：每层有概率落一处，踩上去开面板 */\\n    var EVENT_TYPES = ['altar', 'gambler', 'cursed'];\\n    var EVENT_DEFS = {\\n      altar: { title: '血 祭 祭 坛', color: '#c9a0ff', rgb: '201,160,255', glyph: '☩',\\n        sub: '石台上刻着一句话：想拿走什么，先留下什么。',\\n        opts: function () {\\n          var cost = Math.max(4, Math.round(p.maxHp * 0.25));\\n          return [\\n            { name: '献上鲜血', desc: '体力上限 -' + cost + '，换一件随机遗物',\\n              icon: '☩', tag: '献祭', color: '#c9a0ff', ok: p.maxHp > cost + 12, _k: 'pay' },\\n            { name: '转身离开', desc: '什么 ==============================================================\\n       v6.0 · 通用选择面板 —— 遗物 / 随机事件 / 诅咒共用\\n       ================================================================ */\\n    var Choice = {\\n      on: false, title: '', sub: '', items: [], idx: 0, cb: null, t: 0,\\n      show: function (title, sub, items, cb) {\\n        Choice.on = true; Choice.title = title; Choice.sub = sub || '';\\n        Choice.items = items || []; Choice.idx = 0; Choice.cb = cb || null; Choice.t = 0;\\n        /* 面板是全屏的，DOM 触控键必须让位（它们在 canvas 上层，画布盖不住） */\\n        try { setPadVisible(false); _padOn = false; } catch (e) {}\\n      },\\n      pick: function (i) {\\n        if (!Choice.on || i < 0 || i >= Choice.items.length) return;\\n        var it = Choice.items[i];\\n        /* v6.0：条件不满足的选项直接拦掉，面板保持打开 */\\n        if (it && it.ok === false) { SFX.trap(); return; }\\n        Choice.on = false;\\n        try { setPadVisible(true); _padOn = true; } catch (e) {}\\n        if (Choice.cb) Choice.cb(it, i);\\n      }\\n    };\\n\\n    var CH_W = 288, CH_H = 62, CH_GAP = 12;\\n    function choiceLayout() {\\n      var n = Math.max(1, Choice.items.length);\\n      var totalH = n * CH_H + (n - 1) * CH_GAP;\\n      return { x: (CW - CH_W) / 2, y0: CH / 2 - totalH / 2 + 14, w: CH_W, h: CH_H, gap: CH_GAP, total: totalH };\\n    }\\n    function cutText(s, n) {\\n      s = s || '';\\n      return s.length <= n ? s : s.slice(0, n - 1) + '…';\\n    }\\n    function rrPath(ctx, x, y, w, h, r) {\\n      ctx.beginPath();\\n      ctx.moveTo(x + r, y);\\n      ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);\\n      ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);\\n      ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);\\n      ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);\\n      ctx.closePath();\\n    }\\n\\n    function updateChoice(dt) {\\n      if (!Choice.on) return;\\n      Choice.t += dt;\\n      var inp = game.input;\\n      var n = Choice.items.length;\\n      if (inp.justPressed('ArrowUp') || inp.justPressed('KeyW')) {\\n        Choice.idx = (Choice.idx - 1 + n) % n; SFX.step();\\n      } else if (inp.justPressed('ArrowDown') || inp.justPressed('KeyS')) {\\n        Choice.idx = (Choice.idx + 1) % n; SFX.step();\\n      }\\n      for (var i = 0; i < n && i < 9; i++) {\\n        if (inp.justPressed('Digit' + (i + 1))) { Choice.pick(i); return; }\\n      }\\n      if (inp.justPressed('space') || inp.justPressed('Enter')) { Choice.pick(Choice.idx); return; }\\n      if (inp.pointer.justDown) {\\n        var g = choiceLayout(), px = inp.pointer.x, py = inp.pointer.y;\\n        for (var j = 0; j < n; j++) {\\n          var ry = g.y0 + j * (g.h + g.gap);\\n          if (py >= ry && py <= ry + g.h && px >= g.x && px <= g.x + g.w) {\\n            if (Choice.idx === j) { Choice.pick(j); return; }\\n            Choice.idx = j; SFX.step(); return;\\n          }\\n        }\\n      }\\n    }\\n\\n    function drawChoice(ctx) {\\n      if (!Choice.on) return;\\n      var fade = Math.min(1, Choice.t * 5.5);\\n      var g = choiceLayout();\\n      ctx.save();\\n      ctx.globalAlpha = fade;\\n      ctx.fillStyle = '#05070d'; ctx.fillRect(0, 0, CW, CH);\\n      /* 顶部与底部的渐隐，避免大面积纯黑显得廉价 */\\n      var _g1 = ctx.createLinearGradient(0, 0, 0, CH * 0.42);\\n      _g1.addColorStop(0, 'rgba(60,40,110,.20)');\\n      _g1.addColorStop(1, 'rgba(5,7,13,0)');\\n      ctx.fillStyle = _g1; ctx.fillRect(0, 0, CW, CH * 0.42);\\n      var _g2 = ctx.createLinearGradient(0, CH * 0.72, 0, CH);\\n      _g2.addColorStop(0, 'rgba(5,7,13,0)');\\n      _g2.addColorStop(1, 'rgba(30,60,90,.16)');\\n      ctx.fillStyle = _g2; ctx.fillRect(0, CH * 0.72, CW, CH * 0.28);\\n\\n      ctx.textAlign = 'center';\\n      ctx.fillStyle = '#e8f0ff'; ctx.font = 'bold 15px sans-serif';\\n      ctx.fillText(Choice.title, CW / 2, g.y0 - 48);\\n      if (Choice.sub) {\\n        ctx.fillStyle = 'rgba(180,200,225,. sel ? 'rgba(214,228,246,.92)' : 'rgba(158,176,198,.80)'; ctx.font = '10.5px sans-serif';\\n        ctx.fillText(cutText(it.desc, 19), g.x + 48, y + 43);\\n\\n        ctx.textAlign = 'right';\\n        ctx.fillStyle = acc; ctx.font = 'bold 9px sans-serif';\\n        ctx.fillText(it.tag || rar.name, g.x + g.w - 12, y + 21);\\n        ctx.textAlign = 'center';\\n      }\\n\\n      ctx.fillStyle = 'rgba(150,170,195,.55)'; ctx.font = '10px sans-serif';\\n      ctx.fillText('↑↓ 选择 · 空格 确认 · 数字键直选', CW / 2, g.y0 + g.total + 28);\\n      ctx.textAlign = 'left';\\n      ctx.restore();\\n    }\\n\\n    /* 每层结束：三选一遗物 */\\n    function offerRelic() {\\n      if (p.relics && p.relics.length >= 12) return;\\n      var picks = rollRelics(3);\\n      if (!picks.length) return;\\n      var items = [], i;\\n      for (i = 0; i < picks.length; i++) {\\n        items.push({ name: picks[i].name, desc: picks[i].desc, icon: picks[i].icon, rar: picks[i].rar, _id: picks[i].id });\\n      }\\n      Choice.show('选 择 一 件 遗 物', '第 ' + floorNo + ' 层 · 永久生效', items, function (it) {\\n        addRelic(it._id);\\n        var r = relicById(it._id);\\n        msg('✦ 获得遗物「' + r.name + '」：' + r.desc, RARITY[r.rar].color);\\n        fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: RARITY[r.rar].color, count: 22, speed: 200 });\\n        SFX.loot();\\n      });\\n    }\\n\\n    /* ---- 攻击力：基础 + 武器 + 遗物加成 ---- */\\n    function baseAtk() { var w = curWeapon(); return p.atk + (w ? w.atk : 0); }\\n    function relicAtkBonus() {\\n      var base = baseAtk(), b = 0;\\n      if (hasRelic('whetstone')) b += 2;\\n      if (hasRelic('abyssheart')) b += Math.min(20, relicSt().abyssheart || 0);\\n      if (hasRelic('greedcup')) b += Math.floor(p.gems / 10);\\n      if (hasRelic('bloodpact')) b += Math.round(base * 0.30);\\n      return b;\\n    }\\n    function totalAtk() {\\n      var b = baseAtk() + relicAtkBonus() + outfitAtk();   /* OUTFIT_v1 */\\n      var af = weaponAffix();\\n      if (af && af.id === 'sharp') b = Math.round(b * 1.20);\\n      /* 力量泉水：限时攻击加成。秒表走真实时间，到点自动摘掉，\\n         这样中途存档/读档也不会留下一个永久的假增益。 *//* BUFF_v101 */\\n      if (p.atkBuff) {\\n        if (p.atkBuff.until > Date.now()) b = Math.round(b * p.atkBuff.mul);\\n        else p.atkBuff = null;\\n      }\\n      return b;\\n    }\\n\\n\\n    /* ================= v9.0 Boss 战表现层 =================\\n       即时战斗版的 Boss 演出。原「传说之下式」方框战场已整体移除，\\n       这里用「顶部血条 + 阶段演出 + 喷吐预警 + 屏幕后期」接管表现。\\n       全部是屏幕坐标（fixed 实体），不跟相机平移。\\n       ------------------------------------------------------------------\\n       时间基准：draw 没有 dt 参数，这里自己算（上一帧到现在，夹到 50ms），\\n       否则动画速度会随帧率漂。 */\\n    var BOSSUI = {\\n      lastT: 0, shown: false, seen: false,\\n      name: '', phase: -1, phaseName: '',\\n      ghost: 1,                       /* 掉血残影（0..1 的比例，慢慢追上真实血量） */\\n      fxStart: -9, fxName: '', fxDlg: '',\\n      lastCd: -1, fireT: -9, overT: -9, deadT: -9, dangerM: null, dangerAt: -9,\\n      H: 54                           /* 血条占位高度（日志据此下移） */\\n    };\\n\\n    function bossNow() {\\n      for (var i = 0; i < mons.length; i++) if (mons[i].boss && mons[i].hp > 0) return mons[i];\\n      return null;\\n    }\\n    function bossPhaseList(m) {\\n      if (m && m.bossDef && m.bossDef.phases && m.bossDef.phases.length) return m.bossDef.phases;\\n      return [{ name: '交战', dlg: '' }];\\n    }\\n    function bossPhaseIdx(m) {\\n      var n = bossPhaseList(m).length;\\n      if (n <= 1) return 0;\\n      var r = m.maxHp > 0 ? m.hp / m.maxHp : 0;\\n      if (n === 2) return r > 0.5 ? 0 : 1;\\n      return r > 0.66 ? 0 : (r > 0.33 ? 1 : 2);\\n    }\\n    function bossDist(m) { return Math.abs(m.gx - p.gx) + Math.abs(m.gy - p.gy); }\\n\\n    function _buRR(ctx, x, y, w, h, r) {\\n      if (w < 2 * r) r = w / 2;\\n      if (h < 2 * r) r = h / 2;\\n      ctx.beginPath();\\n      ctx.moveTo(x + r, y);\\n      ctx.arcTo(x + w, y, x + w, y + h, r);\\n      ctx.arcTo(x + w, y + h, x, y + h, r);\\n      ctx.arcTo(x, y + h, x, y, r);\\n      ctx.arcTo(x, y, x + w, y, r);\\n      ctx.closePath();\\n    }\\n\\n    /* 屏幕后期：低血红边 + Boss 压迫暗角 ---------------------------------- */\\n    function drawScreenFx(ctx, now) {\\n      var ratio = p.maxHp > 0 ? (p.hp / p.maxHp) : 1;\\n      var m = bossNow();\\n      var lowA = 0;\\n      if (ratio < 0.30) {\\n        var t = (0.30 - ratio) / 0.30;                 /* 0 → 1 */\\n        var pulse = 0.55 + 0.45 * Math.sin(now * (1.6 + t * 3.2));\\n        lowA = (0.16 + t * 0.46) * pulse;\\n      }\\n      var bossA = m ? 0.30 : 0;\\n      if (lowA > 0.001) {\\n        /* 低血：四边向内的红色呼吸带（比径向渐变更容易被判读） */\\n        var edge = ctx.createLinearGradient(0, 0, 0, CH);\\n        edge.addColorStop(0, 'rgba(200,16,16,' + Math.min(0.62, lowA).toFixed(3) + ')');\\n        edge.addColorStop(0.20, 'rgba(200,16,16,0)');\\n        edge.addColorStop(0.80, 'rgba(200,16,16,0)');\\n        edge.addColorStop(1, 'rgba(200,16,16,' + Math.min(0.62, lowA).toFixed(3) + ')');\\n        ctx.save(); ctx.fillStyle = edge; ctx.fillRect(0, 0, CW, CH);\\n        var edge2 = ctx.createLinearGradient(0, 0, CW, 0);\\n        edge2.addColorStop(0, 'rgba(200,16,16,' + Math.min(0.5, lowA * 0.8).toFixed(3) + ')');\\n        edge2.addColorStop(0.16, 'rgba(200,16,16,0)');\\n        edge2.addColorStop(0.84, 'rgba(200,16,16,0)');\\n        edge2.addColorStop(1, 'rgba(200,16,16,' + Math.min(0.5, lowA * 0.8).toFixed(3) + ')');\\n        ctx.fillStyle = edge2; ctx.fillRect(0, 0, CW, CH);\\n        ctx.restore();\\n      }\\n      if (bossA <= 0.001) return;\\n      var g = ctx.createRadialGradient(CW / 2, CH / 2, Math.min(CW, CH) * 0.26,\\n                                       CW / 2, CH / 2, Math.max(CW, CH) * 0.72);\\n      g.addColorStop(0, 'rgba(0,0,0,0)');\\n      g.addColorStop(0.62, 'rgba(28,0,8,' + (bossA * 0.55).toFixed(3) + ')');\\n      g.addColorStop(1, 'rgba(28,0,8,' + bossA.toFixed(3) + ')');\\n      ctx.save();\\n      ctx.fillStyle = g;\\n      ctx.fillRect(0, 0, CW, CH);\\n      ctx.restore();\\n    }\\n\\n    /* 喷吐危险区：Boss 蓄力时把它 6 格射程画出来（世界坐标） ----------------\\n       喷吐是「距离 ≤6 就必中」，所以唯一解法是退出这个菱形。\\n       把范围画出来，玩家才看得懂「退到 7 格以外」是什么意思。 */\\n    function drawBossDanger(ctx, m, now) {\\n      var R = 6;\\n      var pulse = 0.5 + 0.5 * Math.sin(now * 8.5);\\n      ctx.save();\\n      for (var dy = -R; dy <= R; dy++) {\\n        var span = R - Math.abs(dy);\\n        var yy = m.gy + dy;\\n        if (yy < 0 || yy >= MH) continue;\\n        var x0 = Math.max(0, m.gx - span), x1 = Math.min(MW - 1, m.gx + span);\\n        if (x1 < x0) continue;\\n        ctx.fillStyle = 'rgba(255,60,30,' + (0.045 + 0.055 * pulse).toFixed(3) + ')';\\n        ctx.fillRect(x0 * TILE, yy * TILE, (x1 - x0 + 1) * TILE, TILE);\\n      }\\n      ctx.strokeStyle = 'rgba(255,96,52,' + (0.32 + 0.42 * pulse).toFixed(3) + ')';\\n      ctx.lineWidth = 1.5;\\n      ctx.beginPath();\\n      ctx.moveTo((m.gx + 0.5) * TILE, (m.gy - R) * TILE);\\n      ctx.lineTo((m.gx + R + 0.5) * TILE, (m.gy + 0.5) * TILE);\\n      ctx.lineTo((m.gx + 0.5) * TILE, (m.gy + R + 1) * TILE);\\n      ctx.lineTo((m.gx - R + 0.5) * TILE, (m.gy + 0.5) * TILE);\\n      ctx.closePath(); ctx.stroke();\\n      var bx = (m.gx + 0.5) * TILE, by = (m.gy + 0.5) * TILE;\\n      ctx.strokeStyle = 'rgba(255,116,74,' + (0.45 + 0.45 * pulse).toFixed(3) + ')';\\n      ctx.lineWidth = 2;\\n      ctx.beginPath();\\n      ctx.arc(bx, by, TILE * (0.62 + 0.14 * pulse), 0, 6.2832);\\n      ctx.stroke();\\n      ctx.restore();\\n    }\\n\\n    function drawBossUI(ctx) {\\n      var now = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;\\n      var dt = BOSSUI.lastT ? Math.min(0.05, Math.max(0, now - BOSSUI.lastT)) : 0.016;\\n      BOSSUI.lastT = now;\\n\\n      drawScreenFx(ctx, now);\\n\\n      var m = bossNow();\\n      /* ---- 无 Boss：收条 + 一次「击破」演出 ---- */\\n      if (!m) {\\n        if (BOSSUI.seen) {\\n          BOSSUI.seen = false; BOSSUI.deadT = now;\\n          if (typeof logText !== 'undefined' && logText) logText.y = 82;\\n        }\\n        BOSSUI.shown = false; BOSSUI.phase = -1; BOSSUI.ghost = 1; BOSSUI.dangerM = null;\\n        var dAge = now - BOSSUI.deadT;\\n        if (dAge >= 0 && dAge < 1.7) {\\n          var dk = dAge / 1.7;\\n          ctx.save();\\n          ctx.globalAlpha = Math.min(1, (1 - dk) * 1.6);\\n          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\\n          ctx.fillStyle = '#ffe6b0';\\n          ctx.font = 'bold 26px system-ui,sans-serif';\\n          ctx.fillText('击　破', CW / 2, CH * 0.34);\\n          ctx.fillStyle = 'rgba(255,230,176,.55)';\\n          ctx.fillRect(CW / 2 - 62 * (1 - dk), CH * 0.34 + 22, 124 * (1 - dk), 1.2);\\n          ctx.restore();\\n        }\\n        return;\\n      }\\n\\n      var d = bossDist(m);\\n      var engage = m.alerted || m.hitT > 0 || d <= 8 || BOSSUI.shown;\\n      if (!engage) { BOSSUI.shown = false; BOSSUI.dangerM = null; return; }\\n\\n      /* ---- 首次接触：入场演出 ---- */\\n      if (!BOSSUI.seen) {\\n        BOSSUI.seen = true; BOSSUI.shown = true;\\n        BOSSUI.ghost = 1; BOSSUI.phase = -1; BOSSUI.lastCd = m.cd;\\n        BOSSUI.fxStart = now; BOSSUI.fxName = bossPhaseList(m)[0].name;\\n        BOSSUI.fxDlg = bossPhaseList(m)[0].dlg || '';\\n        if (game.scene && game.scene.camera) game.scene.camera.shake(8, 0.28);\\n        vfxFlash('#ff5b3b', 0.22);\\n        if (typeof SFX !== 'undefined' && SFX.skill) SFX.skill();\\n        /* v9.3：Boss 睁眼时清场。\\n           四个角落的杂兵（尤其「夺宝贼」AI=swarm）会一路跟进 Boss 房贴脸，\\n           把 1v1 的巨眼战变成被背刺 —— CDP 实测同一份配平下，\\n           没杂兵插手掉 6.7 血/回合、被插手掉 12.3 血/回合，胜率正好掷硬币。\\n           它们本来就在别的房间，Boss 一睁眼就退回黑暗，不抢 Boss 的戏。 */\\n        var _cleared = 0;\\n        for (var _mi = mons.length - 1; _mi >= 0; _mi--) {\\n          if (!mons[_mi].boss) { mons.splice(_mi, 1); _cleared++; }\\n        }\\n        if (_cleared > 0) log('巨眼睁开，低阶的东西退回了黑暗里。', '#b7a6ff');\\n      }\\n      BOSSUI.shown = true;\\n\\n      /* ---- 阶段推进 ---- */\\n      var pi = bossPhaseIdx(m);\\n      if (pi !== BOSSUI.phase) {\\n        var pl = bossPhaseList(m);\\n        if (BOSSUI.phase >= 0) {\\n          BOSSUI.fxStart = now;\\n          BOSSUI.fxName = pl[pi] ? pl[pi].name : '';\\n          BOSSUI.fxDlg = (pl[pi] && pl[pi].dlg) || '';\\n          if (game.scene && game.scene.camera) game.scene.camera.shake(10, 0.34);\\n          vfxFlash('#ff3b2b', 0.30);\\n          if (typeof SFX !== 'undefined' && SFX.skill) SFX.skill();\\n        }\\n        BOSSUI.phase = pi;\\n        /* 阶段机制：越往后喷吐越密，单口伤害相应下调。\\n           cd 3 = 每 3 回合一口 / 2 = 每 2 回合 / 1 = 每回合。\\n           每回合压力（占体力上限，v9.3 单口基准由 14% 降到 11.5%）：\\n             phase1: 11.5%/3 + 11.5%*0.2 = 6.1%   phase2: 10.4%/3 + 2.1% = 5.5%\\n             phase3:  7.1%/1 + 1.4% = 8.5%   —— 逐阶段加压但不秒人；\\n           满血 135 时 phase3 约 11.5 血/回合，仍能撑 11 回合以上。 */\\n        var _pc = [[3, 1.00], [2, 0.90], [1, 0.62]][Math.min(pi, 2)];\\n        if (m.atk0 == null) m.atk0 = m.atk;\\n        m.fireCd = _pc[0];\\n        m.atk = Math.max(4, Math.round(m.atk0 * _pc[1]));\\n      }\\n      BOSSUI.phaseName = bossPhaseList(m)[pi].name || '';\\n\\n      /* ---- 喷吐预警 / 命中检测 ---- */\\n      if (BOSSUI.lastCd >= 0 && m.cd > BOSSUI.lastCd && BOSSUI.lastCd <= 1) {\\n        BOSSUI.fireT = now;                       /* cd 1 → 0 喷吐 → 重置 2，判断为「刚喷过」 */\\n        if (game.scene && game.scene.camera) game.scene.camera.shake(7, 0.2);\\n        if (d <= 7) vfxFlash('#ff5a4a', 0.16);\\n      }\\n      BOSSUI.lastCd = m.cd;\\n      var charging = (m.cd === 1 && d <= 6);\\n      BOSSUI.dangerM = charging ? m : null;   /* 世界层据此画射程 */\\n      BOSSUI.dangerAt = now;\\n\\n      /* ---- 掉血残影 ---- */\\n      var real = m.maxHp > 0 ? m.hp / m.maxHp : 0;\\n      if (BOSSUI.ghost < real) BOSSUI.ghost = real;\\n      else BOSSUI.ghost += (real - BOSSUI.ghost) * Math.min(1, dt * 2.6);\\n\\n      /* ================= 面板 ================= */\\n      var PAD = 10, W = CW - PAD * 2, X = PAD, Y = 80, H = BOSSUI.H;\\n      if (typeof logText !== 'undefined' && logText && logText.y !== Y + H + 6) logText.y = Y + H + 6;\\n\\n      ctx.save();\\n      /* 底板：暗玻璃 + 冷边 + 顶部血色高光 */\\n      var _sh = m.hitT > 0 ? Math.sin(now * 90) * m.hitT * 2.2 : 0;\\n      ctx.translate(_sh, 0);\\n      ctx.fillStyle = 'rgba(10,8,14,.86)';\\n      _buRR(ctx, X, Y, W, H, 9); ctx.fill();\\n      ctx.strokeStyle = charging ? 'rgba(255,90,60,' + (0.45 + 0.35 * Math.sin(now * 9)).toFixed(3) + ')'\\n                                 : 'rgba(255,120,90,.28)';\\n      ctx.lineWidth = 1; _buRR(ctx, X + 0.5, Y + 0.5, W - 1, H - 1, 9); ctx.stroke();\\n      var _hl = ctx.createLinearGradient(X, Y, X, Y + 3);\\n      _hl.addColorStop(0, 'rgba(255,120,80,.55)');\\n      _hl.addColorStop(1, 'rgba(255,120,80,0)');\\n      ctx.fillStyle = _hl;\\n      _buRR(ctx, X + 9, Y + 1, W - 18, 3, 1.5); ctx.fill();\\n\\n      /* 姓名 + 血量 */\\n      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';\\n      ctx.fillStyle = '#ffd9c8';\\n      ctx.font = 'bold 12px system-ui,-apple-system,\\\"PingFang SC\\\",sans-serif';\\n      ctx.fillText('◆ ' + m.name, X + 10, Y + 15);\\n      ctx.textAlign = 'right';\\n      ctx.font = 'bold 10px monospace';\\n      ctx.fillStyle = charging ? '#ff9a7a' : '#c9b3aa';\\n      ctx.fillText(Math.max(0, Math.ceil(m.hp)) + ' / ' + Math.ceil(m.maxHp), X + W - 10, Y + 15);\\n\\n      /* 血条 */\\n      var BX = X + 10, BW = W - 20, BY = Y + 26, BH = 9;\\n      ctx.fillStyle = 'rgba(255,255,255,.06)';\\n      _buRR(ctx, BX, BY, BW, BH, BH / 2); ctx.fill();\\n      /* 残影（掉下去的那截） */\\n      if (BOSSUI.ghost > 0.002) {\\n        ctx.fillStyle = 'rgba(255,196,150,.34)';\\n        _buRR(ctx, BX, BY, Math.max(2, BW * BOSSUI.ghost), BH, BH / 2); ctx.fill();\\n      }\\n      if (real > 0.002) {\\n        var gg = ctx.createLinearGradient(BX, BY, BX + BW, BY + BH);\\n        gg.addColorStop(0, '#8f1220');\\n        gg.addColorStop(0.55, '#d92b2b');\\n        gg.addColorStop(1, '#ff6b4a');\\n        ctx.save(); _buRR(ctx, BX, BY, BW, BH, BH / 2); ctx.clip();\\n        ctx.fillStyle = gg; ctx.fillRect(BX, BY, Math.max(2, BW * real), BH);\\n        /* 顶部高光 */\\n        ctx.fillStyle = 'rgba(255,255,255,.22)';\\n        ctx.fillRect(BX, BY, Math.max(2, BW * real), BH * 0.36);\\n        ctx.restore();\\n        /* 受击白闪 */\\n        if (m.hitT > 0) {\\n          ctx.globalAlpha = Math.min(0.75, m.hitT * 2.4);\\n          ctx.fillStyle = '#fff';\\n          _buRR(ctx, BX, BY, Math.max(2, BW * real), BH, BH / 2); ctx.fill();\\n          ctx.globalAlpha = 1;\\n        }\\n      }\\n      /* 阶段刻痕 */\\n      var np = bossPhaseList(m).length;\\n      for (var ti = 1; ti < np; ti++) {\\n        var tx = BX + BW * (ti / np);\\n        ctx.fillStyle = 'rgba(10,8,14,.85)';\\n        ctx.fillRect(tx - 1, BY - 1, 2, BH + 2);\\n      }\\n\\n      /* 阶段名（左） + 预警（右） */\\n      ctx.textAlign = 'left'; ctx.font = '9px system-ui,sans-serif';\\n      ctx.fillStyle = 'rgba(255,190,160,.85)';\\n      ctx.fillText('第 ' + (pi + 1) + ' 阶段 · ' + BOSSUI.phaseName, X + 10, Y + 43);\\n      if (charging) {\\n        ctx.textAlign = 'right';\\n        ctx.fillStyle = 'rgba(255,110,80,' + (0.55 + 0.45 * Math.sin(now * 9)).toFixed(3) + ')';\\n        ctx.font = 'bold 9px system-ui,sans-serif';\\n        ctx.fillText('⚠ 蓄力中 · 退到 7 格以外', X + W - 10, Y + 43);\\n      }\\n      ctx.restore();\\n\\n      /* ================= 阶段切换演出 ================= */\\n      var fa = now - BOSSUI.fxStart;\\n      if (fa >= 0 && fa < 2.0) {\\n        var k2 = fa / 2.0;\\n        ctx.save();\\n        /* 全屏血脉冲 */\\n        var pulseA = Math.max(0, 1 - k2 * 1.6) * 0.22;\\n        if (pulseA > 0.002) {\\n          var pg = ctx.createRadialGradient(CW / 2, CH / 2, 20, CW / 2, CH / 2, CH * 0.62);\\n          pg.addColorStop(0, 'rgba(255,40,30,0)');\\n          pg.addColorStop(1, 'rgba(255,40,30,' + pulseA.toFixed(3) + ')');\\n          ctx.fillStyle = pg; ctx.fillRect(0, 0, CW, CH);\\n        }\\n        /* 两道横扫线 */\\n        var sweep = Math.min(1, k2 * 2.2);\\n        ctx.globalAlpha = Math.max(0, 1 - k2 * 1.4);\\n        /* 压暗带：字幕要压得住地面贴图 */\\n        var _scg = ctx.createLinearGradient(0, CH * 0.28, 0, CH * 0.52);\\n        _scg.addColorStop(0, 'rgba(8,4,6,0)');\\n        _scg.addColorStop(0.42, 'rgba(8,4,6,.78)');\\n        _scg.addColorStop(1, 'rgba(8,4,6,0)');\\n        ctx.fillStyle = _scg;\\n        ctx.fillRect(0, CH * 0.28, CW, CH * 0.24);\\n        ctx.fillStyle = 'rgba(255,150,110,.75)';\\n        ctx.fillRect(0, CH * 0.40, CW * sweep, 1.4);\\n        ctx.fillRect(CW * (1 - sweep), CH * 0.40 + 34, CW * sweep, 1.4);\\n        /* 大字 */\\n        var tk = Math.min(1, fa / 0.22);\\n        var sc = 1 + (1 - tk) * 0.5;\\n        ctx.globalAlpha = Math.min(1, (1 - k2 * 1.15) * 2);\\n        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\\n        ctx.save();\\n        ctx.translate(CW / 2, CH * 0.40 - 12);\\n        ctx.scale(sc, sc);\\n        ctx.font = 'bold 22px system-ui,-apple-system,\\\"PingFang SC\\\",sans-serif';\\n        ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(14,0,0,.9)';\\n        ctx.strokeText(BOSSUI.fxName, 0, 0);\\n        ctx.fillStyle = '#ffd9c2';\\n        ctx.fillText(BOSSUI.fxName, 0, 0);\\n        ctx.restore();\\n        if (BOSSUI.fxDlg) {\\n          ctx.font = '11px system-ui,-apple-system,\\\"PingFang SC\\\",sans-serif';\\n          ctx.globalAlpha = Math.min(1, (1 - k2 * 1.15) * 1.6);\\n          ctx.lineWidth = 3; ctx.strokeStyle = 'rgba(10,0,0,.85)';\\n          ctx.strokeText(BOSSUI.fxDlg.slice(0, 26), CW / 2, CH * 0.40 + 14);\\n          ctx.fillStyle = 'rgba(255,232,218,.95)';\\n          ctx.fillText(BOSSUI.fxDlg.slice(0, 26), CW / 2, CH * 0.40 + 14);\\n        }\\n        ctx.restore();\\n      }\\n\\n      /* ================= 喷吐命中：横排冲击 ================= */\\n      var fr = now - BOSSUI.fireT;\\n      if (fr >= 0 && fr < 0.45) {\\n        var fk = 1 - fr / 0.45;\\n        ctx.save();\\n        ctx.globalAlpha = fk * 0.5;\\n        var bgg = ctx.createLinearGradient(0, CH * 0.42, 0, CH * 0.58);\\n        bgg.addColorStop(0, 'rgba(255,90,50,0)');\\n        bgg.addColorStop(0.5, 'rgba(255,120,60,.85)');\\n        bgg.addColorStop(1, 'rgba(255,90,50,0)');\\n        ctx.fillStyle = bgg;\\n        ctx.fillRect(0, CH * 0.42, CW, CH * 0.16 * fk);\\n        ctx.restore();\\n      }\\n\\n      ctx.textAlign = 'left'; ctx.textBaseline = 'top';\\n    }\\n\\n    /* ================= 启动 ================= */\\n    msgLines = [];\\n    floorNo = 1; over = false; won = false;\\n    genLevel();\\n    layout();\\n    scene.camera.setBounds(0, 0, MW * TILE, MH * TILE);\\n\\n    /* MOVEFEEL_v1：相机跟随改成 dt 归一化。\\n       引擎里 `this.x = lerp(this.x, 目标, this.lerpRate)` 的 lerpRate 是**每帧**系数，\\n       60fps 和 30fps 下同一个 0.12 会差出一倍的时间常数（131ms vs 262ms）——\\n       低帧率机器上就显得黏、跟不上人。这里换算成按时间的等价系数。\\n       0.12 -> 0.22：τ 从 131ms 收到 67ms，跟得紧但不硬。\\n       不改引擎（它在 index.html 顶部），只在实例上包一层。 */\\n    (function () {\\n      var _cam = scene.camera;\\n      if (!_cam || typeof _cam.update !== 'function') return;\\n      var _camUpd = _cam.update;\\n      var _baseRate = 0.22;\\n      _cam.update = function (dt) {\\n        var keep = this.lerpRate;\\n        /* dt*60 = 这一帧相当于几个「60fps 帧」 */\\n        this.lerpRate = 1 - Math.pow(1 - _baseRate, Math.max(1, (dt || 0.01667) * 60));\\n        try { return _camUpd.call(this, dt); }\\n        finally { this.lerpRate = keep; }\\n      };\\n    })();\\n    game.start(scene);\\n    snapToPlayer();\\n    log('深渊之底 v13 · 方向键/WASD 移动，撞怪即攻击，踩木梯下一层。', '#9fd8ff');\\n    log('Q/E 换武器 · 1-6 放技能（Shift+数字 直选武器）· K 存档 L 读档'\\n        + (_PCM ? ' · F 全屏' : '') + '。', '#9aa8bd');\\n    log('目标：闯过 3 章共 ' + MAX_FLOOR + ' 段，打倒「无光之母」。', '#c9a0ff');\\n    titleInit();   /* v3：先进标题页（继续 / 新游戏） */\\n    /* STARTPARAM_v1：开始界面（新网页）带 ?start=1 进来就跳过标题页。\\n       有存档接着上次，没存档开新局 —— 两条都走标题页原本的同一条代码路径。 */\\n    if (/[?&]start=1(&|$)/.test(String(location.search))) {\\n      titleOpen = false;\\n      if (hasSave()) { loadGame(); }\\n      else { restart(); storyOnEnter(1); }\\n    }\\n\\n    /* ================= 无头验证钩子 ================= */\\n    function seenStoryToTest(f) { return STORY[f] ? false : false; }\\n    global.__GAME = game;\\n    global.__ROGUE = {\\n      version: '12.0.0',  /* TITLEMETA_v1 同步：3 章 18 段 版本号不再是 9.x */\\n      levels: LEVELS.length,\\n      /* ---- v5.0 章节接口 ---- */\\n      maxFloor: MAX_FLOOR,\\n      themes: (function () { var o = {}; for (var k in THEMES) if (THEMES.hasOwnProperty(k)) o[k] = THEMES[k].name; return o; })(),\\n      /* PCHUD_v1：电脑横屏版技能条（手机端返回 null） */\\n      pcSkillBar: function () { return _PCM ? pcSkillPub() : null; },\\n      /* PCHUD_v1：电脑端设置面板自检（canvas 那块，不是 DOM 卡片） */\\n      pcMenu: function () {\\n        var g = CFG_LAY(), dom = false;\\n        try {\\n          var r = document.querySelector('.mroot');\\n          dom = !!(r && r.style.display !== 'none' && r.querySelector('.mtitle'));\\n        } catch (e) { }\\n        return { open: !!CFG.open, domCard: dom, y: g.y, h: g.h, ch: CH,\\n                 fits: (g.y + g.h) <= CH, items: CFG_ITEMS.length, help: !!CFG.help,\\n                 helpRows: CFG_HELP.length, helpText: CFG_HELP.map(function (r) { return r[0] + '=' + r[1]; }).join('|'),\\n                 helpRowH: (typeof window !== 'undefined' && window.__HELPY) ? window.__HELPY.rowH : null,\\n                 helpLastY: (typeof window !== 'undefined' && window.__HELPY) ? window.__HELPY.lastY : null };\\n      },\\n      /* PCHUD_v1：全屏绑定自检。headless 里 requestFullscreen 常被拒，\\n         所以除了 supported/on，再报一个按键计数 —— 计数在涨就说明真的绑上了。 */\\n      pcFullscreen: function () {\\n        var d = (typeof document !== 'undefined') ? document : null;\\n        return { supported: !!(d && d.documentElement && d.documentElement.requestFullscreen),\\n                 on: !!(d && d.fullscreenElement), presses: _fsPress, pcm: _PCM };\\n      },\\n      /* PCHUD_v2：相机/出生点诊断。玩家贴地图边缘时相机会被夹住，\\n         人就偏在屏幕一角 —— 这是夹边界的正常结果，不是绘制偏移。用数字说清。 */\\n      pcCamera: function () {\\n        var cam = scene.camera, t = TILE;\\n        return { cw: CW, ch: CH, tile: t, mw: MW, mh: MH,\\n                 ox: Math.round(cam.ox || 0), oy: Math.round(cam.oy || 0),\\n                 gx: p.gx, gy: p.gy,\\n                 sx: Math.round(p.gx * t - (cam.ox || 0)), sy: Math.round(p.gy * t - (cam.oy || 0)),\\n                 cx: Math.round(CW / 2), cy: Math.round(CH / 2),\\n                 mapPxW: MW * t, mapPxH: MH * t,\\n                 clampedX: (cam.ox || 0) <= 0 || (cam.ox || 0) >= MW * t - CW,\\n                 clampedY: (cam.oy || 0) <= 0 || (cam.oy || 0) >= MH * t - CH };\\n      },\\n      /* PCHUD_v2：脚下地形快照。出生点被塞进 1 格石缝这种事，只有把邻域打出来才看得见。\\n         '.' 地板  '>' 木梯  '#' 墙  ' ' 岩层  '@' 玩家 */\\n      pcMapProbe: function (rr) {\\n        rr = rr || 4;\\n        var rows = [], legs = [];\\n        for (var dy = -rr; dy <= rr; dy++) {\\n          var line = '', leg = '';\\n          for (var dx = -6; dx <= 6; dx++) {\\n            var x = p.gx + dx, y = p.gy + dy;\\n            if (dx === 0 && dy === 0) { line += '@'; leg += '@'; continue; }\\n            var t = tileAt(x, y);\\n            line += (t === FLOOR) ? '.' : (t === STAIRS ? '>' : (t === WALL ? '#' : (t === ROCK ? ' ' : '?')));\\n            leg += walkable(x, y) ? '1' : '0';\\n          }\\n          rows.push(line); legs.push(leg);\\n        }\\n        /* 从脚下 4 邻域能走到多少格（连通域大小）—— 1 就是被砌死在石缝里 */\\n        var seen = {}, q = [[p.gx, p.gy]], n = 0, mnx = p.gx, mxx = p.gx, mny = p.gy, mxy = p.gy;\\n        seen[p.gx + ',' + p.gy] = 1;\\n        var dirs = [[1,0],[-1,0],[0,1],[0,-1]];\\n        while (q.length && n < 60000) {\\n          var c = q.shift(); n++;\\n          if (c[0] < mnx) mnx = c[0]; if (c[0] > mxx) mxx = c[0];\\n          if (c[1] < mny) mny = c[1]; if (c[1] > mxy) mxy = c[1];\\n          for (var i = 0; i < 4; i++) {\\n            var nx = c[0] + dirs[i][0], ny = c[1] + dirs[i][1], kk = nx + ',' + ny;\\n            if (seen[kk] || nx < 0 || ny < 0 || nx >= MW || ny >= MH) ec, buffed: buffed };\\n      },\\n      /* 强制切到某段的机制（验收用，不挪玩家） */\\n      forceMod: function (id) {\\n        FLOORG.mod = modById(id || 'none');\\n        if (FLOORG.mod.id === 'blood') applyBloodBuff();\\n        return this.modState();\\n      },\\n      secState: function () {\\n        return { sec: chap.idx, lastSec: lastSec, floor: floorNo,\\n                 mw: MW, mh: MH, secW: SEC_W, secH: SEC_H, gap: SEC_GAP,\\n                 cols: BIG_COLS, rows: BIG_ROWS,\\n                 worldW: MW * TILE, worldH: MH * TILE,\\n                 rooms: rooms.length, mons: mons.length };\\n      },\\n      /* Boss 皮肤命中诊断：哪一层该用哪张手绘图、两张图各自加载好没有。\\n         img 是 {p1,p2} 对象 —— 早先按单图读 .complete 会恒为 false，别再犯。 */\\n      bossArt: function () {\\n        var out = [];\\n        for (var i = 0; i < mons.length; i++) {\\n          var q = mons[i]; if (!q.boss) continue;\\n          var sk = bossSkin(q), im = sk && sk.img;\\n          var a = im && im.p1, b = im && im.p2;\\n          out.push({ name: q.name, floor: floorNo,\\n                     hasSkin: !!sk, art: sk ? (sk.img ? 'hand' : 'sprite') : 'none',\\n                     p1ok: !!(a && a.complete && a.width), p1w: a ? a.width : -1,\\n                     p2ok: !!(b && b.complete && b.width), p2w: b ? b.width : -1,\\n                     stage: q.maxHp > 0 ? +(q.hp / q.maxHp).toFixed(3) : -1 });\\n        }\\n        return out;\\n      },\\n      chapterId: function () { return chap.id; },\\n      chapterIdx: function () { return chap.idx; },\\n      themeName: function () { return chap.theme ? chap.theme.name : null; },\\n      themeCols: function () { return SHEET_COLS; },\\n      sheetIs: function () {\\n        if (!sheets) return null;\\n        return (sheet === sheets.ch1 ? 'ch1' : (sheet === sheets.ch2 ? 'ch2' : (sheet === sheets.ch3 ? 'ch3' : '?')));\\n      },\\n      waterCount: function () { return water.length; },\\n      lightCount: function () { return lights.length; },\\n      /* GODFIX_v1：无敌是否真的挡住所
