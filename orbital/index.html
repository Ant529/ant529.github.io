<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>ORBITAL</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  background:#07070d;color:#eef0ff;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  user-select:none;
}
canvas{display:block;touch-action:none;max-width:100vw;max-height:100vh}
.hud{
  position:fixed;top:0;left:0;right:0;padding:14px 20px;
  display:flex;gap:22px;align-items:center;justify-content:space-between;
  pointer-events:none;z-index:9;
  background:linear-gradient(180deg,rgba(0,0,0,.55),transparent);
}
.hud__l{display:flex;gap:22px;align-items:baseline}
.stat{display:flex;flex-direction:column;gap:1px}
.stat__k{font-size:10px;letter-spacing:.14em;color:rgba(255,255,255,.42);text-transform:uppercase}
.stat__v{font-size:20px;font-weight:700;letter-spacing:.02em;
  font-variant-numeric:tabular-nums;text-shadow:0 0 16px currentColor}
.exit{pointer-events:auto;font-size:12px;color:rgba(255,255,255,.62);
  text-decoration:none;border:1px solid rgba(255,255,255,.2);
  padding:6px 14px;border-radius:99px;backdrop-filter:blur(8px);
  background:rgba(255,255,255,.04);transition:.2s}
.exit:hover{color:#fff;border-color:rgba(255,255,255,.5)}
.tip{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
  font-size:12px;color:rgba(255,255,255,.5);letter-spacing:.06em;
  text-align:center;pointer-events:none;z-index:9;
  background:rgba(0,0,0,.35);padding:7px 18px;border-radius:99px;
  backdrop-filter:blur(8px);white-space:nowrap;
}
.overlay{
  position:fixed;inset:0;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:18px;z-index:20;
  background:radial-gradient(circle at 50% 45%,rgba(20,16,40,.82),rgba(4,4,10,.96));
  backdrop-filter:blur(6px);
}
.overlay.hide{display:none}
.overlay__t{font-size:34px;font-weight:800;letter-spacing:.16em;
  background:linear-gradient(92deg,#ffcc33,#ff6ec7 50%,#4de2ff);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.overlay__s{font-size:13px;color:rgba(255,255,255,.6);letter-spacing:.1em;text-align:center;line-height:1.9}
.btn{pointer-events:auto;border:0;cursor:pointer;font-family:inherit;
  font-size:14px;font-weight:700;letter-spacing:.14em;color:#fff;
  padding:13px 44px;border-radius:99px;
  background:linear-gradient(92deg,#ff6ec7,#8b5cf6);
  box-shadow:0 10px 36px rgba(255,110,199,.34);transition:.18s}
.btn:hover{transform:translateY(-2px);filter:brightness(1.12)}
</style>
</head>
<body>
<div class="hud">
  <div class="hud__l"><div class="stat"><span class="stat__k">SCORE</span><span class="stat__v" id="sc" style="color:#4de2ff">0</span></div><div class="stat"><span class="stat__k">WAVE</span><span class="stat__v" id="wv" style="color:#ffcc33">1</span></div><div class="stat"><span class="stat__k">LIFE</span><span class="stat__v" id="lf" style="color:#ff6ec7">3</span></div></div>
  <a class="exit" href="../../index.html">&#8592; 返回</a>
</div>
<canvas id="cv"></canvas>
<div class="tip">移动躲避 · 自动射击 · 越久越难</div>
<div class="overlay" id="ov">
  <div class="overlay__t">ORBITAL</div>
  <div class="overlay__s">鼠标 / 触摸移动 &nbsp;·&nbsp; 自动开火<br>躲开粉红色，打爆它们</div>
  <button class="btn" id="go">开始</button>
</div>
<script>

var cv=document.getElementById('cv'),g=cv.getContext('2d');
var W,H,DPR;
function fit(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';
}
addEventListener('resize',fit); fit();
var S=Math.min(W,H)/900;
var ship,enemies,bullets,parts,stars,score,wave,lives,run,tSpawn,tWave,shake,combo,cT;
function bg(){
  stars=[];
  for(var i=0;i<170;i++)stars.push({x:Math.random()*W,y:Math.random()*H,
    z:Math.random()*1.6+.25,r:Math.random()*1.9+.3});
}
function reset(){
  ship={x:W/2,y:H*0.72,tx:W/2,ty:H*0.72,r:15*S,cool:0};
  enemies=[];bullets=[];parts=[];
  score=0;wave=1;lives=3;run=true;
  tSpawn=0;tWave=0;shake=0;combo=1;cT=0;
  bg(); sync();
}
function sync(){
  document.getElementById('sc').textContent=score;
  document.getElementById('wv').textContent=wave;
  document.getElementById('lf').textContent=lives;
}
function burst(x,y,col,n,pw){
  for(var i=0;i<n;i++){
    var a=Math.random()*6.283, sp=(Math.random()*pw+pw*0.22);
    parts.push({x:x,y:y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
      life:1,dec:0.012+Math.random()*0.02,r:(Math.random()*3.4+1.1)*S,col:col});
  }
}
function spawnEnemy(){
  var side=Math.random()<0.5;
  var x=side?-40*S:W+40*S;
  var y=Math.random()*H*0.62+H*0.06;
  var fast=Math.random()<Math.min(0.15+wave*0.055,0.62);
  var ang=Math.atan2(ship.y-y, ship.x-x);
  var sp=(fast?260:130)*S*(1+wave*0.045);
  enemies.push({x:x,y:y,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,
    r:(fast?11:16)*S,hp:fast?1:(wave>4?2:1),fast:fast,
    spin:Math.random()*6.283});
}
function step(dt){
  if(!run)return;
  tSpawn-=dt;
  var rate=Math.max(0.19, 0.86-wave*0.052);
  if(tSpawn<=0){spawnEnemy();tSpawn=rate;}
  tWave+=dt;
  if(tWave>7.5){tWave=0;wave++;sync();}
  cT+=dt; if(cT>2.6){cT=0;combo=1;}
  ship.x+=(ship.tx-ship.x)*Math.min(1,dt*13);
  ship.y+=(ship.ty-ship.y)*Math.min(1,dt*13);
  ship.cool-=dt;
  if(ship.cool<=0){
    ship.cool=0.115;
    bullets.push({x:ship.x,y:ship.y-ship.r,vx:0,vy:-780*S});
    parts.push({x:ship.x+(Math.random()-.5)*6*S,y:ship.y+ship.r*0.7,
      vx:(Math.random()-.5)*30*S,vy:180*S,life:1,dec:0.05,r:2.1*S,col:'120,220,255'});
  }
  for(var i=bullets.length-1;i>=0;i--){
    var b=bullets[i]; b.y+=b.vy*dt;
    if(b.y<-20*S)bullets.splice(i,1);
  }
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(!e.fast){
      var a=Math.atan2(ship.y-e.y,ship.x-e.x);
      e.vx+=Math.cos(a)*46*S*dt; e.vy+=Math.sin(a)*46*S*dt;
      var sp2=Math.hypot(e.vx,e.vy), mx=(150+wave*9)*S;
      if(sp2>mx){e.vx=e.vx/sp2*mx;e.vy=e.vy/sp2*mx;}
    }
    e.x+=e.vx*dt; e.y+=e.vy*dt; e.spin+=dt*1.7;
    var killed=false;
    for(var j=bullets.length-1;j>=0;j--){
      var bb=bullets[j];
      if(Math.hypot(bb.x-e.x,bb.y-e.y)<e.r+5*S){
        bullets.splice(j,1); e.hp--;
        burst(bb.x,bb.y,'255,204,51',9,200*S);
        if(e.hp<=0){
          burst(e.x,e.y, e.fast?'255,110,199':'120,220,255', 26, 340*S);
          score+=e.fast?25:12; combo++; cT=0;
          sync(); shake=Math.min(shake+3.4*S,9*S);
          killed=true;
        }
        break;
      }
    }
    if(killed){enemies.splice(i,1);continue;}
    if(Math.hypot(e.x-ship.x,e.y-ship.y)<e.r+ship.r){
      enemies.splice(i,1);
      burst(e.x,e.y,'255,80,80',34,420*S);
      lives--; sync(); shake=13*S;
      if(lives<=0){run=false; die(); return;}
    }
    if(e.x<-90*S||e.x>W+90*S||e.y<-90*S||e.y>H+90*S)enemies.splice(i,1);
  }
  for(var i=parts.length-1;i>=0;i--){
    var p=parts[i];
    p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.965; p.vy*=0.965;
    p.life-=p.dec;
    if(p.life<=0)parts.splice(i,1);
  }
  for(var i=0;i<stars.length;i++){
    var s=stars[i]; s.y+=s.z*46*S*dt;
    if(s.y>H){s.y=-3;s.x=Math.random()*W;}
  }
  if(shake>0)shake=Math.max(0,shake-dt*26*S);
}
function die(){
  burst(ship.x,ship.y,'255,110,199',60,520*S);
  document.getElementById('ov').classList.remove('hide');
  document.querySelector('.overlay__t').textContent='GAME OVER';
  document.querySelector('.overlay__s').innerHTML=
    '得分 <b style="color:#4de2ff;font-size:20px">'+score+'</b><br>撑到第 '+wave+' 波';
  document.getElementById('go').textContent='再来一局';
}
function draw(){
  g.save();
  if(shake>0)g.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
  var grd=g.createRadialGradient(W/2,H*0.45,0,W/2,H*0.45,Math.max(W,H)*0.78);
  grd.addColorStop(0,'#141030'); grd.addColorStop(0.5,'#0a0a18'); grd.addColorStop(1,'#05050c');
  g.fillStyle=grd; g.fillRect(-40,-40,W+80,H+80);
  for(var i=0;i<stars.length;i++){
    var s=stars[i];
    g.globalAlpha=0.22+s.z*0.44; g.fillStyle='#9fd8ff';
    g.beginPath();g.arc(s.x,s.y,s.r*s.z*S,0,6.283);g.fill();
  }
  g.globalAlpha=1;
  g.strokeStyle='rgba(120,90,255,.09)';g.lineWidth=1;
  for(var x=0;x<W;x+=70*S){g.beginPath();g.moveTo(x,0);g.lineTo(x,H);g.stroke();}
  for(var y=0;y<H;y+=70*S){g.beginPath();g.moveTo(0,y);g.lineTo(W,y);g.stroke();}
  g.globalCompositeOperation='lighter';
  for(var i=0;i<parts.length;i++){
    var p=parts[i];
    g.globalAlpha=p.life; g.fillStyle='rgba('+p.col+',1)';
    g.shadowBlur=14*S; g.shadowColor='rgba('+p.col+',.9)';
    g.beginPath();g.arc(p.x,p.y,p.r*p.life,0,6.283);g.fill();
  }
  g.shadowBlur=0;g.globalAlpha=1;
  for(var i=0;i<bullets.length;i++){
    var b=bullets[i];
    var lg=g.createLinearGradient(b.x,b.y,b.x,b.y+34*S);
    lg.addColorStop(0,'rgba(120,240,255,0)');
    lg.addColorStop(1,'rgba(120,240,255,.95)');
    g.strokeStyle=lg; g.lineWidth=3.4*S; g.lineCap='round';
    g.shadowBlur=16*S; g.shadowColor='#4de2ff';
    g.beginPath();g.moveTo(b.x,b.y);g.lineTo(b.x,b.y+34*S);g.stroke();
  }
  g.shadowBlur=0;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    var col=e.fast?'255,110,199':'120,220,255';
    g.save(); g.translate(e.x,e.y); g.rotate(e.spin);
    g.shadowBlur=24*S; g.shadowColor='rgba('+col+',1)';
    g.strokeStyle='rgba('+col+',1)'; g.lineWidth=2.6*S;
    g.fillStyle='rgba('+col+',.16)';
    g.beginPath();
    var n=e.fast?3:6;
    for(var k=0;k<n;k++){
      var a=k/n*6.283, rr2=e.r*(k%2&&n>3?0.62:1);
      if(k)g.lineTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
      else g.moveTo(Math.cos(a)*rr2,Math.sin(a)*rr2);
    }
    g.closePath(); g.fill(); g.stroke();
    g.beginPath();g.arc(0,0,e.r*0.34,0,6.283);
    g.fillStyle='rgba('+col+',.85)';g.fill();
    g.restore();
  }
  g.shadowBlur=0;
  g.save(); g.translate(ship.x,ship.y);
  g.shadowBlur=30*S; g.shadowColor='#4de2ff';
  var fl=0.7+Math.random()*0.5;
  var fg=g.createLinearGradient(0,ship.r*0.5,0,ship.r*0.5+30*S*fl);
  fg.addColorStop(0,'rgba(120,240,255,.9)');
  fg.addColorStop(1,'rgba(120,240,255,0)');
  g.fillStyle=fg;
  g.beginPath();g.moveTo(-6*S,ship.r*0.5);g.lineTo(6*S,ship.r*0.5);
  g.lineTo(0,ship.r*0.5+30*S*fl);g.closePath();g.fill();
  g.fillStyle='rgba(120,240,255,.9)';
  g.beginPath();g.moveTo(0,-ship.r*1.5);
  g.lineTo(ship.r,ship.r*0.9);g.lineTo(0,ship.r*0.42);
  g.lineTo(-ship.r,ship.r*0.9);g.closePath();g.fill();
  g.strokeStyle='#eafcff';g.lineWidth=1.7*S;g.stroke();
  g.restore();
  g.shadowBlur=0;
  g.globalCompositeOperation='source-over';
  if(combo>2){
    g.fillStyle='rgba(255,204,51,'+Math.min(1,cT*2.6)+')';
    g.font='bold '+(15*S+8)+'px -apple-system,sans-serif';
    g.textAlign='center';
    g.fillText('x'+combo, ship.x, ship.y-42*S);
  }
  g.restore();
}
var last=0;
function loop(t){
  var dt=Math.min(0.05,(t-last)/1000); last=t;
  step(dt); draw(); requestAnimationFrame(loop);
}
function pointer(cx,cy){ ship.tx=cx*DPR; ship.ty=cy*DPR; }
addEventListener('mousemove',function(e){pointer(e.clientX,e.clientY)});
addEventListener('touchmove',function(e){
  e.preventDefault(); pointer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:false});
addEventListener('touchstart',function(e){
  pointer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
document.getElementById('go').addEventListener('click',function(){
  document.getElementById('ov').classList.add('hide'); reset();
});
reset(); run=false;
requestAnimationFrame(loop);

</script>

<!-- GOBAgame publisher splash (auto-injected) -->
<div id="__goba_splash" style="position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;background:#0e0f13;pointer-events:none;transition:opacity .55s ease;opacity:1"><img src="../../assets/img/gobagame-white.png" alt="GOBAgame" style="width:min(46vw,300px);height:auto;opacity:.92"></div>
<script>(function(){var e=document.getElementById('__goba_splash');if(!e)return;var t=0;function hide(){if(t)return;t=1;e.style.opacity='0';setTimeout(function(){if(e.parentNode)e.parentNode.removeChild(e);},700);}window.addEventListener('load',function(){setTimeout(hide,1600);});setTimeout(hide,5000);})();</script>
</body>
</html>
