aw = function (ctx) {\\n      ctx.fillStyle = 'rgba(4,6,12,.86)'; ctx.fillRect(0, 0, CW, CH);\\n      ctx.fillStyle = 'rgba(255,255,255,.06)'; ctx.fillRect(0, CH / 2 - 92, CW, 184);\\n    };\\n    scene.add(overlayBg);\\n\\n    function showOverlay(title, sub, color, hint) {\\n      overlayBg.visible = true;\\n      overlayText.visible = true; overlayText.text = title; overlayText.color = color || '#fff';\\n      overlayText.x = CW / 2; overlayText.y = CH / 2 - 52;\\n      overlaySub.visible = true;\\n      overlaySub.text = sub + '\\\\n\\\\n按 ↺ 或 R ' + (hint || '重新开始');\\n      overlaySub.x = CW / 2; overlaySub.y = CH / 2 - 10;\\n    }\\n\\n    /* ---- 屏幕按钮 ---- */\\n    /* v3.2.7：按钮统一用「深底 + 半透明强调色」提高对比度，在地图上看得清 */\\n    var K = 'rgba(24,30,44,.72)';\\n    /* ===== 手机触控按钮布局 v3.2.4 =====\\n       画布 360 宽，右侧用「三列」排布，列间留 6px 空隙，绝不重叠：\\n\\n         列C(最右)  right:14   size 42   ← 等 / ↺\\n         列B(中间)  right:72   size 44   ← 换 / 存 / 读\\n         列A(最左)  right:132  size 38   ← 技能 1..6（两列三行）\\n\\n       占位验算（x 从右边界算起）：\\n         列C: 14 ~ 56     列B: 72 ~ 116    列A: 132 ~ 208（技能两列再右移）\\n       互不相交 ✅；纵向各列自 bottom 起递增，同样错开 ✅ */\\n    function padBtn(label, o) {\\n      var b = game.input.addButton(label, o);\\n      /* 引擎的 addButton 返回 {down,justDown}，DOM 元素只在它闭包里。\\n         这里从 uiLayer 末尾反查刚插入的元素并打标记，供 setPadVisible 使用。 */\\n      try {\\n        var layer = game.uiLayer, el = layer && layer.lastElementChild;\\n        if (el) el._padBtn = true;\\n      } catch (e) {}\\n      return b;\\n    }\\n\\n    /* ===== v3.2.7 布局（360x640 设计稿，CDP 实测零重叠）=====\\n       横向分区：摇杆 4..152 │ 空档 152..224 │ 技能 224..300 │ 功能 306..350 */\\n\\n    /* --- 左侧摇杆（十字，48px 键 + 6px 间隙，验算零重叠） --- */\\n    padBtn('▲', { bottom: 130, left: 58,  size: 48, color: K });\\n    padBtn('◀', { bottom: 76,  left: 4,   size: 48, color: K });\\n    padBtn('▶', { bottom: 76,  left: 112, size: 48, color: K });\\n    padBtn('▼', { bottom: 22,  left: 58,  size: 48, color: K });\\n\\n    /* --- 技能键 1..N：两列三行，占 x 224..300（right:60 起） --- */\\n    var SK_COL_W = 40, SK_ROW_H = 40, SK_X0 = 60, SK_Y0 = 14;\\n    for (var sb = 0; sb < SKILLS.length; sb++) {\\n      var sc = sb % 2, sr = Math.floor(sb / 2);\\n      padBtn(String(sb + 1), {\\n        bottom: SK_Y0 + sr * SK_ROW_H,\\n        right: SK_X0 + sc * SK_COL_W,\\n        size: 36,\\n        color: 'rgba(30,60,120,.82)'\\n      });\\n    }\\n\\n    /* --- 功能列：最右一列（x 306..350），自下而上 换/存/读/等/↺ --- */\\n    padBtn('换', { bottom: 14,  right: 10, size: 44, color: 'rgba(120,80,20,.82)' });\\n    padBtn('存', { bottom: 62,  right: 10, size: 44, color: 'rgba(20,90,60,.82)' });\\n    padBtn('读', { bottom: 110, right: 10, size: 44, color: 'rgba(80,45,130,.82)' });\\n    padBtn('等', { bottom: 158, right: 10, size: 44, color: K });\\n    padBtn('↺',  { bottom: 206, right: 10, size: 44, color: K });\\n\\n    /* --- 统一显隐：标题页/剧情页/结束页时把右下功能键藏起来 ---\\n       避免按钮压在标题文字、剧情文本上（截图中就是这么糊成一片的）。 */\\n    function setPadVisible(on) {\\n      /* v6.0 修：原来遍历 game.input.buttons 找 .el，但引擎返回的对象只有\\n         {down,justDown}，.el 恒为 undefined —— 触控键从来没被真正隐藏过\\n         （标题页 / 剧情页 / 结束页都能看到按钮压在文字上）。\\n         改为遍历 uiLayer，只动打过 _padBtn 标记的元素。 */\\n      try {\\n        var layer = game.uiLayer;\\n        if (!layer || !layer.children) return;\\n        for (var i = 0; i < layer.children.length; i++) {\\n          var el = layer.children[i];\\n          if (!el._padBtn) continue;\\n          el.style.display = on ? 'flex' : 'none';\\n        }\\n      } catch (e) {}\\n    }\\n    /* v3.2.5：每帧统一算一次「触控键该不该显示」。\\n       全屏遮罩类界面（标题/剧情/结束）隐藏触控键 —— 那里按钮只会挡住文字。 */\\n    var _padOn = null;\\n    function syncPad() {\\n      var blocked = titleOpen || storyOpen || over || CFG.open || CHEAT.on || Choice.on;\\n      var want = !blocked;\\n      if (want === _padOn) return;      /* 状态没变就不碰 DOM，省开销 */\\n      _padOn = want;\\n      setPadVisible(want);\\n    }\\n\\n    /* ================= v3.0 标题页（继续 / 新游戏） ================= */\\n    var titleOpen = false, titleIdx = 0;\\n    var TITLE_ITEMS = ['继续游戏', '新的深渊'];\\n    function titleInit() {\\n      titleOpen = true;\\n      /* v9.4：无存档时不再摆一行「继续游戏（无存档）」的死项 ——\\n         那是点得动但只会开新局的假菜单。有存档才给两项。 */\\n      TITLE_ITEMS = hasSave() ? ['继续游戏', '新的深渊'] : ['新的深渊'];\\n      titleIdx = 0;\\n    }\\n    function updateTitle(dt) {\\n      var inp = game.input;\\n      var canLoad = hasSave();\\n      if (inp.justPressed('up') || inp.justPressed('KeyW')) { titleIdx = Math.max(0, titleIdx - 1); SFX.step(); }\\n      if (inp.justPressed('down') || inp.justPressed('KeyS')) { titleIdx = Math.min(TITLE_ITEMS.length - 1, titleIdx + 1); SFX.step(); }\\n      if (inp.justPressed('space') || inp.justPressed('Enter') || inp.pointer.justDown) {\\n        SFX.shop();\\n        if (titleIdx === 0 && canLoad) { titleOpen = false; loadGame(); }\\n        else { titleOpen = false; restart(); storyOnEnter(1); }\\n      }\\n    }\\n    /* ================= 面板皮肤（UI_SKIN） =================\\n       用户手绘样图：纯紫平涂 + 粗黑描边 + 方角。整个 UI 只认这两个颜色。\\n       U = 4：外框 2U=8px、条框 1U=4px（360 宽画布上的取值，见 inject_uiskin.py 注释）。\\n       panelFrame 画「黑底整块 + 紫底内缩 2U」，就是样图那个粗黑外框。 */\\n    var UI_SKIN = { U: 4, ink: '#000000', fill: '#6F3CDB', text: '#ffffff', sub: '#E2D5FF', dim: '#4E2A97' };\\n\\n    function uiPanel(ctx, x, y, w, h) {\\n      var U = UI_SKIN.U;\\n      ctx.fillStyle = UI_SKIN.ink; ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = UI_SKIN.fill; ctx.fillRect(x + U * 2, y + U * 2, w - U * 4, h - U * 4);\\n    }\\n    /* 样图里那两根「黑框条」：1U 黑边 + 紫内填；sel=true 时整条反成黑底 */\\n    function uiBar(ctx, x, y, w, h, sel) {\\n      var U = UI_SKIN.U;\\n      ctx.fillStyle = UI_SKIN.ink; ctx.fillRect(x, y, w, h);\\n      ctx.fillStyle = sel ? UI_SKIN.ink : UI_SKIN.fill;\\n      ctx.fillRect(x + U, y + U, w - U * 2, h - U * 2);\\n    }\\n    /* 带黑描边的白字（像素 UI 的惯用手法：偏移 2px 的硬阴影，不用模糊） */\\n    function uiText(ctx, s, x, y, font, color, shadow) {\\n      ctx.font = font;\\n      if (shadow) { ctx.fillStyle = UI_SKIN.ink; ctx.fillText(s, x + 2, y + 2); }\\n      ctx.fillStyle = color; ctx.fillText(s, x, y);\\n    }\\n\\n    function drawTitle(ctx) {\\n      if (!titleOpen) return;\\n      var U = UI_SKIN.U, PAD = U * 4;\\n      /* 纯黑底（原来是 #04060c + 径向光，跟样图的平涂不是一个路子） */\\n      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, CW, CH);\\n\\n      /* 面板：宽 328（左右各留 16），高度按菜单项数自适应 ——\\n         固定 500 高时，没存档只有一条「新的深渊」，下面会空出一大片紫，很怪。 */\\n      var px = 16, pw = CW - 32;\\n      var _menuH = 166 + TITLE_ITEMS.length * 58;   /* 面板顶 -> 菜单条底（含最后一条的间距） */\\n      var ph = Math.max(340, _menuH + 118);          /* +118 = 底部三行提示占的高度 */\\n      var py = Math.round((CH - ph) / 2);\\n      uiPanel(ctx, px, py, pw, ph);\\n\\n      var ix = px + PAD, iw = pw - PAD * 2, cx = CW / 2;\\n      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';\\n\\n      /* 标题 / 副标题 / 存档行 */\\n      uiText(ctx, '深 渊 回 响', cx, py + 78, 'bold 30px monospace', UI_SKIN.text, true);\\n      uiText(ctx, 'v9 · 四章 · 48 层', cx, py + 104, 'bold 11px monospace', UI_SKIN.sub, false);\\n      var inf = saveInfo();\\n      if (inf) {\\n        uiText(ctx, '存档：第 ' + inf.floor + ' 层 · Lv.' + (inf.p ? inf.p.lv : '?') + ' · ◆' + (inf.p ? inf.p.gems : 0),\\n          cx, py + 126, '10px monospace', UI_SKIN.sub, false);\\n      }\\n\\n      /* 黑色分隔条（样图里条与条之间就是被黑线切开的） */\\n      ctx.fillStyle = UI_SKIN.ink; ctx.fillRect(ix, py + 146, iw, U);\\n\\n      /* 菜单条：1U 黑框 + 紫内填；选中那条整根反黑 */\\n      var bh = 48, gap = 10, by = py + 166;\\n      for (var i = 0; i < TITLE_ITEMS.length; i++) {\\n        var y = by + i * (bh + gap), sel = i === titleIdx;\\n        uiBar(ctx, ix, y, iw, bh, sel);\\n        var label = (sel ? '▶ ' : '   ') + TITLE_ITEMS[i];\\n        ctx.textAlign = 'center';\\n        ctx.font = 'bold 17px monospace';\\n        ctx.fillStyle = UI_SKIN.text;\\n        ctx.fillText(label, cx, y + bh / 2 + 6);\\n      }\\n\\n      /* 底部提示：面板内留白区（样图下面那一大片空的紫） */\\n      var tou = (typeof window !== 'undefined') && (('ontouchstart' in window) || (navigator && navigator.maxTouchPoints > 0));\\n      ctx.textAlign = 'center';\\n      uiText(ctx, tou ? '点屏幕 确认' : '↑↓ 选择 · 空格 确认', cx, py + ph - 84, 'bold 11px monospace', UI_SKIN.text, false);\\n      uiText(ctx, tou ? '游戏内点 ☰ 打开设置' : 'Q/E 切武器 · K 存档 · L 读档 · ESC 设置', cx, py + ph - 60, '10px monospace', UI_SKIN.sub, false);\\n      uiText(ctx, '打爆他们的脑阔', cx, py + ph - 34, '10px monospace', '#CDB6FF', false);\\n      ctx.textAlign = 'left';\\n    }\\n\\n    /* ================= v4.0 主控面板（ESC 唤出 · 纯常规设置） =================\\n       这里只有「正常玩家需要的东西」：音量、音效、操作说明、存读档、返回标题。\\n       调试用的「挂」不在这个面板里，也不在任何菜单/提示里出现 ——\\n       它只认游戏里连按三次 P（连他自己都懒得写在界面上）。\\n       ==================================================================== */\\n    var CFG_ITEMS = [\\n      { id: 'resume',  name: '继续游戏', kind: 'go',     hint: '回到地牢' },\\n      { id: 'sfx',     name: '音效',     kind: 'toggle', hint: '关掉就是静音' },\\n      { id: 'bgm',     name: '背景音乐', kind: 'toggle', hint: '程序合成的环境乐' },\\n      { id: 'vol',     name: '音量',     kind: 'range',  hint: '← → 调节' },\\n      { id: 'help',    name: '操作说明', kind: 'go',     hint: '键位与玩法' },\\n      { id: 'save',    name: '保存进度', kind: 'go',     hint: '写到本机存档' },\\n      { id: 'load',    name: '读取存档', kind: 'go',     hint: '回到上次存档' },\\n      { id: 'title',   name: '返回标题', kind: 'go',     hint: '当前进度不保留' },\\n      { id: 'restart', name: '重新开始', kind: 'go',     hint: '从第 1 层重来' }\\n    ];\\n    var CFG_VOLS = [0, 0.25, 0.5, 0.75, 1];\\n    var CFG_VOL_NAME = ['静音', '低', '中', '偏高', '高'];\\n\\n    function cfgVolIdx() {\\n      var best = 0, bd = 9;\\n      for (var i = 0; i < CFG_VOLS.length; i++) {\\n        var d = Math.abs(CFG_VOLS[i] - CFG.vol);\\n        if (d < bd) { bd = d; best = i; }\\n      }\\n      return best;\\n    }\\n    function cfgVolLabel() { return CFG_VOL_NAME[cfgVolIdx()] || String(Math.round(CFG.vol * 100)); }\\n    function cfgOpen() {\\n      CFG.open = true; CFG.idx = 0; CFG.confirm = null; CFG.help = false;\\n      SFX.shop();\\n    }\\n    function cfgClose() { CFG.open = false; CFG.confirm = null; CFG.help = false; }\\n\\n    function updateConfig(dt) {\\n      var inp = game.input;\\n      if (!CFG.open) return;\\n      if (CFG.help) {\\n        if (inp.justPressed('Escape') || inp.justPressed('space') || inp.justPressed('Enter') || inp.pointer.justDown) CFG.help = false;\\n        return;\\n      }\\n      if (CFG.confirm) {\\n        if (inp.justPressed('Escape') || inp.justPressed('KeyN')) { CFG.confirm = null; SFX.step(); return; }\\n        if (inp.justPressed('space') || inp.justPressed('Enter') || inp.justPressed('KeyY')) {\\n          var what = CFG.confirm; CFG.confirm = null; cfgClose();\\n          if (what === 'title') { titleInit(); }\\n          else { restart(); }\\n          SFX.shop();\\n        }\\n        return;\\n      }\\n      if (inp.justPressed('Escape')) { cfgClose(); return; }\\n      if (inp.justPressed('up') || inp.justPressed('KeyW')) { CFG.idx = (CFG.idx - 1 + CFG_ITEMS.length) % CFG_ITEMS.length; SFX.step(); }\\n      if (inp.justPressed('down') || inp.justPressed('KeyS')) { CFG.idx = (CFG.idx + 1) % CFG_ITEMS.length; SFX.step(); }\\n      var it = CFG_ITEMS[CFG.idx];\\n      if (it.kind === 'toggle') {\\n        if (inp.justPressed('left') || inp.justPressed('KeyA') || inp.justPressed('right') || inp.justPressed('KeyD')) {\\n          CFG.sfx = !CFG.sfx; cfgSave(); SFX.step();\\n        }\\n      } else if (it.kind === 'range') {\\n        if (inp.justPressed('left') || inp.justPressed('KeyA')) {\\n          CFG.vol = CFG_VOLS[Math.max(0, cfgVolIdx() - 1)]; cfgSave(); SFX.step();\\n        }\\n        if (inp.justPressed('right') || inp.justPressed('KeyD')) {\\n          CFG.vol = CFG_VOLS[Math.min(CFG_VOLS.length - 1, cfgVolIdx() + 1)]; cfgSave(); SFX.step();\\n        }\\n      }\\n      if (inp.justPressed('space') || inp.justPressed('Enter')) cfgActivate(it);\\n    }\\n    function cfgActivate(it) {\\n      if (!it) return;\\n      if (it.id === 'resume') { cfgClose(); return; }\\n      if (it.id === 'sfx') { CFG.sfx = !CFG.sfx; cfgSave(); SFX.step(); BGM.sync(); return; }\\n      if (it.id === 'bgm') { CFG.bgm = !CFG.bgm; cfgSave(); SFX.step(); BGM.sync(); return; }\\n      if (it.id === 'vol') { CFG.vol = CFG_VOLS[(cfgVolIdx() + 1) % CFG_VOLS.length]; cfgSave(); SFX.step(); return; }\\n      if (it.id === 'help') { CFG.help = true; SFX.shop(); return; }\\n      if (it.id === 'save') { cfgClose(); saveGame(); return; }\\n      if (it.id === 'load') { if (!hasSave()) { SFX.trap(); return; } cfgClose(); loadGame(); return; }\\n      if (it.id === 'title') { CFG.confirm = 'title'; SFX.trap(); return; }\\n      if (it.id === 'restart') { CFG.confirm = 'restart'; SFX.trap(); return; }\\n    }\\n\\n    /* 触控：点哪一行就选哪一行（第二下生效） */\\n    function cfgPointer(dt) {\\n      var inp = game.input;\\n      if (!CFG.open || CFG.help || CFG.confirm) return;\\n      if (!inp.pointer.justDown) return;\\n      var px = inp.pointer.x, py = inp.pointer.y;\\n      var g = CFG_LAY();\\n      for (var i = 0; i < CFG_ITEMS.length; i++) {\\n        var ry = g.y + g.TITLE_H + i * g.ROW;\\n        if (py >= ry && py <= ry + g.ROW && px >= g.x && px <= g.x + g.w) {\\n          if (CFG.idx === i) cfgActivate(CFG_ITEMS[i]);\\n          else { CFG.idx = i; SFX.step(); }\\n          return;\\n        }\\n      }\\n    }\\n\\n    /* 布局常量集中一处：绘制与命中检测共用，改一个数两边一起变 */\\n    function CFG_LAY() {\\n      var w = 300, ROW = 30, TITLE_H = 34, FOOT_H = 42;\\n      return {\\n        w: w, ROW: ROW, TITLE_H: TITLE_H, FOOT_H: FOOT_H,\\n        h: TITLE_H + CFG_ITEMS.length * ROW + FOOT_H,\\n        x: CW / 2 - w / 2, y: 84\\n      };\\n    }\\n\\n    function drawConfig(ctx) {\\n      if (!CFG.open) return;\\n      var g = CFG_LAY();\\n      var PADX = 16;\\n      /* 全屏压暗 */\\n      ctx.fillStyle = 'rgba(2,3,8,.86)'; ctx.fillRect(0, 0, CW, CH);\\n\\n      if (CFG.help) { drawCfgHelp(ctx); return; }\\n\\n      /* 底板 */\\n      ctx.fillStyle = 'rgba(10,13,20,.98)'; ctx.fillRect(g.x, g.y, g.w, g.h);\\n      ctx.strokeStyle = 'rgba(140,170,220,.55)'; ctx.lineWidth = 2;\\n      ctx.strokeRect(g.x + 1, g.y + 1, g.w - 2, g.h - 2);\\n\\n      ctx.textBaseline = 'middle';\\n      /* 标题行 */\\n      ctx.textAlign = 'left';\\n      ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 14px monospace';\\n      ctx.fillText('设  置', g.x + PADX, g.y + g.TITLE_H / 2);\\n      ctx.fillStyle = 'rgba(255,255,255,.10)';\\n      ctx.fillRect(g.x + PADX, g.y + g.TITLE_H - 1, g.w - PADX * 2, 1);\\n\\n      /* 行盒 */\\n      for (var i = 0; i < CFG_ITEMS.length; i++) {\\n        var it = CFG_ITEMS[i], sel = i === CFG.idx;\\n        var ry = g.y + g.TITLE_H + i * g.ROW;\\n        if (sel) {\\n          ctx.fillStyle = 'rgba(120,170,255,.16)';\\n          ctx.fillRect(g.x + 6, ry + 2, g.w - 12, g.ROW - 4);\\n          ctx.fillStyle = 'rgba(150,190,255,.95)';\\n          ctx.fillRect(g.x + 6, ry + 2, 3, g.ROW - 4);\\n        }\\n        ctx.textAlign = 'left';\\n        ctx.fillStyle = sel ? '#ffffff' : '#c2cddd';\\n        ctx.font = 'bold 12px monospace';\\n        ctx.fillText(it.name, g.x + PADX, ry + g.ROW / 2);\\n\\n        /* 右侧当前值 */\\n        ctx.textAlign = 'right';\\n        var vx = g.x + g.w - PADX;\\n        if (it.kind === 'toggle') {\\n          var on = (it.id === 'bgm') ? !!CFG.bgm : !!CFG.sfx;\\n          ctx.fillStyle = on ? 'rgba(40,150,95,.95)' : 'rgba(52,60,76,.95)';\\n          ctx.fillRect(vx - 34, ry + (g.ROW - 16) / 2, 34, 16);\\n          ctx.fillStyle = on ? '#c9ffdf' : '#8593a8';\\n          ctx.font = 'bold 10px monospace';\\n          ctx.fillText(on ? 'ON' : 'OFF', vx - 17, ry + g.ROW / 2);\\n        } else if (it.kind === 'range') {\\n          var idx = cfgVolIdx(), n = CFG_VOLS.length;\\n          var barW = 58, bx = vx - barW;\\n          for (var s = 0; s < n; s++) {\\n            ctx.fillStyle = (s < idx) ? 'rgba(150,190,255,.95)' : 'rgba(60,70,88,.9)';\\n            ctx.fillRect(bx + s * (barW / n), ry + (g.ROW - 10) / 2, barW / n - 2, 10);\\n          }\\n          ctx.fillStyle = '#c2cddd'; ctx.font = 'bold 10px monospace';\\n          ctx.fillText(cfgVolLabel(), vx, ry + g.ROW / 2);\\n          ctx.textAlign = 'right';\\n        } else {\\n          ctx.fillStyle = '#6f7c90'; ctx.font = '10px monospace';\\n          ctx.fillText(it.hint || '', vx, ry + g.ROW / 2);\\n        }\\n      }\\n\\n      /* 底部提示 */\\n      ctx.textAlign = 'center';\\n      ctx.fillStyle = '#8a97ae'; ctx.font = '10px monospace';\\n      ctx.fillText('↑↓ 选择 · ←→ 调节 · 空格 确认 · ESC 返回', g.x + g.w / 2, g.y + g.h - 16);\\n\\n      /* 二次确认 */\\n      if (CFG.confirm) {\\n        var tw = 268, th = 104, tx = CW / 2 - tw / 2, ty = CW / 2 - th / 2 + 60;\\n        ctx.fillStyle = 'rgba(6,8,14,.98)'; ctx.fillRect(tx, ty, tw, th);\\n        ctx.strokeStyle = '#ff8080'; ctx.lineWidth = 2; ctx.strokeRect(tx + 1, ty + 1, tw - 2, th - 2);\\n        ctx.textAlign = 'center';\\n        ctx.fillStyle = '#ffd0d0'; ctx.font = 'bold 12px monospace';\\n        ctx.fillText(CFG.confirm === 'title' ? '返回标题页？' : '重新开始？', CW / 2, ty + 30);\\n        ctx.fillStyle = '#9aa8bd'; ctx.font = '10px monospace';\\n        ctx.fillText(CFG.confirm === 'title' ? '当前进度不会自动保存。' : '会丢掉当前这一局的进度。', CW / 2, ty + 50);\\n        ctx.fillStyle = '#8ee6a0'; ctx.font = 'bold 11px monospace';\\n        ctx.fillText('Y / 空格 确认', CW / 2, ty + 74);\\n        ctx.fillStyle = '#8a6a6a'; ctx.font = '10px monospace';\\n        ctx.fillText('N / ESC 取消', CW / 2, ty + 90);\\n      }\\n      ctx.textAlign = 'left';\\n      ctx.textBaseline = 'alphabetic';\\n    }\\n\\n    /* 操作说明子页 */\\n    /* 说明文字一律控制在 20 个字以内 —— 画布只有 360px 宽，\\n       值列从 x+98 起排，20 个全角字 ≈ 200px，右边还剩 36px 安全边距。\\n       （上一版最长那句 20 字被右边缘裁掉了，截图上能直接看到。） */\\n    var CFG_HELP = [\\n      ['方向键 / WASD', '移动；撞到怪就是攻击'],\\n      ['空格', '原地等一回合（回能量）'],\\n      ['Q / E', '切换武器'],\\n      ['1 - 6', '释放技能（Shift 直选武器）'],\\n      ['K / L', '快速存档 / 读档'],\\n      ['ESC', '打开这个设置面板'],\\n      ['点击地板', '自动朝那一步走'],\\n      [ n            if (!d) continue;\\n            out.push({ kind: 'food', i: i, id: d.id, name: d.name, n: p.food[i].n,\\n                       color: d.color, desc: d.desc || '',\\n                       line: bagLine(d) });\\n          }\\n        }\\n        return out;\\n      }\\n      function bagSig() {\\n        var a = [], l = bagList();\\n        for (var i = 0; i < l.length; i++) a.push(l[i].kind + l[i].name + l[i].n + (l[i].cur ? '*' : ''));\\n        /* 血量也必须进签名：扣血后「体力已满」那行要变成「食用」，\\n           不然按钮一直停在 off、点不动（第一版就是这么卡的）。 */\\n        /* 血量 / 能量 / 中毒 / 增益 也必须进签名：这四个任何一个变了，\\n         「食用 / 饮用 / 体力已满 / 没有异常状态」就得跟着变 */\\n      return BAG.tab + '|' + BAG.sel + '|' +\\n             (p.hp >= p.maxHp ? 'F' : 'H') + (p.energy >= p.maxEnergy ? 'E' : 'e') +\\n             (p.poison > 0 ? 'P' : 'p') + (p.atkBuff ? 'B' : 'b') + '|' + a.join(',');\\n      }\\n\\n      /* 往格子里画图标。武器是图集精灵，食物是独立 PNG —— 两种来源，\\n         都走 canvas 是为了同一套像素放大规则（imageSmoothingEnabled=false）。 */\\n      function bagIcon(cv, it) {\\n        var S2 = cv.width, g = cv.getContext('2d');\\n        g.clearRect(0, 0, S2, S2);\\n        g.imageSmoothingEnabled = false;\\n        if (it.kind === 'weapon' && it.spr != null) {\\n          g.save();\\n          g.translate(S2 / 2, S2 / 2);\\n          try { sprite(g, it.spr, S2 * 0.72, false, 1); } catch (x) { }\\n          g.restore();\\n        } else if (it.kind === 'food') {\\n          var im = FOOD_IMG[it.id];\\n          if (im && im.complete && im.width) {\\n            g.drawImage(im, S2 * 0.03, S2 * 0.03, S2 * 0.94, S2 * 0.94);\\n          } else {\\n            /* 缺图的兜底：色块 + 名字首字。用户陆续在加食物，\\n               新食物先没有图也不能留一个空格子 */\\n            g.fillStyle = it.color || '#E8B315';\\n            g.fillRect(S2 * 0.10, S2 * 0.10, S2 * 0.80, S2 * 0.80);\\n            g.fillStyle = '#000';\\n            g.font = '900 ' + Math.round(S2 * 0.46) + 'px system-ui,sans-serif';\\n            g.textAlign = 'center';\\n            g.textBaseline = 'middle';\\n            g.fillText((it.name || '?').slice(0, 1), S2 / 2, S2 * 0.53);\\n          }\\n        }\\n      }\\n\\n      function paintBag() {\\n        shell();\\n        var card = doc.getElementById('__m_card');\\n        while (card.firstChild) card.removeChild(card.firstChild);\\n        card.className = 'mcard bag';\\n\\n        var x = div('mclose'); txt(x, '✕');\\n        x.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); BAG.open = false; });\\n        card.appendChild(x);\\n\\n        var h = div('mtitle'); txt(h, '背 包'); card.appendChild(h);\\n\\n        /* ---- 页签 ---- */\\n        var tabs = div('mbagtabs');\\n        for (var ti = 0; ti < BAG_TABS.length; ti++) {\\n          (function (key, label) {\\n            var t = div('mbagtab' + (BAG.tab === key ? ' on' : ''));\\n            txt(t, label);\\n            t.addEventListener('pointerdown', function (e) {\\n              e.preventDefault();\\n              if (BAG.tab === key) return;\\n              BAG.tab = key; BAG.sel = 0; paintBag();\\n            });\\n            tabs.appendChild(t);\\n          })(BAG_TABS[ti][0], BAG_TABS[ti][1]);\\n        }\\n        card.appendChild(tabs);\\n\\n        /* ---- 网格 ---- */\\n        var list = bagList();\\n        if (BAG.sel >= list.length) BAG.sel = Math.max(0, list.length - 1);\\n        var grid = div('mbaggrid');\\n        for (var ci = 0; ci < BAG_COLS * BAG_ROWS; ci++) {\\n          (function (idx) {\\n            var cell = div('mbagcell' + (idx === BAG.sel && list[idx] ? ' on' : ''));\\n            var it = list[idx];\\n            if (it) {\\n              var wrap = doc.createElement('em');\\n              var cv = doc.createElement('canvas');\\n              cv.width = cv.height = 96;\\n              wrap.appendChild(cv);\\n              cell.appendChild(wrap);\\n              bagIcon(cv, it);\\n              if (it.n > 1) { var nb = div('nb'); txt(nb, '×' + it.n); cell.appendChild(nb); }\\n              if (it.cur) { var eq = div('eq'); txt(eq, '装上'); cell.appendChild(eq); }\\n              cell.addEventListener('pointerdown', function (e) {\\n                e.preventDefault();\\n                BAG.sel = idx; paintBag();\\n              });\\n            }\\n            grid.appendChild(cell);\\n          })(ci);\\n        }\\n        card.appendChild(grid);\\n\\n        /* ---- 详情 ---- */\\n        var sel = list[BAG.sel];\\n        var info = div('mbaginfo');\\n        if (sel) {\\n          var nm = div('mn'); txt(nm, sel.name + (sel.n > 1 ? '  ×' + sel.n : ''));\\n          info.appendChild(nm);\\n          var ds = div('md'); txt(ds, sel.desc); info.appendChild(ds);\\n          var ef = div('me'); txt(ef, sel.line); info.appendChild(ef);\\n\\n          /* 两步操作：先选中，再按这里 —— 用户明确要「选中后按食用」，\\n             点了格子就吃太容易误触（一格 52px，拇指滑一下就没了）。 */\\n          var can = false, label = '', fn = null;\\n          if (sel.kind === 'food') {\\n            var _d = foodById(sel.id) || {};\\n            if (_d.cleanse) {\\n              can = (p.poison || 0) > 0;\\n              label = can ? '饮 用' : '没有异常状态';\\n            } else if (_d.buff) {\\n              can = !(p.atkBuff && p.atkBuff.until > Date.now());\\n              label = can ? '饮 用' : '药效还在';\\n            } else if (_d.energy) {\\n              can = p.hp < p.maxHp || p.energy < p.maxEnergy;\\n              label = can ? '饮 用' : '体力已满';\\n            } else {\\n              can = p.hp < p.maxHp;\\n              label = can ? '食 用' : '体力已满';\\n            }\\n            fn = function () { eatFood(sel.i); paintBag(); };\\n          } else if (sel.kind === 'weapon') {\\n            can = sel.i !== p.cur;\\n            label = sel.cur ? '已 装 上' : '装 备';\\n            fn = function () {\\n              p.cur = sel.i; p.weapon = p.bag[sel.i];\\n              try { SFX.loot(); } catch (x2) { }\\n              paintBag();\\n            };\\n          }\\n          var act = div('mbagact' + (can ? '' : ' off'));\\n          txt(act, label);\\n          if (can) {\\n            act.addEventListener('pointerdown', function (e) {\\n              e.preventDefault(); e.stopPropagation();\\n              try { fn(); } catch (x3) { }\\n            });\\n          }\\n          info.appendChild(act);\\n        } else {\\n          var em2 = div('mempty');\\n          txt(em2, BAG.tab === 'food' ? '背包里还没有食物。' : '还没有捡到武器。');\\n          info.appendChild(em2);\\n        }\\n        card.appendChild(info);\\n      }\\n\\n      function paint(s) {\\n        shell();\\n        var card = doc.getElementById('__m_card');\\n        while (card.firstChild) card.removeChild(card.firstChild);\\n\\n        if (s.close) {\\n          var x = div('mclose');\\n          txt(x, '✕');\\n          x.addEventListener('pointerdown', function (e) { e.preventDefault(); e.stopPropagation(); s.close(); });\\n          card.appendChild(x);\\n        }\\n        card.className = 'mcard' + (s.hero ? ' hero' : '');\\n        if (s.title) { var h = div('mtitle'); txt(h, s.title); card.appendChild(h); }\\n        if (s.sub) { var sb = div('msub'); sb.innerHTML = s.sub; card.appendChild(sb); }\\n        for (var i = 0; i < (s.items || []).length; i++) {\\n          var it = s.items[i];\\n          if (it && it.sec) { var sc = div('msec'); txt(sc, it.sec); card.appendChild(sc); continue; }\\n          card.appendChild(item(it));\\n        }\\n      }\\n\\n      /* ---------------- 状态 → 面板 ---------------- */\\n      function spec() {\\n        /* 1) 结束 / 通关 */\\n        if (over) {\\n          var its = [];\\n          /* v9.0 修：原来只看 won 判断「死没死」，而 victory() 打完第 1~3 章是\\n             over=true/won=false/chapPending=n —— 结果打完第一章 Boss 手机端弹的是\\n             「深渊吞没了你 · 体力耗尽 · 你倒在了第 12 层」，还给不了「进入下一章」。\\n             现在以 chapPending 为准：有下一章 = 通关。 */\\n          var _nx = (typeof chapPending === 'number' ? chapPending : 0);\\n          var _chapN = (chap && chap.id) ? chap.id : 1;\\n          var _bossName = (chap && chap.boss && chap.boss.name) ? chap.boss.name : (BOSS_NAME[floorNo] || '守护者');\\n          if (won) {\\n            its.push({ t: '你走到了深渊底部', tip: '这一局到此为止', dim: true });\\n          } else if (_nx > 0) {\\n            its.push({ t: '你击退了「' + _bossName + '」', tip: '第 ' + _chapN + ' 章 通关', dim: true });\\n          } else {\\n            its.push({ t: '你倒在了第 ' + floorNo + ' 层', tip: '体力耗尽', dim: true });\\n          }\\n          if (_nx > 0) {\\n            its.push({ t: '进入第 ' + _nx + ' 章', glyph: '▶', cls: 'primary', act: function () { enterChapter(chapPending); } });\\n          } else {\\n            its.push({ t: '再来一次', glyph: '↻', cls: 'primary', act: function () { restart(); storyOnEnter(1); } });\\n          }\\n          its.push({ t: '回到主菜单', glyph: '☰', act: goTitle });\\n          return { id: 'over', title: won ? '通 关' : (_nx > 0 ? ('第 ' + _chapN + ' 章 通 关') : '深 渊 吞 没 了 你'), sub: '', items: its };\\n        }\\n\\n        /* 2) 标题 / 主菜单 —— v9.4：已交还给 canvas 的 drawTitle()\\n           原来这里用卡片面板盖住了标题页（大标题 + 「新的深渊」按钮）。\\n           用户明确要回原来的样子 —— canvas 版那个大字带辉光的标题页更好看，\\n           所以这一支整个撤掉：spec() 不再接管标题，drawTitle() 直接露出来。\\n           注意：手机上走 updateTitle() 的 pointer.justDown 确认（点一下 = 选中的那项），\\n           「操作说明」仍在 ESC 设置面板里，不会丢。 */\\n\\n        /* 3) 设置 */\\n        if (CFG.open) {\\n          if (CFG.help) {\\n            return { id: 'cfghelp', title: '操 作 说 明', sub: '', items: helpItems(), close: function () { CFG.help = false; } };\\n          }\\n          if (CFG.confirm) {\\n            var what = CFG.confirm;\\n            return {\\n              id: 'cfgconfirm', title: what === 'title' ? '返回标题页？' : '重新开始？',\\n              sub: what === 'title' ? '当前进度不会自动保存。' : '会丢掉这一局的进度。',\\n              items: [\\n                { t: '确定', glyph: '✓', cls: 'primary', act: function () { CFG.confirm = null; if (what === 'title') { goTitle(); } else { cfgClose(); restart(); storyOnEnter(1); } } },\\n                { t: '取消', glyph: '✕', act: function () { CFG.confirm = null; } }\\n              ]\\n            };\\n          }\\n          /* v9.1：分成「进度 / 声音 / 其它」三组，开关类做成真开关，\\n             数值类做成 chip。分组标题用 .msec（不是 .mitem，不参与点击与计数）。 */\\n          var ci = [];\\n          ci.push({ sec: '进 度' });\\n          ci.push({ t: '继续游戏', glyph: '▶', cls: 'primary', act: function () { cfgClose(); } });\\n          /* 换武器：键盘是 Q/E 和「换」按钮，手机上那个按钮被新控件取代了 ——\\n             没有这一条，捡到第二把武器也换不了。右侧实时显示当前武器名。 */\\n          ci.push({\\n            t: '切换武器', glyph: '⚔', chip: true,\\n            right: (function () { var w = curWeapon(); return w ? w.name : '赤手空拳'; })(),\\n            tip: '依次轮换背包里的武器',\\n            act: function () { cycleWeapon(1); sig = ''; }\\n          });\\n          ci.push({ t: '保存进度', glyph: '⤓', act: function () { cfgClose(); saveGame(); } });\\n          ci.push({ t: '读取存档', glyph: '⤒', dim: !hasSave(), act: function () { if (!hasSave()) return; cfgClose(); loadGame(); } });\\n          ci.push({ sec: '声 音' });\\n          ci.push({\\n            t: '音效', glyph: '♪', sw: CFG.sfx ? 'on' : 'off',\\n            act: function () { CFG.sfx = !CFG.sfx; cfgSave(); SFX.step(); BGM.sync(); }\\n          });\\n          ci.push({\\n            t: '背景音乐', glyph: '♬', sw: CFG.bgm ? 'on' : 'off',\\n            act: function () { CFG.bgm = !CFG.bgm; cfgSave(); SFX.step(); BGM.sync(); }\\n          });\\n          ci.push({\\n            t: '音量', glyph: '◐', chip: true, right: CFG_VOL_NAME[cfgVolIdx()],\\n            act: function () { CFG.vol = CFG_VOLS[(cfgVolIdx() + 1) % CFG_VOLS.length]; cfgSave(); SFX.step(); }\\n          });\\n          ci.push({ sec: '其 它' });\\n          ci.push({ t: '操作说明', glyph: '?', act: function () { CFG.help = true; } });\\n          ci.push({ t: '返回标题', glyph: '☰', act: function () { CFG.confirm = 'title'; } });\\n          ci.push({ t: '重新开始', glyph: '↻', cls: 'danger', act: function () { CFG.confirm = 'restart'; } });\\n          return { id: 'cfg', title: '设 置', sub: '', items: ci, close: function |' + (s.close ? 1 : 0) + '|' + (s.hero ? 1 : 0) + '|' +\\n          s.items.map(function (i) {\\n            if (i.sec) return '#' + i.sec;\\n            return i.t + '/' + (i.right || '') + '/' + (i.sw || '') + '/' +\\n                   (i.dim ? 1 : 0) + '/' + (i.tip || '') + '/' + (i.chip ? 1 : 0);\\n          }).join(',');\\n        shell();\\n        R.style.display = '';\\n        if (key === sig) return;\\n        sig = key;\\n        paint(s);\\n      }\\n\\n      /* ---------------- 触控控件 ---------------- */\\n      function buildControls() {\\n        if (!ON) return;\\n        if (C && C.parentNode) return;\\n        var L = game.uiLayer;\\n        if (!L) return;\\n        var W = L.clientWidth || 390;\\n        var k = Math.max(0.72, Math.min(1.35, W / 390));\\n\\n        C = div('mctl');\\n        C.id = '__m_ctl';\\n\\n        /* --- 十字五键方向键（用户手绘样图）。\\n           18x18 像素网格画一只键：黑框 1 格 + 灰键面 #9CACB2 + 白色像素箭头；\\n           中间那格是「等」（四角青括号 + 菱形环 + 白芯）。\\n           网格取 18（偶数）—— 90 度旋转后像素仍落整格，不会糊边。 --- */\\n        var DP_G = 18;\\n        var DP_FACE = '#9CACB2', DP_FACE_ON = '#3C474B', DP_ORG = '#030607';\\n        var DP_CY = '#5FCFF7', DP_CY2 = '#A4E1F7';\\n\\n        /* 朝上的键面：r=1..6 逐级放宽（4,6,8,10,12,14），r>=7 满宽 16 */\\n        function dpUpFace(r, c) {\\n          if (r < 1 || r > 16) return false;\\n          var w = r >= 7 ? 16 : [0, 4, 6, 8, 10, 12, 14][r];\\n          var hw = w / 2;\\n          return c >= 9 - hw && c < 9 + hw;\\n        }\\n        /* 按方向把坐标反变换回「朝上」，五种键共用一套形状 */\\n        function dpFace(kind, r, c) {\\n          if (kind === 'wait') return r >= 1 && r <= 16 && c >= 1 && c <= 16;\\n          if (kind === 'up') return dpUpFace(r, c);\\n          if (kind === 'down') return dpUpFace(17 - r, 17 - c);\\n          if (kind === 'right') return dpUpFace(17 - c, r);\\n          return dpUpFace(c, 17 - r);\\n        }\\n        /* 描边 = 键面膨胀 1 格（沿对角线自然形成阶梯状黑边，跟样图一致） */\\n        function dpOut(kind, r, c) {\\n          if (dpFace(kind, r, c)) return false;\\n          for (var a = -1; a <= 1; a++) {\\n            for (var b = -1; b <= 1; b++) {\\n              var rr = r + a, cc = c + b;\\n              if (rr < 0 || cc < 0 || rr >= DP_G || cc >= DP_G) continue;\\n              if (dpFace(kind, rr, cc)) return true;\\n            }\\n          }\\n          return false;\\n        }\\n        /* 白箭头 10x10，居中放在 18 网格的 4..13 —— 10 是偶数，\\n           (4..13) 旋转回自己，不会偏心 1 格 */\\n        var DP_ART = [\\n          '...####...',\\n          '..######..',\\n          '##########',\\n          '##########',\\n          '##.####.##',\\n          '...####...',\\n          '...####...',\\n          '...####...',\\n          '...####...',\\n          '...####...'\\n        ];\\n        function dpUpArrow(r, c) {\\n          var y = r - 4, x = c - 4;\\n          if (y < 0 || y > 9 || x < 0 || x > 9) return 0;\\n          return DP_ART[y].charAt(x) === '#' ? 1 : 0;\\n        }\\n        function dpArrow(kind, r, c) {\\n          if (kind === 'up') return dpUpArrow(r, c);\\n          if (kind === 'down') return dpUpArrow(17 - r, 17 - c);\\n          if (kind === 'right') return dpUpArrow(17 - c, r);\\n          return dpUpArrow(c, 17 - r);\\n        }\\n        /* 「等」的徽章：12x12，放在键面（1..16）正中，占 3..14 */\\n        /* 14x14，放在键面（1..16）的 2..15 —— 左右各只留 1 格边距。\\n           原来是 12x12 放 3..14，留了 2 格，在 51px 的键上徽章明显偏小，\\n           跟样图「徽章几乎顶到黑框」的比例对不上。 */\\n        var DP_EQM = [\\n          'CC..........CC',\\n          'C............C',\\n          '...CC.CC.CC...',\\n          '...CC.CC.CC...',\\n          '.....CCCC.....',\\n          '...CCCCCCCC...',\\n          '...CCCLWCCC...',\\n          '...CCCLLCCC...',\\n          '...CCCCCCCC...',\\n          '.....CCCC.....',\\n          '...CC.CC.CC...',\\n          '...CC.CC.CC...',\\n          'C............C',\\n          'CC..........CC'\\n        ];\\n        function dpEq(r, c) {\\n          var y = r - 2, x = c - 2;\\n          if (y < 0 || y > 13 || x < 0 || x > 13) return '';\\n          return DP_EQM[y].charAt(x);\\n        }\\n        function dpDraw(cv, kind, on) {\\n          var g = cv.getContext('2d');\\n          if (!g) return;\\n          g.clearRect(0, 0, DP_G, DP_G);\\n          var r, c, ch;\\n          for (r = 0; r < DP_G; r++) {\\n            for (c = 0; c < DP_G; c++) {\\n              if (!dpOut(kind, r, c)) continue;\\n              g.fillStyle = DP_ORG;\\n              g.fillRect(c, r, 1, 1);\\n            }\\n          }\\n          for (r = 0; r < DP_G; r++) {\\n            for (c = 0; c < DP_G; c++) {\\n              if (!dpFace(kind, r, c)) continue;\\n              g.fillStyle = on ? DP_FACE_ON : DP_FACE;\\n              g.fillRect(c, r, 1, 1);\\n            }\\n          }\\n          if (kind === 'wait') {\\n            for (r = 0; r < DP_G; r++) {\\n              for (c = 0; c < DP_G; c++) {\\n                ch = dpEq(r, c);\\n                if (ch !== 'C' && ch !== 'L' && ch !== 'W') continue;\\n                g.fillStyle = ch === 'W' ? '#FFFFFF' : (ch === 'L' ? DP_CY2 : DP_CY);\\n                g.fillRect(c, r, 1, 1);\\n              }\\n            }\\n          } else {\\n            for (r = 0; r < DP_G; r++) {\\n              for (c = 0; c < DP_G; c++) {\\n                if (!dpArrow(kind, r, c)) continue;\\n                g.fillStyle = '#FFFFFF';\\n                g.fillRect(c, r, 1, 1);\\n              }\\n            }\\n          }\\n        }\\n\\n        /* 十字摆位：单键 S，整体 3S。样图五键几乎挨着，所以不留缝 */\\n        var D = Math.round(153 * k);\\n        var S = Math.floor(D / 3);\\n        var padW = S * 3;\\n        var pad = div('mdpad', 'left:' + Math.round(12 * k) + 'px;bottom:' + Math.round(16 * k) + 'px;' +\\n          'width:' + padW + 'px;height:' + padW + 'px;');\\n        pad.id = '__m_pad';\\n        pad._padBtn = false;   /* 声明这不是引擎的触控键，别被显隐逻辑波及 */\\n        var dpKeys = {};\\n        var dpList = [['up', 1, 0], ['left', 0, 1], ['wait', 1, 1], ['right', 2, 1], ['down', 1, 2]];\\n        for (var dq = 0; dq < dpList.length; dq++) {\\n          var dk = dpList[dq];\\n          var dcv = doc.createElement('canvas');\\n          dcv.width = DP_G;\\n          dcv.height = DP_G;\\n          dcv.style.cssText = 'left:' + (dk[1] * S) + 'px;top:' + (dk[2] * S) + 'px;' +\\n            'width:' + S + 'px;height:' + S + 'px;';\\n          if (dk[0] === 'wait') {\\n            dcv.setAttribute('data-label', 'wait');\\n            dcv.title = '等（原地等一回合）';\\n          }\\n          dpDraw(dcv, dk[0], false);\\n          pad.appendChild(dcv);\\n          dpKeys[dk[0]] = dcv;\\n        }\\n\\n        function mark(d) {\\n          var kk;\\n          for (kk in dpKeys) dpDraw(dpKeys[kk], kk, kk === d);\\n        }\\n        function setDir(d) {\\n          var name;\\n          for (name in DIRS) {\\n            if (name !== d) {\\n              if (held[name]) { game.input.keys[DIRS[name]] = false; held[name] = false; }\\n            }\\n          }\\n          if (d && !held[d]) {\\n            held[d] = true;\\n            game.input.keys[DIRS[d]] = true;\\n            game.input.just[DIRS[d]] = true;   /* 点一下就立刻走一格 */\\n          }\\n          if (d !== dpCur) { dpCur = d; mark(d); }\\n        }\\n        /* 中心那格是「等」：只吃 pointerdown，拖动经过不算，免得一路狂等 */\\n        function dpZone(ev) {\\n          var r = pad.getBoundingClientRect();\\n          var dx = (ev.clientX - (r.left + r.width / 2)) / r.width;\\n          var dy = (ev.clientY - (r.top + r.height / 2)) / r.height;\\n          if (Math.abs(dx) < 0.166 && Math.abs(dy) < 0.166) return 'wait';\\n          if (Math.abs(dx) > Math.abs(dy)) return dx > 0 ? 'right' : 'left';\\n          return dy > 0 ? 'down' : 'up';\\n        }\\n        function dpWait() {\\n          try {\\n            var ob = game.input.buttons['等'];\\n            if (!ob) return;\\n            ob.justDown = true;\\n            ob.down = true;\\n            setTimeout(function () { try { ob.down = false; } catch (x) { } }, 90);\\n          } catch (x) { }\\n        }\\n        var pid = null, dpCur = null, waitArmed = false;\\n        pad.addEventListener('pointerdown', function (ev) {\\n          ev.preventDefault();\\n          pid = ev.pointerId;\\n          try { pad.setPointerCapture(pid); } catch (x) { }\\n          var z = dpZone(ev);\\n          waitArmed = (z === 'wait');\\n          if (waitArmed) { dpWait(); setDir(null); if (dpCur !== 'wait') { dpCur = 'wait'; mark('wait'); } }\\n          else setDir(z);\\n          try { if (typeof AudioSys !== 'undefined') AudioSys.ensure(); } catch (x) { }\\n        });\\n        pad.addEventListener('pointermove', function (ev) {\\n          if (pid === null || ev.pointerId !== pid) return;\\n          ev.preventDefault();\\n          var z = dpZone(ev);\\n          if (z === 'wait') { setDir(null); if (waitArmed && dpCur !== 'wait') { dpCur = 'wait'; mark('wait'); } return; }\\n          waitArmed = false;\\n          setDir(z);\\n        });\\n        function padEnd(ev) {\\n          if (pid !== null && ev && ev.pointerId !== undefined && ev.pointerId !== pid) return;\\n          pid = null;\\n          waitArmed = false;\\n          setDir(null);\\n          if (dpCur !== null) { dpCur = null; mark(null); }\\n        }\\n        pad.addEventListener('pointerup', padEnd);\\n        pad.addEventListener('pointercancel', padEnd);\\n        pad.addEventListener('lostpointercapture', padEnd);\\n        C.appendChild(pad);\\n\\n        /* ★ pad / dpKeys / DP_* 全是 buildControls 的局部变量，外层对象拿不到，\\n           所以在这里现做一份只读快照，给回归脚本量几何、看像素点阵 */\\n        DPAPI = {\\n          keys: function () {\\n            var out = [], pr = pad.getBoundingClientRect();\\n            for (var kk in dpKeys) {\\n              var r = dpKeys[kk].getBoundingClientRect();\\n              out.push({ k: kk, l: r.left, t: r.top, w: r.width, h: r.height,\\n                         dx: r.left - pr.left, dy: r.top - pr.top });\\n            }\\n            out.sort(function (a, b) { return a.dy - b.dy || a.dx - b.dx; });\\n            return { pad: { l: pr.left, t: pr.top, w: pr.width, h: pr.height }, keys: out };\\n          },\\n          face: function (kind) {\\n            var rows = [], r, c, line;\\n            for (r = 0; r < DP_G; r++) {\\n              line = '';\\n              for (c = 0; c < DP_G; c++) {\\n                if (dpOut(kind, r, c)) line += '#';\\n                else if (kind === 'wait') {\\n                  var q = dpEq(r, c);\\n                  line += (q === 'C' || q === 'L' || q === 'W') ? q : '.';\\n                } else line += dpArrow(kind, r, c) ? 'A' : '.';\\n              }\\n              rows.push(line);\\n            }\\n            return rows;\\n          }\\n        };\\n\\n        /* --- 右下功能键 --- */\\n        function btn(label, glyph, size, x, y, fn, cls) {\\n          var s = Math.round(size * k);\\n          var b = div('mbtn' + (cls ? ' ' + cls : ''),\\n            'right:' + Math.round(x * k) + 'px;bottom:' + Math.round(y * k) + 'px;width:' + s + 'px;height:' + s + 'px;font-size:' + Math.round(size * 0.42 * k) + 'px;');\\n          b.textContent = glyph;\\n          b.setAttribute('data-label', label);\\n          b.addEventListener('pointerdown', function (ev) {\\n            ev.preventDefault();\\n            ev.stopPropagation();\\n            try { b.style.transform = 'scale(.94)'; } catch (x) { }\\n            if (typeof AudioSys !== 'undefined') { try { AudioSys.ensure(); } catch (x) { } }\\n            fn(true);\\n          });\\n          function up() { try { b.style.transform = ''; } catch (x) { } fn(false); }\\n          b.addEventListener('pointerup', up);\\n          b.addEventListener('pointercancel', up);\\n          b.addEventListener('pointerleave', up);\\n          C.appendChild(b);\\n          return b;\\n        }\\n\\n        /* ✓ 确认：直接喂 Space —— 战斗出招、对话继续、菜单确认全走这条路。\\n           右边三键竖着一列排，左中右分区不再互相挤。 */\\n        btn('ok', '✓', 58, 8, 14, function (down) {\\n          if (down) { game.input.just['Space'] = true; game.input.keys['Space'] = true; }\\n          else { game.input.keys['Space'] = false; }\\n        }, 'ok');\\n\\n        /* 背包：塞尔达式网格，捡了东西随时翻 */\\n        btn('bag', '包', 46, 22, 130, function (down) {\\n          if (!down) return;\\n          BAG.open = !BAG.open;\\n          BAG.sel = 0;\\n        }, 'menu');\\n\\n        /* ☰ 主菜单 */\\n        btn('menu', '☰', 46, 22, 76, function (down) {\\n          if (!down) return;\\n          if (CFG.open) { cfgClose(); return; }\\n          cfgOpen();\\n        }, 'menu');\\n\\n        /* --- 技能键：2 列 3 行，显示技能名首字。\\n           原来那 6 个「蓝色圆钮只有数字」被藏掉了 —— 数字对玩家没信息量，\\n           改成首字（穿/奥/治/震/终/血）+ 三态：未学会(灰) / 学会但能量不够(暗) / 可放(亮) --- */\\n        var SK_W = 40, SK_G = 6;\\n        /* 小屏（320 宽，k≈0.82）别再跟着缩 —— 低于 40px 手指点不准，\\n           这正是用户说的「十字键用起来不舒服」的同源问题 */\\n        var SKS = Math.max(40, Math.round(SK_W * k));\\n        /* ★ 步长必须按【实际按钮尺寸】算，不能按 40*k 算。\\n           以前的写法：位置 right/bottom 用 (96 + col*(SK_W+SK_G))*k 缩放，\\n           尺寸却是 max(40, 40*k) —— 小屏时尺寸不缩、位置缩了，两列/三行就叠在一起。\\n           实测（verify_skill_layout.js 的旧版对照）：320 宽叠 2px、280 宽叠 7px，\\n           横竖都叠。改成 STEP = 真实尺寸 + 真实间距 后，280~480 全过。 */\\n        var SK_STEP = SKS + Math.max(5, Math.round(SK_G * k));\\n        var SK_R0 = Math.round(96 * k);        /* 最右一列距屏幕右边的距离 */\\n        var SK_B0 = Math.round(18 * k);        /* 最下一行距屏幕底边的距离 */\\n        for (var s5 = 0; s5 < SKILLS.length; s5++) {\\n          (function (idx) {\\n            var col = idx % 2, row = Math.floor(idx / 2);\\n            var b2 = div('mskill lock',\\n              'right:' + (SK_R0 + col * SK_STEP) + 'px;' +\\n              'bottom:' + (SK_B0 + row * SK_STEP) + 'px;' +\\n              'width:' + SKS + 'px;height:' + SKS + 'px;' +\\n              'font-size:' + Math.max(14, Math.round(16 * k)) + 'px;');\\n            b2.setAttribute('data-skill', String(idx));\\n            b2.setAttribute('title', SKILLS[idx].name + '（EN ' + SKILLS[idx].cost + '）');\\n            /* 有手绘美术就上图（文字首字退场），没有就还是首字 */\\n            var _art = SKILL_ART[SKILLS[idx].id];\\n            if (_art) {\\n              b2.className = 'mskill art lock';\\n              b2.style.backgroundImage = _art;\\n            } else {\\n              b2.textContent = SKILLS[idx].name.slice(0, 1);\\n            }\\n            b2.addEventListener('pointerdown', function (ev) {\\n              ev.preventDefault();\\n              ev.stopPropagation();\\n              var ob = game.input.buttons[String(idx + 1)];\\n              if (ob) { ob.justDown = true; ob.down = true; }\\n              try { b2.style.transform = 'scale(.92)'; } catch (x) { }\\n              setTimeout(function () { try { b2.style.transform = ''; } catch (x) { } }, 90);\\n            });\\n            b2.addEventListener('pointerup', function () {\\n              var ob = game.input.buttons[String(idx + 1)];\\n              if (ob) ob.down = false;\\n            });\\n            C.appendChild(b2);\\n            skBtns.push(b2);\\n          })(s5);\\n        }\\n\\n        L.appendChild(C);\\n      }\\n\\n      /* 把引擎自带的箭头键 / 存读换↺ / 数字技能键藏掉：\\n         它们和新的圆盘、技能格重复，还是老手感（数字钮只有数字，没信息量） */\\n      function hideLegacy() {\\n        var L = game.uiLayer;\\n        if (!L || !L.children) return;\\n        var kill = { '▲': 1, '◀': 1, '▶': 1, '▼': 1, '换': 1, '存': 1, '读': 1, '↺': 1, '等': 1 };\\n        for (var i = 1; i <= SKILLS.length; i++) kill[String(i)] = 1;\\n        for (var i = 0; i < L.children.length; i++) {\\n          var el = L.children[i];\\n          if (!el || !el._padBtn) continue;\\n          var t = (el.textContent || '').trim();\\n          if (kill[t]) { el.style.display = 'none'; el.style.pointerEvents = 'none'; }\\n        }\\n      }\\n\\n      /* 技能格三态：未学会 / 学会但能量不够 / 可放 */\\n      function syncSkills() {\\n        for (var i = 0; i < skBtns.length; i++) {\\n          var own = p.skills.indexOf(i) >= 0;\\n          var art = !!SKILL_ART[SKILLS[i].id];\\n          var cls = 'mskill' + (art ? ' art' : '');\\n          if (!own) cls += ' lock';\\n          else if (p.energy >= SKILLS[i].cost) cls += ' ready';\\n          else if (art) cls += ' own';\\n          if (skBtns[i].className !== cls) skBtns[i].className = cls;\\n        }\\n      }\\n\\n      function tick() {\\n        if (!ON) return;\\n        installCSS();\\n        buildControls();\\n        hideLegacy();\\n        sync();\\n        try { syncSkills(); } catch (e) { }\\n        var blocked = titleOpen || storyOpen || over || CFG.open || CHEAT.on || Choice.on || shopOpen || shrineOpen || BAG.open;\\n        if (C) C.style.display = blocked ? 'none' : '';\\n        if (C && !blocked) {\\n          for (var si = 0; si < skBtns.length; si++) skBtns[si].style.display = '';\\n          var wb = C.querySelector('.mbtn[data-label=\\\"wait\\\"]');\\n          if (wb) wb.style.display = '';\\n          /* DPAD_v10_TICK：display 兜底。十字键被引擎「触控键显隐」一次性设成过 none，\\n             之后不恢复（实测手动置空后 2 秒内没有第二次写入）。\\n             那个函数只认 _padBtn，按理碰不到方向键，但写入点抓不到\\n             （CSSStyleDeclaration.prototype 上拿不到 display 的 setter），\\n             所以每帧兜底一次 —— 一次字符串比较，开销可忽略。 */\\n          var _pd = doc.getElementById('__m_pad');\\n          if (_pd && _pd.style.display === 'none') _pd.style.display = '';\\n        }\\n      }\\n\\n      /* 重开/切场景后控件可能被清掉，暴露一个重建入口 */\\n      function rebuild() {\\n        try { if (C && C.parentNode) C.parentNode.removeChild(C); } catch (e) { }\\n        try { if (R && R.parentNode) R.parentNode.removeChild(R); } catch (e) { }\\n        C = null; R = null; sig = '';\\n        skBtns = [];\\n      }\\n\\n      return {\\n        on: ON, tick: tick, sync: sync, rebuild: rebuild,\\n        /* ---- 十字键：自动化用（DPAD_v10）----\\n           pad / dpKeys / DP_* 都是 buildControls 的局部变量，外层拿不到，\\n           所以走 buildControls 里填好的 DPAPI 快照。 */\\n        dpKeys: function () { return DPAPI ? DPAPI.keys() : null; },\\n        dpFace: function (kind) { return DPAPI ? DPAPI.face(kind) : null; },\\n        /* ---- 背包：自动化用（BAGUI_v99）---- */\\n        bagOpen: function (v) { BAG.open = !!v; sig = ''; return BAG.open; },\\n        bagTab: function (t) { BAG.tab = t; BAG.sel = 0; sig = ''; return BAG.tab; },\\n        bagPick: function (i) { BAG.sel = i; paintBag(); return BAG.sel; },\\n        bagClick: function (what) {\\n          var el = doc.querySelector('#__m_card .' + what);\\n          if (!el) return false;\\n          el.dispatchEvent(new PointerEvent('pointerdown', { bubbles: true, cancelable: true }));\\n          return true;\\n        },\\n        bagState: function () {\\n          var l = bagList();\\n          return { open: BAG.open, tab: BAG.tab, sel: BAG.sel,\\n                   n: l.length, names: l.map(function (a) { return a.name + (a.n > 1 ? 'x' + a.n : ''); }) };\\n        },\\n        help: function (v) { helpOpen = !!v; sig = ''; },\\n        /* ---- 观测/自动化用（手机端回归测试靠这几个拿坐标） ---- */\\n        visible: function () { return !!(R && R.parentNode && R.style.display !== 'none'); },\\n        panel: function () {\\n          if (!R || R.style.display === 'none') return null;\\n          var h = doc.querySelector('#__m_card .mtitle');\\n          return h ? h.textContent : '';\\n        },\\n        itemRects: function () {\\n          var out = [], l = doc.querySelectorAll('#__m_card .mitem');\\n          for (var i = 0; i < l.length; i++) {\\n            var r = l[i].getBoundingClientRect();\\n            out.push({ t: (l[i].textContent || '').trim().slice(0, 14), x: r.left + r.width / 2, y: r.top + r.height / 2, dim: l[i].className.indexOf('dim') >= 0 });\\n          }\\n          return out;\\n        },\\n        closeRect: function () {\\n          var b = doc.querySelector('#__m_card .mclose');\\n          if (!b) return null;\\n          var r = b.getBoundingClientRect();\\n          return { x: r.left + r.width / 2, y: r.top + r.height / 2 };\\n        },\\n        ctlRect: function () {\\n          var b = doc.getElementById('__m_ctl');\\n          if (!b) return null;\\n          var r = b.getBoundingClientRect();\\n          return { x: r.left, y: r.top, w: r.width, h: r.height, shown: b.style.display !== 'none' };\\n        },\\n        padRect: function () {\\n          var p2 = doc.getElementById('__m_pad');\\n          if (!p2) return null;\\n          var r = p2.getBoundingClientRect();\\n          return { x: r.left, y: r.top, w: r.width, h: r.height };\\n        },\\n        btnRect: function (label) {\\n          var b = doc.querySelector('#__m_ctl .mbtn[data-label=\\\"' + label + '\\\"]');\\n          if (!b) return null;\\n          var r = b.getBoundingClientRect();\\n          return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width };\\n        },\\n        skillRects: function () {\\n          var out = [], l = doc.querySelectorAll('#__m_ctl .mskill');\\n          for (var i = 0; i < l.length; i++) {\\n            var r = l[i].getBoundingClientRect();\\n            out.push({\\n              i: i, t: (l[i].textContent || ''), cls: l[i].className,\\n              x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width\\n            });\\n          }\\n          return out;\\n        }\\n      };\\n    })();\\n\\n    /* ================= 主循环 ================= */\\n    var stepCd = 0, tapCd = 0;\\n    scene.onUpdate = function (dt) {\\n      animClock += dt;\\n      stepCd = Math.max(0, stepCd - dt); tapCd = Math.max(0, tapCd - dt);\\n      p.hitT = Math.max(0, p.hitT - dt);\\n      for (var mi = 0; mi < mons.length; mi++) mons[mi].hitT = Math.max(0, mons[mi].hitT - dt);\\n      var ease = Math.min(1, dt * 16);\\n      player.x += ((p.gx + 0.5) * TILE - player.x) * ease;\\n      player.y += ((p.gy + 0.5) * TILE - player.y) * ease;\\n      for (var i = 0; i < mons.length; i++) {\\n        var m = mons[i], e = monEnts[i];\\n        if (!e) continue;\\n        e.x += ((m.gx + 0.5) * TILE - e.x) * ease;\\n        e.y += ((m.gy + 0.5) * TILE - e.y) * ease;\\n      }\\n\\n      var inp = game.input;\\n\\n      /* v8.0：手机 UI 层每帧同步（面板 / 触控圆盘） */\\n      try { MOBILE.tick(); } catch (e) { if (!window.__MOBERR) { window.__MOBERR = String(e); } }\\n\\n      /* ---- v3.2.7：统一同步触控键显隐（必须最先执行！\\n         原来放在 titleOpen 分支之后，标题页直接 return 导致永远不执行） ---- */\\n      syncPad();\\n      /* v6.0：命中顿帧 —— 只冻结输入，粒子与动画继续跑 */\\n      VFX.update(dt); BGM.tick(dt);\\n      if (hitStop > 0) { hitStop = Math.max(0, hitStop - dt); return; }\\n\\n      /* ---- v4.0：主控面板最先响应（它一开，别的输入全让路）---- */\\n      updateConfig(dt); cfgPointer(dt);\\n      if (CFG.open) return;\\n\\n      /* ---- v6.0：遗物 / 事件选择面板（次高优先级，开了就吞掉一切输入）---- */\\n      updateChoice(dt);\\n      if (Choice.on) return;\\n\\n      /* ---- v3：标题页最先 ---- */\\n      if (titleOpen) { updateTitle(dt); return; }\\n\\n      /* ---- v3：调试面板优先 ---- */\\n      updateCheat(dt);\\n      if (CHEAT.on) return;\\n\\n      /* ---- v3：剧情窗口 ---- */\\n      if (storyOpen) {\\n        updateStory(dt);\\n        if (storyTimer > 0.5 && (inp.justPressed('space') || inp.justPressed('Enter') || inp.pointer.justDown)) storyOpen = false;\\n        return;\\n      }\\n\\n      /* ---- v4.0：ESC 打开主控面板（战斗 / 剧情 / 标题时不抢键）---- */\\n      if (inp.justPressed('Escape')) { cfgOpen(); return; }\\n\\n      /* ---- v3：武器切换（Q/E 循环，[ ] 也行） ---- */\\n      if (inp.justPressed('KeyQ') || inp.justPressed('BracketLeft')) { cycleWeapon(-1); return; }\\n      if (inp.justPressed('KeyE') || inp.justPressed('BracketRight')) { cycleWeapon(1); return; }\\n\\n      /* ---- v3：快存 / 快读（键盘 K/L，手机 W/S/L 按钮） ---- */\\n      if (inp.justPressed('KeyK') || inp.buttonJust('存')) { saveGame(); return; }\\n      if (inp.justPressed('KeyL') || inp.buttonJust('读')) { loadGame(); return; }\\n      if (inp.buttonJust('换')) { cycleWeapon(1); return; }\\n\\n      if (over) {\\n        if (inp.justPressed('KeyR') || inp.buttonJust('↺') || inp.justPressed('Space')) {\\n          if (chapPending > 0) { enterChapter(chapPending); }\\n          else restart();\\n        }\\n        return;\\n      }\\n      /* 神龛 / 商店：数字键选择 */\\n      if (shrineOpen) {\\n        for (var si = 0; si < SKILLS.length + 1 && si < 4; si++) {\\n          if (inp.justPressed('Digit' + (si + 1)) || inp.buttonJust(String(si + 1))) chooseShrine(si);\\n        }\\n        if (inp.justPressed('Escape') || inp.justPressed('Space')) { shrineOpen = false; shrineChoices = null; }\\n        return;\\n      }\\n      if (shopOpen) {\\n        if (inp.justPressed('Digit0') || inp.justPressed('Escape')) { shopOpen = false; log('你离开了商店。', '#9aa8bd'); }\\n        for (var qi = 0; qi < shopStock.length; qi++) {\\n          if (inp.justPressed('Digit' + (qi + 1))) buyFromShop(qi);\\n        }\\n        return;\\n      }\\n      /* 技能快捷键（Shift+数字 = 切武器，避免跟技能抢键） */\\n      var shiftHeld = inp.isDown('ShiftLeft') || inp.isDown('ShiftRight');\\n      for (var ki = 0; ki < SKILLS.length; ki++) {\\n        if (inp.justPressed('Digit' + (ki + 1)) || inp.buttonJust(String(ki + 1))) {\\n          if (shiftHeld) { switchWeapon(ki); return; }\\n          useSkill(ki); return;\\n        }\\n      }\\n      var dx = 0, dy = 0;\\n      if (inp.justPressed('left') || inp.justPressed('KeyA') || inp.buttonJust('◀')) dx = -1;\\n      else if (inp.justPressed('right') || inp.justPressed('KeyD') || inp.buttonJust('▶')) dx = 1;\\n      else if (inp.justPressed('up') || inp.justPressed('KeyW') || inp.buttonJust('▲')) dy = -1;\\n      else if (inp.justPressed('down') || inp.justPressed('KeyS') || inp.buttonJust('▼')) dy = 1;\\n      else if (stepCd <= 0) {\\n        if (inp.isDown('left') || inp.isDown('KeyA') || inp.buttonDown('◀')) dx = -1;\\n        else if (inp.isDown('right') || inp.isDown('KeyD') || inp.buttonDown('▶')) dx = 1;\\n        else if (inp.isDown('up') || inp.isDown('KeyW') || inp.buttonDown('▲')) dy = -1;\\n        else if (inp.isDown('down') || inp.isDown('KeyS') || inp.buttonDown('▼')) dy = 1;\\n        else if (inp.joy.active) {\\n          var ax = inp.joy.dx, ay = inp.joy.dy;\\n          if (Math.abs(ax) > 0.45 || Math.abs(ay) > 0.45) {\\n            if (Math.abs(ax) > Math.abs(ay)) dx = Math.sign(ax); else dy = Math.sign(ay);\\n          }\\n        }\\n      }\\n      if (dx || dy) { stepCd = CHEAT.speed ? 0.075 : 0.15; playerAct(dx, dy); return; }\\n      if (inp.justPressed('space') || inp.buttonJust('等')) { playerAct(0, 0); return; }\\n      if (inp.pointer.justDown && tapCd <= 0) {\\n        tapCd = 0.12;\\n        var wx = Math.floor((inp.pointer.x + scene.camera.ox) / TILE);\\n        var wy = Math.floor((inp.pointer.y + scene.camera.oy) / TILE);\\n        var ddx = Math.sign(wx - p.gx), ddy = Math.sign(wy - p.gy);\\n        if (ddx || ddy) {\\n          if (Math.abs(wx - p.gx) >= Math.abs(wy - p.gy)) playerAct(ddx, 0);\\n          else playerAct(0, ddy);\\n        }\\n      }\\n    };\\n\\n    /* ================================================================\\n       v6.0 · 武器词条 / 怪物词缀 / 随机事件\\n       ================================================================ */\\n    /* 武器词条：拾取时有 60% 概率附带一条（剧情武器不带） */\\n    var AFFIXES = [\\n      { id: 'sharp', name: '锋利', color: '#ff9d7a', desc: '攻击 +20%' },\\n      { id: 'leech', name: '汲取', color: '#e05a8a', desc: '命中回复 15% 伤害' },\\n      { id: 'rend',  name: '破甲', color: '#c9a0ff', desc: '无视敌人 30% 防御' },\\n      { id: 'swift', name: '迅捷', color: '#7ad8ff', desc: '15% 概率打完不惊动敌人' }\\n    ];\\n    function affixById(id) {\\n      for (var i = 0; i < AFFIXES.length; i++) if (AFFIXES[i].id === id) return AFFIXES[i];\\n      return null;\\n    }\\n    function rollAffix() {\\n      return Math.random() < 0.60 ? AFFIXES[rint(0, AFFIXES.length - 1)] : null;\\n    }\\n    function weaponAffix() {\\n      var w = curWeapon();\\n      return (w && w.affix) ? affixById(w.affix) : null;\\n    }\\n\\n    /* 怪物词缀：第 5 层起普通怪按概率带一个，名字前缀 + 数值变化 */\\n    var MON_AFFIX = [\\n      { id: 'berserk',  name: '狂暴', color: '#ff6b6b', desc: '攻击 +50%' },\\n      { id: 'armored',  name: '厚甲', color: '  function relicSt() { if (!p.relicSt) p.relicSt = {}; return p.relicSt; }\\n    function addRelic(id) {\\n      if (!p.relics) p.relics = [];\\n      if (hasRelic(id)) return false;\\n      p.relics.push(id);\\n      var r = relicById(id);\\n      if (r && r.pick) r.pick();\\n      return true;\\n    }\\n    /* 抽 n 个不重复、玩家尚未持有的遗物（按稀有度加权） */\\n    function rollRelics(n) {\\n      var pool = [], out = [], i, k;\\n      for (i = 0; i < RELICS.length; i++) {\\n        if (hasRelic(RELICS[i].id)) continue;\\n        var w = RELICS[i].rar === 0 ? 10 : (RELICS[i].rar === 1 ? 4 : 1);\\n        for (k = 0; k < w; k++) pool.push(RELICS[i]);\\n      }\\n      var guard = 0;\\n      while (out.length < n && pool.length && guard++ < 500) {\\n        var pick = pool[rint(0, pool.length - 1)];\\n        if (out.indexOf(pick) >= 0) continue;\\n        out.push(pick);\\n      }\\n      return out;\\n    }\\n\\n    /* ================================================================\\n       v6.0 · 通用选择面板 —— 遗物 / 随机事件 / 诅咒共用\\n       ================================================================ */\\n    var Choice = {\\n      on: false, title: '', sub: '', items: [], idx: 0, cb: null, t: 0,\\n      show: function (title, sub, items, cb) {\\n        Choice.on = true; Choice.title = title; Choice.sub = sub || '';\\n        Choice.items = items || []; Choice.idx = 0; Choice.cb = cb || null; Choice.t = 0;\\n        /* 面板是全屏的，DOM 触控键必须让位（它们在 canvas 上层，画布盖不住） */\\n        try { setPadVisible(false); _padOn = false; } catch (e) {}\\n      },\\n      pick: function (i) {\\n        if (!Choice.on || i < 0 || i >= Choice.items.length) return;\\n        var it = Choice.items[i];\\n        /* v6.0：条件不满足的选项直接拦掉，面板保持打开 */\\n        if (it && it.ok === false) { SFX.trap(); return; }\\n        Choice.on = false;\\n        try { setPadVisible(true); _padOn = true; } catch (e) {}\\n        if (Choice.cb) Choice.cb(it, i);\\n      }\\n    };\\n\\n    var CH_W = 288, CH_H = 62, CH_GAP = 12;\\n    func ic(it._id);\\n        var r = relicById(it._id);\\n        msg('✦ 获得遗物「' + r.name + '」：' + r.desc, RARITY[r.rar].color);\\n        fx.burst((p.gx + 0.5) * TILE, (p.gy + 0.5) * TILE, { color: RARITY[r.rar].color, count: 22, speed: 200 });\\n        SFX.loot();\\n      });\\n    }\\n\\n    /* ---- 攻击力：基础 + 武器 + 遗物加成 ---- */\\n    function baseAtk() { var w = curWeapon(); return p.atk + (w ? w.atk : 0); }\\n    function relicAtkBonus() {\\n      var base = baseAtk(), b = 0;\\n      if (hasRelic('whetstone')) b += 2;\\n      if (hasRelic('abyssheart')) b += Math.min(20, relicSt().abyssheart || 0);\\n      if (hasRelic('greedcup')) b += Math.floor(p.gems / 10);\\n      if (hasRelic('bloodpact')) b += Math.round(base * 0.30);\\n      return b;\\n    }\\n    function totalAtk() {\\n      var b = baseAtk() + relicAtkBonus();\\n      var af = weaponAffix();\\n      if (af && af.id === 'sharp') b = Math.round(b * 1.20);\\n      /* 力量泉水：限时攻击加成。秒表走真实时间，到点自动摘掉，\\n         这样中途存档/读档也不会留下一个永久的假增益。 *//* BUFF_v101 */\\n      if (p.atkBuff) {\\n        if (p.atkBuff.until > Date.now()) b = Math.round(b * p.atkBuff.mul);\\n        else p.atkBuff = null;\\n      }\\n      return b;\\n    }\\n\\n\\n    /* ================= v9.0 Boss 战表现层 =================\\n       即时战斗版的 Boss 演出。原「传说之下式」方框战场已整体移除，\\n       这里用「顶部血条 + 阶段演出 + 喷吐预警 + 屏幕后期」接管表现。\\n       全部是屏幕坐标（fixed 实体），不跟相机平移。\\n       ------------------------------------------------------------------\\n       时间基准：draw 没有 dt 参数，这里自己算（上一帧到现在，夹到 50ms），\\n       否则动画速度会随帧率漂。 */\\n    var BOSSUI = {\\n      lastT: 0, shown: false, seen: false,\\n      name: '', phase: -1, phaseName: '',\\n      ghost: 1,                       /* 掉血残影（0..1 的比例，慢慢追上真实血量） */\\n      fxStart: -9, fxName: '', fxDlg: '',\\n      lastCd: -1, fireT: -9, overT: -9, deadT: -9, dangerM: null, dangerAt: -9,\\n      H: 54                           /* 血条占位高度（日志据此下移） */\\n    };\\n\\n    function bossNow() {\\n      for (var i = 0; i < mons.length; i++) if (mons[i].boss && mons[i].hp > 0) return mons[i];\\n      return null;\\n    }\\n    function bossPhaseList(m) {\\n      if (m && m.bossDef && m.bossDef.phases && m.bossDef.phases.length) return m.bossDef.phases;\\n      return [{ name: '交战', dlg: '' }];\\n    }\\n    function bossPhaseIdx(m) {\\n      var n = bossPhaseList(m).length;\\n      if (n <= 1) return 0;\\n      var r = m.maxHp > 0 ? m.hp / m.maxHp : 0;\\n      if (n === 2) return r > 0.5 ? 0 : 1;\\n      return r > 0.66 ? 0 : (r > 0.33 ? 1 : 2);\\n    }\\n    function bossDist(m) { return Math.abs(m.gx - p.gx) + Math.abs(m.gy - p.gy); }\\n\\n    function _buRR(ctx, x, y, w, h, r) {\\n      if (w < 2 * r) r = w / 2;\\n      if (h < 2 * r) r = h / 2;\\n      ctx.beginPath();\\n      ctx.moveTo(x + r, y);\\n      ctx.arcTo(x + w, y, x + w, y + h, r);\\n      ctx.arcTo(x + w, y + h, x, y + h, r);\\n      ctx.arcTo(x, y + h, x, y, r);\\n      ctx.arcTo(x, y, x + w, y, r);\\n      ctx.closePath();\\n    }\\n\\n    /* 屏幕后期：低血红边 + Boss 压迫暗角 ---------------------------------- */\\n    function drawScreenFx(ctx, now) {\\n      var ratio = p.maxHp > 0 ? (p.hp / p.maxHp) : 1;\\n      var m = bossNow();\\n      var lowA = 0;\\n      if (ratio < 0.30) {\\n        var t = (0.30 - ratio) / 0.30;                 /* 0 → 1 */\\n        var pulse = 0.55 + 0.45 * Math.sin(now * (1.6 + t * 3.2));\\n        lowA = (0.16 + t * 0.46) * pulse;\\n      }\\n      var bossA = m ? 0.30 : 0;\\n      if (lowA > 0.001) {\\n        /* 低血：四边向内的红色呼吸带（比径向渐变更容易被判读） */\\n        var edge = ctx.createLinearGradient(0, 0, 0, CH);\\n        edge.addColorStop(0, 'rgba(200,16,16,' + Math.min(0.62, lowA).toFixed(3) + ')');\\n        edge.addColorStop(0.20, 'rgba(200,16,16,0)');\\n        edge.addColorStop(0.80, 'rgba(200,16,16,0)');\\n        edge.addColorStop(1, 'rgba(200,16,16,' + Math.min(0.62, lowA).toFixed(3) + ')');\\n        ctx.save(); ctx.fillStyle = edge; ctx.fillRect(0, 0, CW, CH);\\n        var edge2 = ctx.createLinearGradient(0, 0, CW, 0);\\n        edge2.addColorStop(0, 'rgba(200,16,16,' + Math.min(0.5, lowA * 0.8).toFixed(3) + ')');\\n        edge2.addColorStop(0.16, 'rgba(200,16,16,0)');\\n        edge2.addColorStop(0.84, 'rgba(200,16,16,0)');\\n        edge2.addColorStop(1, 'rgba(200,16,16,' + Math.min(0.5, lowA * 0.8).toFixed(3) + ')');\\n        ctx.fillStyle = edge2; ctx.fillRect(0, 0, CW, CH);\\n        ctx.restore();\\n      }\\n      if (bossA <= 0.001) return;\\n      var g = ctx.createRadialGradient(CW / 2, CH / 2, Math.min(CW, CH) * 0.26,\\n                                       CW / 2, CH / 2, Math.max(CW, CH) * 0.72);\\n      g.addColorStop(0, 'rgba(0,0,0,0)');\\n      g.addColorStop(0.62, 'rgba(28,0,8,' + (bossA * 0.55).toFixed(3) + ')');\\n      g.addColorStop(1, 'rgba(28,0,8,' + bossA.toFixed(3) + ')');\\n      ctx.save();\\n      ctx.fillStyle = g;\\n      ctx.fillRect(0, 0, CW, CH);\\n      ctx.restore();\\n    }\\n\\n    /* 喷吐危险区：Boss 蓄力时把它 6 格射程画出来（世界坐标） ----------------\\n       喷吐是「距离 ≤6 就必中」，所以唯一解法是退出这个菱形。\\n       把范围画出来，玩家才看得懂「退到 7 格以外」是什么意思。 */\\n    function drawBossDanger(ctx, m, now) {\\n      var R = 6;\\n      var pulse = 0.5 + 0.5 * Math.sin(now * 8.5);\\n      ctx.save();\\n      for (var dy = -R; dy <= R; dy++) {\\n        var span = R - Math.abs(dy);\\n        var yy = m.gy + dy;\\n        if (yy < 0 || yy >= MH) continue;\\n        var x0 = Math.max(0, m.gx - span), x1 = Math.min(MW - 1, m.gx + span);\\n        if (x1 < x0) continue;\\n        ctx.fillStyle = 'rgba(255,60,30,' + (0.045 + 0.055 * pulse).toFixed(3) + ')';\\n        ctx.fillRect(x0 * TILE, yy * TILE, (x1 - x0 + 1) * TILE, TILE);\\n      }\\n      ctx.strokeStyle = 'rgba(255,96,52,' + (0.32 + 0.42 * pulse).toFixed(3) + ')';\\n      ctx.lineWidth = 1.5;\\n      ctx.beginPath();\\n      ctx.moveTo((m.gx + 0.5) * TILE, (m.gy - R) * TILE);\\n      ctx.lineTo((m.gx + R + 0.5) * TILE, (m.gy + 0.5) * TILE);\\n      ctx.lineTo((m.gx + 0.5) * TILE, (m.gy + R + 1) * TILE);\\n      ctx.lineTo((m.gx - R + 0.5) * TILE, (m.gy + 0.5) * TILE);\\n      ctx.closePath(); ctx.stroke();\\n      var bx = (m.gx + 0.5) * TILE, by = (m.gy + 0.5) * TILE;\\n      ctx.strokeStyle = 'rgba(255,116,74,' + (0.45 + 0.45 * pulse).toFixed(3) + ')';\\n      ctx.lineWidth = 2;\\n      ctx.beginPath();\\n      ctx.arc(bx, by, TILE * (0.62 + 0.14 * pulse), 0, 6.2832);\\n      ctx.stroke();\\n      ctx.restore();\\n    }\\n\\n    function drawBossUI(ctx) {\\n      var now = (typeof performance !== 'undefined' ? performance.now() : Date.now()) / 1000;\\n      var dt = BOSSUI.lastT ? Math.min(0.05, Math.max(0, now - BOSSUI.lastT)) : 0.016;\\n      BOSSUI.lastT = now;\\n\\n      drawScreenFx(ctx, now);\\n\\n      var m = bossNow();\\n      /* ---- 无 Boss：收条 + 一次「击破」演出 ---- */\\n      if (!m) {\\n        if (BOSSUI.seen) {\\n          BOSSUI.seen = false; BOSSUI.deadT = now;\\n          if (typeof logText !== 'undefined' && logText) logText.y = 82;\\n        }\\n        BOSSUI.shown = false; BOSSUI.phase = -1; BOSSUI.ghost = 1; BOSSUI.dangerM = null;\\n        var dAge = now - BOSSUI.deadT;\\n        if (dAge >= 0 && dAge < 1.7) {\\n          var dk = dAge / 1.7;\\n          ctx.save();\\n          ctx.globalAlpha = Math.min(1, (1 - dk) * 1.6);\\n          ctx.textAlign = 'center'; ctx.textBaseline = 'middle';\\n          ctx.fillStyle = '#ffe6b0';\\n          ctx.font = 'bold 26px system-ui,sans-serif';\\n          ctx.fillText('击　破', CW / 2, CH * 0.34);\\n          ctx.fillStyle = 'rgba(255,230,176,.55)';\\n          ctx.fillRect(CW / 2 - 62 * (1 - dk), CH * 0.34 + 22, 124 * (1 - dk), 1.2);\\n          ctx.restore();\\n        }\\n        return;\\n      }\\n\\n      var d = bossDist(m);\\n      var engage = m.alerted || m.hitT > 0 || d <= 8 || BOSSUI.shown;\\n      if (!engage) { BOSSUI.shown = false; BOSSUI.dangerM = null; return; }\\n\\n      /* ---- 首次接触：入场演出 ---- */\\n      if (!BOSSUI.seen) {\\n        BOSSUI.seen = true; BOSSUI.shown = true;\\n        BOSSUI.ghost = 1; BOSSUI.phase = -1; BOSSUI.lastCd = m.cd;\\n        BOSSUI.fxStart = now; BOSSUI.fxName = bossPhaseList(m)[0].name;\\n        BOSSUI.fxDlg = bossPhaseList(m)[0].dlg || '';\\n        if (game.scene && game.scene.camera) game.scene.camera.shake(8, 0.28);\\n        vfxFlash('#ff5b3b', 0.22);\\n        if (typeof SFX !== 'undefined' && SFX.skill) SFX.skill();\\n        /* v9.3：Boss 睁眼时清场。\\n           四个角落的杂兵（尤其「夺宝贼」AI=swarm）会一路跟进 Boss 房贴脸，\\n           把 1v1 的巨眼战变成被背刺 —— CDP 实测同一份配平下，\\n           没杂兵插手掉 6.7 血/回合、被插手掉 12.3 血/回合，胜率正好掷硬币。\\n           它们本来就在别的房间，Boss 一睁眼就退回黑暗，不抢 Boss 的戏。 */\\n        var _cleared = 0;\\n        for (var _mi = mons.length - 1; _mi >= 0; _mi--) {\\n          if (!mons[_mi].boss) { mons.splice(_mi, 1); _cleared++; }\\n        }\\n        if (_cleared > 0) log('巨眼睁开，低阶的东西退回了黑暗里。', '#b7a6ff');\\n      }\\n      BOSSUI.shown = true;\\n\\n      /* ---- 阶段推进 ---- */\\n      var pi = bossPhaseIdx(m);\\n      if (pi !== BOSSUI.phase) {\\n        var pl = bossPhaseList(m);\\n        if (BOSSUI.phase >= 0) {\\n          BOSSUI.fxStart = now;\\n          BOSSUI.fxName = pl[pi] ? pl[pi].name : '';\\n          BOSSUI.fxDlg = (pl[pi] && pl[pi].dlg) || '';\\n          if (game.scene && game.scene.camera) game.scene.camera.shake(10, 0.34);\\n          vfxFlash('#ff3b2b', 0.30);\\n          if (typeof SFX !== 'undefined' && SFX.skill) SFX.skill();\\n        }\\n        BOSSUI.phase = pi;\\n        /* 阶段机制：越往后喷吐越密，单口伤害相应下调。\\n           cd 3 = 每 3 回合一口 / 2 = 每 2 回合 / 1 = 每回合。\\n           每回合压力（占体力上限，v9.3 单口基准由 14% 降到 11.5%）：\\n             phase1: 11.5%/3 + 11.5%*0.2 = 6.1%   phase2: 10.4%/3 + 2.1% = 5.5%\\n             phase3:  7.1%/1 + 1.4% = 8.5%   —— 逐阶段加压但不秒人；\\n           满血 135 时 phase3 约 11.5 血/回合，仍能撑 11 回合以上。 */\\n        var _pc = [[3, 1.00], [2, 0.90], [1, 0.62]][Math.min(pi, 2)];\\n        if (m.atk0 == null) m.atk0 = m.atk;\\n        m.fireCd = _pc[0];\\n        m.atk = Math.max(4, Math.round(m.atk0 * _pc[1]));\\n      }\\n      BOSSUI.phaseName = bossPhaseList(m)[pi].name || '';\\n\\n      /* ---- 喷吐预警 / 命中检测 ---- */\\n      if (BOSSUI.lastCd >= 0 && m.cd > BOSSUI.lastCd && BOSSUI.lastCd <= 1) {\\n        BOSSUI.fireT = now;                       /* cd 1 → 0 喷吐 → 重置 2，判断为「刚喷过」 */\\n        if (game.scene && game.scene.camera) game.scene.camera.shake(7, 0.2);\\n        if (d <= 7) vfxFlash('#ff5a4a', 0.16);\\n      }\\n      BOSSUI.lastCd = m.cd;\\n      var charging = (m.cd === 1 && d <= 6);\\n      BOSSUI.dangerM = charging ? m : null;   /* 世界层据此画射程 */\\n      BOSSUI.dangerAt = now;\\n\\n      /* ---- 掉血残影 ---- */\\n      var real = m.maxHp > 0 ? m.hp / m.maxHp : 0;\\n      if (BOSSUI.ghost < real) BOSSUI.ghost = real;\\n      else BOSSUI.ghost += (real - BOSSUI.ghost) * Math.min(1, dt * 2.6);\\n\\n      /* ================= 面板 ================= */\\n      var PAD = 10, W = CW - PAD * 2, X = PAD, Y = 80, H = BOSSUI.H;\\n      if (typeof logText !== 'undefined' && logText && logText.y !== Y + H + 6) logText.y = Y + H + 6;\\n\\n      ctx.save();\\n      /* 底板：暗玻璃 + 冷边 + 顶部血色高光 */\\n      var _sh = m.hitT > 0 ? Math.sin(now * 90) * m.hitT * 2.2 : 0;\\n      ctx.translate(_sh, 0);\\n      ctx.fillStyle = 'rgba(10,8,14,.86)';\\n      _buRR(ctx, X, Y, W, H, 9); ctx.fill();\\n      ctx.strokeStyle = charging ? 'rgba(255,90,60,' + (0.45 + 0.35 * Math.sin(now * 9)).toFixed(3) + ')'\\n                                 : 'rgba(255,120,90,.28)';\\n      ctx.lineWidth = 1; _buRR(ctx, X + 0.5, Y + 0.5, W - 1, H - 1, 9); ctx.stroke();\\n      var _hl = ctx.createLinearGradient(X, Y, X, Y + 3);\\n      _hl.addColorStop(0, 'rgba(255,120,80,.55)');\\n      _hl.addColorStop(1, 'rgba(255,120,80,0)');\\n      ctx.fillStyle = _hl;\\n      _buRR(ctx, X + 9, Y + 1, W - 18, 3, 1.5); ctx.fill();\\n\\n      /* 姓名 + 血量 */\\n      ctx.textBaseline = 'middle'; ctx.textAlign = 'left';\\n      ctx.fillStyle = '#ffd9c8';\\n      ctx.font = 'bold 12px system-ui,-apple-system,\\\"PingFang SC\\\",sans-serif';\\n      ctx.fillText('◆ ' + m.name, X + 10, Y + 15);\\n      ctx.text  = 0;\n    (function findCanvas() {\n      var g = window.GOBArogue;\n      if (g && g.ready && g.canvas) {\n        if (window.GD) GD.__rogueCanvas = g.canvas;\n        if (window.GD) GD.__rogue = g;\n        return;\n      }\n      if (runner && !(g && g.ready)) {\n        var all = runner.querySelectorAll('canvas');\n        for (var i = 0; i < all.length; i++) {\n          var par = all[i].parentNode;\n          var cls = (par && par.className) ? String(par.className) : '';\n          // Studio 自己的画布在 .frame 里；肉鸽的挂在 runner 下、父节点是普通 div.wrap\n          if (cls.indexOf('frame') < 0 && all[i].width === 360) {\n            if (window.GD) GD.__rogueCanvas = all[i];\n            break;\n          }\n        }\n      }\n      if (++grab < 60) setTimeout(findCanvas, 60);\n    })();\n  } catch (e) {\n    if (window.GD && GD.log) GD.log('肉鸽启动失败：' + e.message, 'err');\n  }\n}\n"},{"id":"n4","type":"camera","name":"相机","x":0,"y":0,"w":0,"h":0,"rot":0,"z":0,"alpha":1,"visible":true,"p":{"follow":true,"lerp":0.14,"shake":0,"bounds":false},"zz":0,"s":""}]},{"name":"关于","w":360,"h":640,"bg":"#0b0e16","nodes":[{"id":"n12","type":"label","name":"关于标题","x":20,"y":40,"w":113,"h":34,"rot":0,"z":0,"alpha":1,"visible":true,"p":{"text":"打爆他们的脑阔","size":26,"color":"#ffd93d","align":"left","bold":true,"fixed":false,"font":""},"zz":0,"s":""},{"id":"n13","type":"label","name":"关于正文","x":20,"y":90,"w":2040,"h":18,"rot":0,"z":0,"alpha":1,"visible":true,"p":{"text":"用 GOBAgame 引擎 + Kenney「Tiny Dungeon」素材做的\n类 Rogue 地牢探险。\n\n· 纯 ES5、零依赖，整包打成单文件 HTML\n· 双击即玩，可直接传手机\n· 12 层地牢，逐层变难\n· 怪物六种 AI：直线追 / 远程 / 打了就退 / 群起 / 首领\n· 主动技能 + 冷却、神龛三选一、流浪商人、可砸木桶、尖刺陷阱\n· 精英怪、连击统计、第 12 层首领「深渊主宰」\n\n操作：方向键 / WASD 移动，空格攻击，1-4 放技能。","size":14,"color":"#c9d4e3","align":"left","bold":false,"fixed":false,"font":""},"zz":0,"s":""}]}]};
var buildScene = function buildScene(D, Goba, holder) {
  var game = new Goba.Game({ width: D.w, height: D.h, parent: holder });
  /* 场景表：D.scenes 多于一个时支持切场景；只有一个时行为与以前完全一致。
     注意：所有运行时代码必须留在 buildScene 内部——导出时这里会被 toString() 序列化。 */
  var defs = (D.scenes && D.scenes.length) ? D.scenes
    : [{ name: D.name || '场景', w: D.w, h: D.h, bg: D.bg, nodes: D.nodes || [] }];
  var byName = {};
  defs.forEach(function (d, i) { if (!d.name) d.name = '场景' + (i + 1); byName[d.name] = d; });
  /* S = 当前场景的运行时状态。api / 事件回调都从这里取，
     所以切场景后脚本里的 scene / goto 会自动指向新场景。 */
  var S = { scene: null, runners: [], name: null, dw: D.w, dh: D.h };
  var scene = null, started = false;

  function build(d) {
    /* 换场景要把上一场景的虚拟摇杆 / 按钮（DOM 层）一起清掉，否则会叠在一起 */
    if (started && game.input.clearControls) game.input.clearControls();
    started = true;
    var DW = d.w || D.w, DH = d.h || D.h;
    scene = new Goba.Scene(game);
    scene.bg = d.bg || D.bg; scene.worldWidth = DW; scene.worldHeight = DH;
    S.scene = scene; S.name = d.name; S.dw = DW; S.dh = DH; S.runners = [];
    var hero = null, tiles = [], parts = [], runners = S.runners, snds = [], timers = [];

  function say(m, k) {
    if (typeof window !== 'undefined' && window.GD && window.GD.log) window.GD.log('[脚本] ' + m, k || 'info');
  }
  /* 脚本编译：约定 onReady() / onUpdate(dt) / onClick() / onTimer(n) 四个钩子 */
  function compile(code) {
    try {
      var make = new Function('self', 'node', 'scene', 'game', 'Goba', 'api', 'dt',
        '"use strict";\n' + code +
        '\n;return { onReady: typeof onReady === "function" ? onReady : null,' +
        ' onUpdate: typeof onUpdate === "function" ? onUpdate : null,' +
        ' onClick: typeof onClick === "function" ? onClick : null,' +
        ' onTimer: typeof onTimer === "function" ? onTimer : null };');
      return { ok: true, make: make };
    } catch (e) { return { ok: false, err: e.message }; }
  }

  /* 脚本工具箱（导出后的单文件游戏里同样可用）
     scene 一律走 S.scene —— 切场景后脚本里的 scene 自动指向新场景 */
  var api = {
    log: function (m) { say(String(m)); },
    beep: function (f, d, w) { Goba.audio.beep(f || 660, d || 0.08, w || 'square', 0.12); },
    /* 播放素材库里导入的音频（需要在素材库导入过，或导出时已内联） */
    play: function (key, o) { return Goba.sound ? Goba.sound.play(key, o) : null; },
    stop: function (key) { if (Goba.sound) Goba.sound.stop(key); },
    mute: function (on) { return Goba.sound ? Goba.sound.mute(on) : false; },
    soundKeys: function () { return Goba.sound ? Object.keys(Goba.sound.pool) : []; },
    /* 场景切换：api.goto('结算')，名字就是场景树里显示的场景名 */
    goto: function (name) { return gotoScene(name); },
    sceneName: function () { return S.name; },
    sceneList: function () { return Object.keys(byName); },
    fx: function (x, y, color, n) {
      new Goba.Particles(S.scene, { count: n || 10, speed: 130, life: 0.5, size: 4, color: color || '#ffd93d' }).burst(x, y);
    },
    spawn: function (tex, x, y, o) {
      o = o || {};
      var t = tex && Goba.Tex.get(tex);

<style id="__fix_canvas">
  /* Studio 导出会同时建两块画布：buildScene 的「设计稿画布」+ 游戏脚本自建的「运行画布」。
     这里只保留运行画布，并且禁止 flex 把它拉宽（否则 360x640 会被横向拉伸）。 */
  body > div { flex: 0 0 auto !important; }
</style>
<script>
(function(){
  var tries = 0;
  function fix(){
    tries++;
    var G = window.GOBArogue;
    if (!G || !G.ready || !G.canvas) { if (tries < 400) setTimeout(fix, 80); return; }
    var keep = G.canvas, keepWrap = keep.parentNode;
    var all = document.querySelectorAll('canvas');
    for (var i = 0; i < all.length; i++) {
      var c = all[i];
      if (c === keep) continue;
      var w = c.parentNode;
      (w && w.tagName === 'DIV' ? w : c).style.display = 'none';
    }
    if (keepWrap && keepWrap.style) {
      keepWrap.style.flex = '0 0 auto';
      keepWrap.style.margin = '0 auto';
    }
    window.__CANVAS_FIXED = true;
    window.__CANVAS_KEPT = keep.width + 'x' + keep.height;
  }
  var kick = function(){ setTimeout(fix, 30); };
  if (document.readyState === 'complete') kick();
  else window.addEventListener('load', kick);
  document.addEventListener('DOMContentLoaded', kick);
})();
</script>
